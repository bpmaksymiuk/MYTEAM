<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Buddy</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel" data-theme="light">
    <header class="panel-header">
      <h1 class="brand-title">
        <span>Chrome</span>
        <img id="brand-icon" src="pnp.png" alt="Chrome Buddy logo" width="18" height="18">
        <span>Buddy</span>
      </h1>
      <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </header>

    <nav class="tabs" aria-label="Main tabs">
      <button id="tab-notes" class="tab-btn active" aria-label="Notes tab">NOTES</button>
      <button id="tab-options" class="tab-btn" aria-label="Options tab">OPTIONS</button>
    </nav>

    <section id="view-notes" class="tab-view active">
      <div class="toolbar" role="toolbar" aria-label="Notes actions">
        <button id="add-btn" class="icon-btn" title="Add note" aria-label="Add note">＋</button>
        <button id="capture-btn" class="icon-btn" title="Capture page region" aria-label="Capture page region">⌗</button>
        <button id="cancel-btn" class="icon-btn" title="Cancel capture" aria-label="Cancel capture" disabled>✕</button>
        <button id="copy-btn" class="icon-btn" title="Copy selected note" aria-label="Copy selected note" disabled>⧉</button>
        <button id="edit-btn" class="icon-btn" title="Edit selected note" aria-label="Edit selected note" disabled>✎</button>
        <button id="delete-btn" class="icon-btn" title="Delete selected note" aria-label="Delete selected note" disabled>🗑</button>
      </div>

      <div class="view-toggle" role="group" aria-label="View mode">
        <button id="list-view-btn" class="icon-btn active" title="List view" aria-label="List view">☰</button>
        <button id="grid-view-btn" class="icon-btn" title="Grid view" aria-label="Grid view">▦</button>
    </div>

    <p id="status-text" class="status-text"></p>

      <ul id="notes-list" class="notes-list list"></ul>
    </section>

    <section id="view-options" class="tab-view">
      <div class="options-group">
        <h2>Theme</h2>
        <label><input type="radio" name="theme" value="light"> Light</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
      </div>

      <div class="options-group">
        <h2>Default Notes View</h2>
        <label><input type="radio" name="view" value="list"> List</label>
        <label><input type="radio" name="view" value="grid"> Grid</label>
      </div>
    </section>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>

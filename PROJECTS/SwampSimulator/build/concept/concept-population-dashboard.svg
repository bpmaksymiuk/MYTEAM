<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="sans-serif" font-size="13">
  <rect width="1200" height="800" fill="#1a2620"/>
  <rect x="0" y="0" width="1200" height="48" fill="#0d1410"/>
  <text x="20" y="30" fill="#cde3c4" font-weight="bold">SwampSimulator — Population Dashboard</text>

  <!-- Line chart -->
  <g transform="translate(40,80)">
    <rect width="720" height="380" fill="#0d1410" stroke="#3d5a3a"/>
    <text x="10" y="20" fill="#cde3c4" font-weight="bold">Population vs Time (Day 0 — Day 90)</text>
    <!-- axes -->
    <line x1="50" y1="60" x2="50" y2="350" stroke="#3d5a3a"/>
    <line x1="50" y1="350" x2="710" y2="350" stroke="#3d5a3a"/>
    <text x="20" y="80" fill="#888" font-size="10">200</text>
    <text x="20" y="200" fill="#888" font-size="10">100</text>
    <text x="20" y="350" fill="#888" font-size="10">0</text>
    <text x="50" y="370" fill="#888" font-size="10">D0</text>
    <text x="350" y="370" fill="#888" font-size="10">D45</text>
    <text x="690" y="370" fill="#888" font-size="10">D90</text>

    <!-- lines -->
    <polyline fill="none" stroke="#5a8a4a" stroke-width="2" points="50,200 150,180 250,160 350,170 450,150 550,140 650,160 710,150"/>
    <polyline fill="none" stroke="#aa9933" stroke-width="2" points="50,250 150,240 250,220 350,200 450,190 550,200 650,210 710,220"/>
    <polyline fill="none" stroke="#cc6633" stroke-width="2" points="50,280 150,270 250,260 350,240 450,210 550,180 650,160 710,140"/>
    <polyline fill="none" stroke="#cc3344" stroke-width="2.5" points="50,310 150,310 250,310 350,310 450,310 550,310 650,330 710,340"/>
    <polyline fill="none" stroke="#7a5aaa" stroke-width="2" points="50,290 150,290 250,285 350,280 450,275 550,270 650,265 710,260"/>

    <!-- legend -->
    <g transform="translate(560,75)" font-size="11" fill="#cde3c4">
      <rect width="140" height="100" fill="#0d1410" stroke="#3d5a3a"/>
      <line x1="10" y1="20" x2="30" y2="20" stroke="#5a8a4a" stroke-width="2"/><text x="38" y="24">Producers</text>
      <line x1="10" y1="38" x2="30" y2="38" stroke="#aa9933" stroke-width="2"/><text x="38" y="42">Primaries</text>
      <line x1="10" y1="56" x2="30" y2="56" stroke="#cc6633" stroke-width="2"/><text x="38" y="60">Frogs *</text>
      <line x1="10" y1="74" x2="30" y2="74" stroke="#cc3344" stroke-width="2"/><text x="38" y="78">Alligator</text>
      <line x1="10" y1="92" x2="30" y2="92" stroke="#7a5aaa" stroke-width="2"/><text x="38" y="96">Decompose</text>
    </g>
  </g>

  <!-- Biomass stacked bar -->
  <g transform="translate(40,490)">
    <rect width="720" height="280" fill="#0d1410" stroke="#3d5a3a"/>
    <text x="10" y="20" fill="#cde3c4" font-weight="bold">Biomass by Trophic Level (current)</text>
    <g transform="translate(40,50)">
      <rect width="640" height="40" fill="#5a8a4a"/><text x="320" y="26" text-anchor="middle" fill="#fff" font-size="11">Producers — 62%</text>
      <rect y="50" width="380" height="40" fill="#aa9933"/><text x="190" y="76" text-anchor="middle" fill="#fff" font-size="11">Primary — 22%</text>
      <rect y="100" width="200" height="40" fill="#cc6633"/><text x="100" y="126" text-anchor="middle" fill="#fff" font-size="11">Secondary — 11%</text>
      <rect y="150" width="55" height="40" fill="#cc3344"/><text x="80" y="176" fill="#cde3c4" font-size="11">Apex 3%</text>
      <rect y="200" width="40" height="40" fill="#7a5aaa"/><text x="80" y="226" fill="#cde3c4" font-size="11">Decomp 2%</text>
    </g>
  </g>

  <!-- Alert panel -->
  <g transform="translate(800,80)" fill="#cde3c4">
    <rect width="360" height="690" fill="#0d1410" stroke="#3d5a3a"/>
    <text x="14" y="24" font-weight="bold">Alerts</text>
    <line x1="0" y1="36" x2="360" y2="36" stroke="#3d5a3a"/>
    <g transform="translate(14,50)" font-size="11">
      <rect width="332" height="60" fill="#3a1a1a" stroke="#cc3344" rx="3"/>
      <text x="10" y="20" fill="#ffaaaa" font-weight="bold">⚠ EXTINCTION</text>
      <text x="10" y="38">River Otter — population 0</text>
      <text x="10" y="52" fill="#888">Day 47 · pollution event</text>
    </g>
    <g transform="translate(14,130)" font-size="11">
      <rect width="332" height="50" fill="#3a2a1a" stroke="#cc8833" rx="3"/>
      <text x="10" y="20" fill="#ffcc99" font-weight="bold">⚠ AT RISK</text>
      <text x="10" y="40">Bass — 8% of baseline</text>
    </g>
    <g transform="translate(14,200)" font-size="11">
      <rect width="332" height="50" fill="#1a2a3a" stroke="#3388cc" rx="3"/>
      <text x="10" y="20" fill="#99ccff" font-weight="bold">ℹ EVENT</text>
      <text x="10" y="40">Algae bloom started · Day 52</text>
    </g>
    <g transform="translate(14,270)" font-size="11">
      <rect width="332" height="50" fill="#1a2a3a" stroke="#3388cc" rx="3"/>
      <text x="10" y="20" fill="#99ccff" font-weight="bold">ℹ EVENT</text>
      <text x="10" y="40">Drought ending · Day 60</text>
    </g>
  </g>

  <text x="20" y="790" fill="#cde3c4" font-size="11" opacity="0.7">CB-003 · Population Dashboard · UC-004</text>
</svg>

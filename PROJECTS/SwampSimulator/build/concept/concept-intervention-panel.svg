<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="sans-serif" font-size="13">
  <rect width="1200" height="800" fill="#1a2620"/>
  <rect x="0" y="0" width="1200" height="48" fill="#0d1410"/>
  <text x="20" y="30" fill="#cde3c4" font-weight="bold">SwampSimulator — Intervention Panel</text>

  <!-- Species column -->
  <g transform="translate(40,80)">
    <rect width="540" height="690" fill="#0d1410" stroke="#3d5a3a"/>
    <text x="14" y="24" fill="#cde3c4" font-weight="bold">Species</text>
    <line x1="0" y1="36" x2="540" y2="36" stroke="#3d5a3a"/>
    <g font-size="12" fill="#cde3c4">
      <!-- row template -->
      <g transform="translate(14,50)">
        <text font-weight="bold">Alligator</text><text x="120" fill="#888">pop: 3</text>
        <rect x="280" y="-15" width="50" height="22" fill="#3d5a3a" rx="3"/><text x="290" y="0" fill="#fff">+1</text>
        <rect x="340" y="-15" width="60" height="22" fill="#3d5a3a" rx="3"/><text x="350" y="0" fill="#fff">+10</text>
        <rect x="410" y="-15" width="100" height="22" fill="#5a2a2a" rx="3"/><text x="420" y="0" fill="#fff">Remove all</text>
      </g>
      <g transform="translate(14,90)">
        <text font-weight="bold">Heron</text><text x="120" fill="#888">pop: 12</text>
        <rect x="280" y="-15" width="50" height="22" fill="#3d5a3a" rx="3"/><text x="290" y="0" fill="#fff">+1</text>
        <rect x="340" y="-15" width="60" height="22" fill="#3d5a3a" rx="3"/><text x="350" y="0" fill="#fff">+10</text>
        <rect x="410" y="-15" width="100" height="22" fill="#5a2a2a" rx="3"/><text x="420" y="0" fill="#fff">Remove all</text>
      </g>
      <g transform="translate(14,130)">
        <text font-weight="bold" fill="#ffaaaa">Dragonfly</text><text x="120" fill="#888">pop: 0</text>
        <rect x="280" y="-15" width="50" height="22" fill="#3d5a3a" rx="3"/><text x="290" y="0" fill="#fff">+1</text>
        <rect x="340" y="-15" width="60" height="22" fill="#3d5a3a" rx="3"/><text x="350" y="0" fill="#fff">+10</text>
        <rect x="410" y="-15" width="100" height="22" fill="#444" rx="3"/><text x="420" y="0" fill="#888">— removed —</text>
      </g>
      <g transform="translate(14,170)">
        <text font-weight="bold">Frog</text><text x="120" fill="#888">pop: 84 ↑</text>
        <rect x="280" y="-15" width="50" height="22" fill="#3d5a3a" rx="3"/><text x="290" y="0" fill="#fff">+1</text>
        <rect x="340" y="-15" width="60" height="22" fill="#3d5a3a" rx="3"/><text x="350" y="0" fill="#fff">+10</text>
        <rect x="410" y="-15" width="100" height="22" fill="#5a2a2a" rx="3"/><text x="420" y="0" fill="#fff">Remove all</text>
      </g>
      <g transform="translate(14,210)">
        <text font-weight="bold">Mosquito</text><text x="120" fill="#888">pop: 312 ↑↑</text>
        <rect x="280" y="-15" width="50" height="22" fill="#3d5a3a" rx="3"/><text x="290" y="0" fill="#fff">+1</text>
        <rect x="340" y="-15" width="60" height="22" fill="#3d5a3a" rx="3"/><text x="350" y="0" fill="#fff">+10</text>
        <rect x="410" y="-15" width="100" height="22" fill="#5a2a2a" rx="3"/><text x="420" y="0" fill="#fff">Remove all</text>
      </g>
      <text x="14" y="270" fill="#888" font-style="italic">… (scrollable: 25 species total)</text>
    </g>
    <!-- Restore baseline button -->
    <rect x="14" y="640" width="510" height="36" fill="#3d5a3a" rx="4"/>
    <text x="270" y="664" text-anchor="middle" fill="#fff" font-weight="bold">↻  Restore Baseline</text>
  </g>

  <!-- Environmental events column -->
  <g transform="translate(600,80)">
    <rect width="560" height="690" fill="#0d1410" stroke="#3d5a3a"/>
    <text x="14" y="24" fill="#cde3c4" font-weight="bold">Environmental Events</text>
    <line x1="0" y1="36" x2="560" y2="36" stroke="#3d5a3a"/>
    <g font-size="12" fill="#cde3c4">
      <g transform="translate(14,60)">
        <rect width="250" height="80" fill="#2a3a4a" stroke="#3388cc" rx="4"/>
        <text x="14" y="24" font-weight="bold">💧 Trigger Flood</text>
        <text x="14" y="44" fill="#aaa" font-size="11">Raises water level</text>
        <text x="14" y="60" fill="#aaa" font-size="11">Expands aquatic zones</text>
      </g>
      <g transform="translate(280,60)">
        <rect width="250" height="80" fill="#4a3a2a" stroke="#cc8833" rx="4"/>
        <text x="14" y="24" font-weight="bold">☀ Trigger Drought</text>
        <text x="14" y="44" fill="#aaa" font-size="11">Lowers water level</text>
        <text x="14" y="60" fill="#aaa" font-size="11">Concentrates predators</text>
      </g>
      <g transform="translate(14,160)">
        <rect width="250" height="80" fill="#3a2a4a" stroke="#7a5aaa" rx="4"/>
        <text x="14" y="24" font-weight="bold">☣ Trigger Pollution</text>
        <text x="14" y="44" fill="#aaa" font-size="11">Sensitive species die first</text>
      </g>
      <g transform="translate(280,160)">
        <rect width="250" height="80" fill="#2a3a3a" stroke="#5a8a8a" rx="4"/>
        <text x="14" y="24" font-weight="bold">❄ Trigger Cold Snap</text>
        <text x="14" y="44" fill="#aaa" font-size="11">Cold-blooded torpor</text>
      </g>
      <g transform="translate(14,260)">
        <rect width="250" height="80" fill="#4a2a2a" stroke="#cc3344" rx="4"/>
        <text x="14" y="24" font-weight="bold">🔥 Trigger Fire (shoreline)</text>
        <text x="14" y="44" fill="#aaa" font-size="11">Burns sawgrass/cattails</text>
      </g>
      <g transform="translate(280,260)">
        <rect width="250" height="80" fill="#3a4a2a" stroke="#88aa44" rx="4"/>
        <text x="14" y="24" font-weight="bold">🌾 Nutrient Runoff</text>
        <text x="14" y="44" fill="#aaa" font-size="11">Spike → algae bloom risk</text>
      </g>

      <!-- Active events -->
      <text x="14" y="380" font-weight="bold">Active</text>
      <line x1="14" y1="390" x2="546" y2="390" stroke="#3d5a3a"/>
      <text x="14" y="412" fill="#ffcc99">☀ Drought · day 4 of est. 7</text>
      <text x="14" y="432" fill="#aaa" font-size="11">Water at 58% · oxygen low</text>
    </g>
  </g>

  <text x="20" y="790" fill="#cde3c4" font-size="11" opacity="0.7">CB-004 · Intervention Panel · UC-005 / UC-006</text>
</svg>

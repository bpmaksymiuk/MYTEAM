<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="sans-serif" font-size="13">
  <rect width="1200" height="800" fill="#1a2620"/>
  <rect x="0" y="0" width="1200" height="48" fill="#0d1410"/>
  <text x="20" y="30" fill="#cde3c4" font-weight="bold">SwampSimulator — Food Web</text>
  <text x="800" y="30" fill="#888" font-size="11">Hover edges for energy flow · Click node to highlight chain</text>

  <!-- legend -->
  <g transform="translate(20,80)" fill="#cde3c4">
    <text font-weight="bold">Trophic Layer</text>
    <circle cx="10" cy="20" r="6" fill="#5a8a4a"/><text x="22" y="24">Producer</text>
    <circle cx="10" cy="40" r="6" fill="#aa9933"/><text x="22" y="44">Primary</text>
    <circle cx="10" cy="60" r="6" fill="#cc6633"/><text x="22" y="64">Secondary</text>
    <circle cx="10" cy="80" r="6" fill="#cc3344"/><text x="22" y="84">Apex</text>
    <circle cx="10" cy="100" r="6" fill="#7a5aaa"/><text x="22" y="104">Decomposer</text>
    <text y="140" font-size="11">Node radius = population</text>
    <text y="156" font-size="11">Red border = species at risk</text>
    <text y="172" font-size="11">Edge thickness = energy flow</text>
  </g>

  <!-- nodes (force-directed, manually laid) -->
  <!-- producers (bottom) -->
  <g><circle cx="220" cy="650" r="22" fill="#5a8a4a"/><text x="220" y="654" text-anchor="middle">Algae</text></g>
  <g><circle cx="380" cy="700" r="18" fill="#5a8a4a"/><text x="380" y="704" text-anchor="middle">Duckweed</text></g>
  <g><circle cx="600" cy="720" r="20" fill="#5a8a4a"/><text x="600" y="724" text-anchor="middle">Cattails</text></g>
  <g><circle cx="800" cy="690" r="18" fill="#5a8a4a"/><text x="800" y="694" text-anchor="middle">Lilies</text></g>
  <g><circle cx="1000" cy="710" r="16" fill="#5a8a4a"/><text x="1000" y="714" text-anchor="middle">Sawgrass</text></g>

  <!-- primaries -->
  <g><circle cx="150" cy="480" r="14" fill="#aa9933"/><text x="150" y="484" text-anchor="middle">M.larv</text></g>
  <g><circle cx="290" cy="500" r="14" fill="#aa9933"/><text x="290" y="504" text-anchor="middle">Tadp</text></g>
  <g><circle cx="450" cy="520" r="16" fill="#aa9933"/><text x="450" y="524" text-anchor="middle">Crayfish</text></g>
  <g><circle cx="600" cy="500" r="13" fill="#aa9933"/><text x="600" y="504" text-anchor="middle">Snail</text></g>
  <g><circle cx="750" cy="490" r="15" fill="#aa9933"/><text x="750" y="494" text-anchor="middle">Turtle</text></g>
  <g><circle cx="900" cy="510" r="14" fill="#aa9933"/><text x="900" y="514" text-anchor="middle">Duck</text></g>

  <!-- secondaries -->
  <g><circle cx="220" cy="320" r="16" fill="#cc6633"/><text x="220" y="324" text-anchor="middle">Frog</text></g>
  <g><circle cx="380" cy="300" r="14" fill="#cc6633"/><text x="380" y="304" text-anchor="middle">Drgnfly</text></g>
  <g><circle cx="520" cy="340" r="16" fill="#cc6633"/><text x="520" y="344" text-anchor="middle">Catfish</text></g>
  <g><circle cx="680" cy="320" r="16" fill="#cc6633"/><text x="680" y="324" text-anchor="middle">Bass</text></g>
  <g><circle cx="820" cy="340" r="14" fill="#cc6633"/><text x="820" y="344" text-anchor="middle">Snake</text></g>
  <g><circle cx="960" cy="320" r="16" fill="#cc6633"/><text x="960" y="324" text-anchor="middle">Raccoon</text></g>

  <!-- apex (top) -->
  <g><circle cx="350" cy="160" r="18" fill="#cc3344"/><text x="350" y="164" text-anchor="middle">Heron</text></g>
  <g><circle cx="550" cy="120" r="22" fill="#cc3344" stroke="#fff" stroke-width="2"/><text x="550" y="124" text-anchor="middle" fill="#fff" font-weight="bold">Alligator</text></g>
  <g><circle cx="750" cy="160" r="14" fill="#cc3344"/><text x="750" y="164" text-anchor="middle">Otter</text></g>
  <g><circle cx="900" cy="140" r="14" fill="#cc3344"/><text x="900" y="144" text-anchor="middle">Osprey</text></g>

  <!-- decomposers (right) -->
  <g><circle cx="1100" cy="450" r="13" fill="#7a5aaa"/><text x="1100" y="454" text-anchor="middle">Vulture</text></g>
  <g><circle cx="1130" cy="560" r="11" fill="#7a5aaa"/><text x="1130" y="564" text-anchor="middle">Firefly</text></g>
  <g><circle cx="1100" cy="650" r="12" fill="#7a5aaa"/><text x="1100" y="654" text-anchor="middle">Beaver</text></g>

  <!-- edges (predator -> prey) shown as light lines -->
  <g stroke="#888" stroke-opacity="0.4" fill="none">
    <line x1="350" y1="160" x2="220" y2="320"/>
    <line x1="350" y1="160" x2="680" y2="320"/>
    <line x1="350" y1="160" x2="820" y2="340"/>
    <line x1="550" y1="120" x2="680" y2="320" stroke-width="3" stroke="#fff" stroke-opacity="0.8"/>
    <line x1="550" y1="120" x2="820" y2="340"/>
    <line x1="550" y1="120" x2="350" y2="160"/>
    <line x1="750" y1="160" x2="680" y2="320"/>
    <line x1="900" y1="140" x2="680" y2="320"/>
    <line x1="220" y1="320" x2="380" y2="300" stroke-dasharray="2,2"/>
    <line x1="220" y1="320" x2="150" y2="480"/>
    <line x1="380" y1="300" x2="150" y2="480"/>
    <line x1="520" y1="340" x2="450" y2="520"/>
    <line x1="520" y1="340" x2="600" y2="500"/>
    <line x1="680" y1="320" x2="290" y2="500"/>
    <line x1="680" y1="320" x2="450" y2="520"/>
    <line x1="290" y1="500" x2="220" y2="650"/>
    <line x1="150" y1="480" x2="220" y2="650"/>
    <line x1="900" y1="510" x2="380" y2="700"/>
    <line x1="750" y1="490" x2="800" y2="690"/>
    <line x1="450" y1="520" x2="600" y2="720" stroke-dasharray="2,2"/>
  </g>

  <!-- highlighted chain example: Alligator -> Bass -> Tadpole -> Algae -->
  <g stroke="#ffd34a" stroke-width="3" fill="none" opacity="0.9">
    <line x1="550" y1="120" x2="680" y2="320"/>
    <line x1="680" y1="320" x2="290" y2="500"/>
    <line x1="290" y1="500" x2="220" y2="650"/>
  </g>

  <!-- Caption -->
  <text x="20" y="780" fill="#cde3c4" font-size="11" opacity="0.7">CB-002 · Food Web Graph · UC-003 (Alligator-selected, dependency chain highlighted)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="sans-serif" font-size="13">
  <rect width="1200" height="800" fill="#1a2620"/>
  <rect x="0" y="0" width="1200" height="48" fill="#0d1410"/>
  <text x="20" y="30" fill="#cde3c4" font-weight="bold">SwampSimulator — Save / Load</text>

  <g transform="translate(200,100)" fill="#cde3c4">
    <text font-size="18" font-weight="bold">Save Slots</text>
    <text y="22" font-size="11" fill="#888">Stored in your browser. Up to 3 slots.</text>
  </g>

  <!-- Slot 1 -->
  <g transform="translate(200,160)">
    <rect width="800" height="160" fill="#0d1410" stroke="#3d5a3a" rx="6"/>
    <rect width="160" height="160" fill="#3a4a32"/>
    <text x="80" y="90" text-anchor="middle" font-size="40" fill="#cde3c4">🐊</text>
    <text x="80" y="120" text-anchor="middle" fill="#aaa" font-size="11">Snapshot</text>

    <text x="180" y="34" fill="#cde3c4" font-weight="bold" font-size="15">Slot 1 — Day 45 · Drought active</text>
    <text x="180" y="56" fill="#888" font-size="11">Saved: Apr 20, 2026 · 14:22</text>
    <text x="180" y="84" fill="#cde3c4" font-size="12">25 species · 437 agents</text>
    <text x="180" y="104" fill="#ffcc99" font-size="12">⚠ 3 species in danger</text>
    <text x="180" y="124" fill="#888" font-size="11">Water 58% · Nutrient 1.2× · Temp 24°</text>

    <rect x="640" y="50" width="140" height="32" fill="#3d5a3a" rx="3"/>
    <text x="710" y="71" text-anchor="middle" fill="#fff" font-weight="bold">Load</text>
    <rect x="640" y="90" width="140" height="32" fill="#5a2a2a" rx="3"/>
    <text x="710" y="111" text-anchor="middle" fill="#fff">Overwrite (Save)</text>
  </g>

  <!-- Slot 2 -->
  <g transform="translate(200,340)">
    <rect width="800" height="160" fill="#0d1410" stroke="#3d5a3a" rx="6"/>
    <rect width="160" height="160" fill="#3a4a32"/>
    <text x="80" y="90" text-anchor="middle" font-size="40" fill="#cde3c4">🦫</text>
    <text x="80" y="120" text-anchor="middle" fill="#aaa" font-size="11">Snapshot</text>

    <text x="180" y="34" fill="#cde3c4" font-weight="bold" font-size="15">Slot 2 — Day 90 · Beaver dam complete</text>
    <text x="180" y="56" fill="#888" font-size="11">Saved: Apr 22, 2026 · 09:14</text>
    <text x="180" y="84" fill="#cde3c4" font-size="12">25 species · 612 agents</text>
    <text x="180" y="104" fill="#88cc66" font-size="12">✓ Ecosystem stable</text>
    <text x="180" y="124" fill="#888" font-size="11">Water 142% · Nutrient 1.0× · Temp 21°</text>

    <rect x="640" y="50" width="140" height="32" fill="#3d5a3a" rx="3"/>
    <text x="710" y="71" text-anchor="middle" fill="#fff" font-weight="bold">Load</text>
    <rect x="640" y="90" width="140" height="32" fill="#5a2a2a" rx="3"/>
    <text x="710" y="111" text-anchor="middle" fill="#fff">Overwrite (Save)</text>
  </g>

  <!-- Slot 3 (empty) -->
  <g transform="translate(200,520)">
    <rect width="800" height="160" fill="#0d1410" stroke="#3d5a3a" stroke-dasharray="5,5" rx="6"/>
    <text x="400" y="80" text-anchor="middle" fill="#888" font-size="14">Slot 3 — Empty</text>
    <rect x="320" y="100" width="160" height="32" fill="#3d5a3a" rx="3"/>
    <text x="400" y="121" text-anchor="middle" fill="#fff" font-weight="bold">Save current state</text>
  </g>

  <text x="20" y="790" fill="#cde3c4" font-size="11" opacity="0.7">CB-006 · Save / Load · UC-014</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwampSimulator</title>
<link rel="icon" type="image/svg+xml" href="images/ga-001-favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="season-spring">
<div id="loading-overlay" aria-live="polite">
  <div class="lily-loader" aria-hidden="true"></div>
  <div id="loading-title">Waking up the swamp…</div>
  <div id="loading-progress">0%</div>
</div>
<nav id="top-nav">
  <button data-screen="canvas" class="active" title="Ecosystem canvas" aria-label="Ecosystem canvas"><img class="nav-icon" src="./images/ui/nav-canvas.svg" alt=""><span>Ecosystem</span></button>
  <button data-screen="foodweb" title="Food web" aria-label="Food web"><img class="nav-icon" src="./images/ui/nav-foodweb.svg" alt=""><span>Food web</span></button>
  <button data-screen="dashboard" title="Dashboard" aria-label="Dashboard"><img class="nav-icon" src="./images/ui/nav-dashboard.svg" alt=""><span>Dashboard</span></button>
  <button data-screen="intervention" title="Interventions" aria-label="Interventions"><img class="nav-icon" src="./images/ui/nav-intervention.svg" alt=""><span>Intervene</span></button>
  <button data-screen="scenarios" title="Scenarios" aria-label="Scenarios"><img class="nav-icon" src="./images/ui/nav-scenarios.svg" alt=""><span>Scenarios</span></button>
  <button data-screen="saveload" title="Save and load" aria-label="Save and load"><img class="nav-icon" src="./images/ui/nav-saveload.svg" alt=""><span>Save / Load</span></button>
  <span class="time-controls">
    <button id="btn-pause" title="Pause" aria-label="Pause"><img class="ui-icon" src="./images/ui/time-pause.svg" alt=""></button>
    <button id="btn-play" title="Play" aria-label="Play"><img class="ui-icon" src="./images/ui/time-play.svg" alt=""></button>
    <button data-speed="1" title="Normal speed"><img class="ui-icon" src="./images/ui/time-x1.svg" alt="x1"></button>
    <button data-speed="5" title="Fast"><img class="ui-icon" src="./images/ui/time-x5.svg" alt="x5"></button>
    <button data-speed="30" title="Very fast"><img class="ui-icon" src="./images/ui/time-x30.svg" alt="x30"></button>
    <button id="btn-skip-season" title="Skip to next season" aria-label="Skip to next season"><img class="ui-icon" src="./images/ui/time-skip.svg" alt=""><span>Season</span></button>
    <span id="time-readout">Day 60 · Spring</span>
    <span id="seed-chip" class="seed-chip" title="Terrain seed"></span>
    <span id="ambient-eq" class="ambient-eq" aria-label="Ecosystem activity"><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span></span>
  </span>
</nav>

<div id="dam-tooltip" class="dam-tooltip hidden" style="position:fixed;z-index:200"></div>

<main id="screens">
  <section id="screen-canvas" class="screen active">
    <aside id="overlay-bar">
      <h3>Overlays</h3>
      <button data-overlay="foodweb" title="Show food-web arrows" aria-label="Toggle food-web overlay"><img class="ui-icon" src="./images/ui/overlay-foodweb.svg" alt=""><span>Food web</span></button>
      <button data-overlay="nutrient" title="Show nutrient flow" aria-label="Toggle nutrient overlay"><img class="ui-icon" src="./images/ui/overlay-nutrient.svg" alt=""><span>Nutrient</span></button>
      <button data-overlay="oxygen" title="Show oxygen levels" aria-label="Toggle oxygen overlay"><img class="ui-icon" src="./images/ui/overlay-oxygen.svg" alt=""><span>Oxygen</span></button>
      <button data-overlay="density" title="Show population density" aria-label="Toggle density overlay"><img class="ui-icon" src="./images/ui/overlay-density.svg" alt=""><span>Density</span></button>
    </aside>
    <div id="canvas-wrap">
      <canvas id="sim-canvas" width="800" height="600"></canvas>
    </div>
    <aside id="inspector" class="hidden"></aside>
  </section>

  <section id="screen-foodweb" class="screen">
    <div id="foodweb-wrap">
      <canvas id="foodweb-canvas" width="900" height="500"></canvas>
    </div>
  </section>

  <section id="screen-dashboard" class="screen">
    <div class="chart-block"><h3>Population over time</h3><canvas id="chart-population"></canvas></div>
    <div class="chart-block"><h3>Biomass by trophic level</h3><canvas id="chart-biomass"></canvas></div>
    <aside id="alert-panel"></aside>
  </section>

  <section id="screen-intervention" class="screen">
    <section id="species-controls"></section>
    <section id="event-controls"></section>
    <section id="active-events"></section>
    <button id="btn-restore">Restore baseline</button>
  </section>

  <section id="screen-scenarios" class="screen">
    <section id="scenario-picker"></section>
    <section id="scenario-active" class="hidden"></section>
  </section>

  <section id="screen-saveload" class="screen">
    <div id="saveload-list"></div>
  </section>
</main>

<script type="module" src="main.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <rect width="900" height="580" fill="#0d0f12"/>
  <rect x="0" y="0" width="900" height="40" fill="#1a1d23"/>
  <text x="20" y="26" font-family="monospace" font-size="13" fill="#e8eaed">CB-003 — Output Tile Detail: Fidelity, Annotation, Tone Slider</text>
  <text x="760" y="26" font-family="monospace" font-size="11" fill="#555">UC-004 UC-005 UC-006 UC-009</text>

  <!-- State A: Normal tile -->
  <text x="30" y="68" font-family="monospace" font-size="11" fill="#888">STATE A — Normal (Fidelity ≥ 95%)</text>
  <rect x="30" y="78" width="260" height="200" fill="#141720" rx="8" stroke="#00e5a0" stroke-width="1"/>
  <rect x="40" y="88" width="80" height="18" fill="#00e5a0" rx="9"/>
  <text x="80" y="101" font-family="monospace" font-size="10" fill="#0d0f12" text-anchor="middle">Hook-First</text>
  <text x="50" y="130" font-family="monospace" font-size="11" fill="#e8eaed">The study that shocked</text>
  <text x="50" y="148" font-family="monospace" font-size="11" fill="#e8eaed">every economist — and why</text>
  <text x="50" y="166" font-family="monospace" font-size="11" fill="#e8eaed">you haven't heard about it.</text>
  <line x1="40" y1="180" x2="280" y2="180" stroke="#2a2d35" stroke-width="1"/>
  <text x="50" y="196" font-family="monospace" font-size="9" fill="#666">Why this works: curiosity gap in</text>
  <text x="50" y="210" font-family="monospace" font-size="9" fill="#666">first line drives click-through rate.</text>
  <!-- Slider -->
  <text x="50" y="234" font-family="monospace" font-size="9" fill="#888">subtle ◄────●──────► aggressive</text>
  <!-- Fidelity badge and copy -->
  <rect x="40" y="244" width="44" height="18" fill="#00332a" rx="4" stroke="#00e5a0" stroke-width="1"/>
  <text x="62" y="256" font-family="monospace" font-size="9" fill="#00e5a0" text-anchor="middle">99%</text>
  <rect x="208" y="244" width="70" height="22" fill="#00e5a0" rx="4"/>
  <text x="243" y="259" font-family="monospace" font-size="10" fill="#0d0f12" text-anchor="middle">⎘ Copy</text>

  <!-- State B: Fidelity warning tile -->
  <text x="320" y="68" font-family="monospace" font-size="11" fill="#888">STATE B — Fidelity warning (90–94%)</text>
  <rect x="320" y="78" width="260" height="200" fill="#141720" rx="8" stroke="#ffb347" stroke-width="1"/>
  <rect x="330" y="88" width="112" height="18" fill="#1a1d23" rx="9" stroke="#444" stroke-width="1"/>
  <text x="386" y="101" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">Controversy-Max</text>
  <text x="340" y="130" font-family="monospace" font-size="11" fill="#e8eaed">What economists refuse to</text>
  <text x="340" y="148" font-family="monospace" font-size="11" fill="#e8eaed">admit about this study will</text>
  <text x="340" y="166" font-family="monospace" font-size="11" fill="#e8eaed">change how you see the data.</text>
  <line x1="330" y1="180" x2="570" y2="180" stroke="#2a2d35" stroke-width="1"/>
  <text x="340" y="196" font-family="monospace" font-size="9" fill="#666">Why this works: contrarian</text>
  <text x="340" y="210" font-family="monospace" font-size="9" fill="#666">positioning triggers response.</text>
  <text x="340" y="234" font-family="monospace" font-size="9" fill="#888">subtle ◄──────────●─► aggressive</text>
  <rect x="330" y="244" width="62" height="18" fill="#332200" rx="4" stroke="#ffb347" stroke-width="1"/>
  <text x="361" y="256" font-family="monospace" font-size="9" fill="#ffb347" text-anchor="middle">93% ⚠</text>
  <rect x="498" y="244" width="70" height="22" fill="#2a2d35" rx="4"/>
  <text x="533" y="259" font-family="monospace" font-size="10" fill="#aaa" text-anchor="middle">⎘ Copy</text>

  <!-- State C: Blocked tile -->
  <text x="610" y="68" font-family="monospace" font-size="11" fill="#888">STATE C — Blocked (ethics guardrail)</text>
  <rect x="610" y="78" width="260" height="200" fill="#141720" rx="8" stroke="#ff4444" stroke-width="1"/>
  <rect x="620" y="88" width="112" height="18" fill="#1a1d23" rx="9" stroke="#444" stroke-width="1"/>
  <text x="676" y="101" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">Controversy-Max</text>
  <!-- Blocked state content -->
  <rect x="630" y="118" width="220" height="90" fill="#1a0000" rx="6" stroke="#ff4444" stroke-width="1"/>
  <text x="740" y="148" font-family="monospace" font-size="20" fill="#ff4444" text-anchor="middle">⛔</text>
  <text x="740" y="170" font-family="monospace" font-size="10" fill="#ff8888" text-anchor="middle">Rewrite blocked</text>
  <text x="740" y="185" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">Introduced claim not present</text>
  <text x="740" y="198" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">in the original text.</text>
  <rect x="680" y="230" width="120" height="22" fill="#1a1d23" rx="4" stroke="#444" stroke-width="1"/>
  <text x="740" y="245" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">↻ Try again (less aggressive)</text>
  <text x="630" y="268" font-family="monospace" font-size="9" fill="#555">Copy action disabled in blocked state.</text>

  <!-- Transparency toggle -->
  <rect x="30" y="320" width="840" height="50" fill="#141720" rx="6" stroke="#2a2d35" stroke-width="1"/>
  <text x="50" y="342" font-family="monospace" font-size="11" fill="#e8eaed">Transparency Mode</text>
  <text x="50" y="358" font-family="monospace" font-size="9" fill="#888">When ON: appends "— AI-optimised version" to all copied text.</text>
  <!-- Toggle switch -->
  <rect x="780" y="332" width="46" height="24" fill="#00e5a0" rx="12"/>
  <circle cx="814" cy="344" r="9" fill="#0d0f12"/>
  <text x="772" y="348" font-family="monospace" font-size="9" fill="#00e5a0">ON</text>

  <!-- Char count detail -->
  <rect x="30" y="390" width="840" height="60" fill="#141720" rx="6" stroke="#2a2d35" stroke-width="1"/>
  <text x="50" y="412" font-family="monospace" font-size="11" fill="#e8eaed">Character Count Behaviour</text>
  <text x="50" y="430" font-family="monospace" font-size="10" fill="#888">Below 280: </text>
  <text x="130" y="430" font-family="monospace" font-size="10" fill="#00e5a0">237/280  — green, tile is single-tweet</text>
  <text x="50" y="445" font-family="monospace" font-size="10" fill="#888">Approaching 280: </text>
  <text x="178" y="445" font-family="monospace" font-size="10" fill="#ffb347">275/280  — amber pulse</text>
  <text x="400" y="445" font-family="monospace" font-size="10" fill="#888">Over 280: </text>
  <text x="470" y="445" font-family="monospace" font-size="10" fill="#ff8888">304/280  — thread mode auto-activates</text>
</svg>

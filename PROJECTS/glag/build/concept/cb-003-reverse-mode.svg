<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580">
  <!-- Background -->
  <rect width="800" height="580" fill="#0d1117"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="50" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="32" text-anchor="middle" font-family="monospace, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Cyrillic ↔ Glagolitic Converter</text>
  <text x="16" y="32" font-family="monospace, sans-serif" font-size="12" fill="#8b949e">CB-003</text>

  <!-- Screen label -->
  <text x="400" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6e7681">[ MAIN CONVERTER SCREEN — GLAGOLITIC → CYRILLIC MODE ]</text>

  <!-- MODE TOGGLE BAR -->
  <rect x="30" y="84" width="740" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="100" font-family="sans-serif" font-size="10" fill="#6e7681">CONVERSION MODE</text>
  <!-- Inactive tab -->
  <rect x="180" y="88" width="200" height="28" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="280" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">Cyrillic → Glagolitic</text>
  <!-- Active tab: Glagolitic → Cyrillic -->
  <rect x="390" y="88" width="200" height="28" rx="5" fill="#1f6feb" stroke="#388bfd" stroke-width="1.5"/>
  <text x="490" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e6edf3">Glagolitic → Cyrillic</text>
  <!-- Annotation -->
  <line x1="280" y1="122" x2="280" y2="134" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="140" y="144" font-family="sans-serif" font-size="10" fill="#6e7681">inactive — switch to return to UC-001 mode</text>

  <!-- INPUT panel (Glagolitic) -->
  <rect x="30" y="155" width="360" height="190" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="45" y="177" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" letter-spacing="1">INPUT — Glagolitic</text>
  <line x1="30" y1="185" x2="390" y2="185" stroke="#30363d" stroke-width="1"/>
  <text x="45" y="212" font-family="monospace, sans-serif" font-size="17" fill="#c9d1d9">&#x2C00;&#x2C01;&#x2C02;&#x2C03; &#x2C05;&#x2C06;&#x2C07;&#x2C08;</text>
  <text x="45" y="238" font-family="monospace, sans-serif" font-size="13" fill="#484f58" font-style="italic">Paste Glagolitic script here…</text>
  <rect x="45" y="244" width="2" height="16" fill="#3fb950" opacity="0.8"/>

  <!-- Arrow -->
  <text x="400" y="260" text-anchor="middle" font-family="monospace, sans-serif" font-size="22" fill="#388bfd">→</text>
  <text x="400" y="276" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6e7681">inverse</text>
  <text x="400" y="287" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6e7681">mapping</text>

  <!-- OUTPUT panel (Cyrillic) -->
  <rect x="410" y="155" width="360" height="190" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="425" y="177" font-family="sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" letter-spacing="1">OUTPUT — Cyrillic</text>
  <line x1="410" y1="185" x2="770" y2="185" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="212" font-family="monospace, sans-serif" font-size="16" fill="#c9d1d9">Аз Буки Веде Гла</text>
  <text x="425" y="238" font-family="monospace, sans-serif" font-size="11" fill="#484f58" font-style="italic">Cyrillic output appears here…</text>
  <rect x="430" y="250" width="220" height="26" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="540" y="267" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b949e">unmapped Glagolitic passes through</text>

  <!-- Panel annotations -->
  <line x1="30" y1="177" x2="15" y2="163" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="4" y="160" font-family="sans-serif" font-size="9" fill="#8b949e">UC-005</text>
  <text x="4" y="172" font-family="sans-serif" font-size="9" fill="#8b949e">AC1–AC4</text>

  <!-- Action buttons -->
  <rect x="30" y="362" width="740" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="382" font-family="sans-serif" font-size="10" fill="#6e7681">ACTIONS (same controls as CB-001)</text>
  <rect x="50" y="388" width="120" height="24" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="110" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f85149">✕  Clear</text>
  <rect x="220" y="388" width="160" height="24" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="300" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#58a6ff">⎘  Copy Output</text>
  <rect x="630" y="388" width="130" height="24" rx="4" fill="#161b22" stroke="#6e7681" stroke-width="1"/>
  <text x="695" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">☰  Mapping</text>

  <!-- Note box -->
  <rect x="30" y="430" width="740" height="44" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="45" y="449" font-family="sans-serif" font-size="11" fill="#8b949e">UC-005 AC5: switching tabs clears both input and output and re-labels the panels.</text>
  <text x="45" y="465" font-family="sans-serif" font-size="11" fill="#8b949e">The mode toggle is persistent — the last used mode is shown when the user returns.</text>

  <!-- Footer -->
  <line x1="0" y1="494" x2="800" y2="494" stroke="#21262d" stroke-width="1"/>
  <text x="400" y="512" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#484f58">CB-003 — Main Converter Screen (Glagolitic→Cyrillic mode) — traces to UC-005</text>
  <text x="400" y="526" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#484f58">Stage 3 Concept — not a production asset</text>
</svg>

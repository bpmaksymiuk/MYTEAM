  <text x="425" y="110" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" letter-spacing="1">OUTPUT — Glagolitic</text>
  <line x1="410" y1="118" x2="770" y2="118" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="145" font-family="monospace, sans-serif" font-size="15" fill="#c9d1d9">&#x2C00;&#x2C01;&#x2C02;&#x2C03;&#x2C04; &#x2C05;&#x2C06;&#x2C07;&#x2C08;&#x2C09;&#x2C0A;</text>
  <text x="425" y="168" font-family="monospace, sans-serif" font-size="15" fill="#c9d1d9">&#x2C0B;&#x2C0C;&#x2C0D;&#x2C0E;&#x2C0F; &#x2C10;&#x2C11;&#x2C12;&#x2C13;&#x2C14;</text>
  <text x="425" y="191" font-family="monospace, sans-serif" font-size="11" fill="#484f58" font-style="italic">Glagolitic output appears here…</text>

  <!-- OUTPUT annotation -->

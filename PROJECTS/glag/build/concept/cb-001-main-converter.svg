  <text x="110" y="374" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149">✕  Clear</text>
  <line x1="110" y1="390" x2="110" y2="415" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="60" y="428" font-family="sans-serif" font-size="10" fill="#8b949e">clears both input</text>
  <text x="60" y="440" font-family="sans-serif" font-size="10" fill="#8b949e">and output (UC-003)</text>


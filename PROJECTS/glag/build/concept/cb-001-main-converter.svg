<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660">
  <!-- Background -->
  <rect width="800" height="660" fill="#0d1117"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="50" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="32" text-anchor="middle" font-family="monospace, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Cyrillic ↔ Glagolitic Converter</text>
  <text x="16" y="32" font-family="monospace, sans-serif" font-size="12" fill="#8b949e">CB-001</text>

  <!-- Screen label -->
  <text x="400" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6e7681">[ MAIN CONVERTER SCREEN — CYRILLIC → GLAGOLITIC MODE ]</text>

  <!-- MODE TOGGLE BAR -->
  <rect x="30" y="84" width="740" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="100" font-family="sans-serif" font-size="10" fill="#6e7681">CONVERSION MODE</text>
  <rect x="180" y="88" width="200" height="28" rx="5" fill="#1f6feb" stroke="#388bfd" stroke-width="1.5"/>
  <text x="280" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e6edf3">Cyrillic → Glagolitic</text>
  <rect x="390" y="88" width="200" height="28" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="490" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">Glagolitic → Cyrillic</text>
  <text x="490" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#484f58">→ see CB-003</text>
  <line x1="700" y1="100" x2="760" y2="88" stroke="#6e7681" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="620" y="80" font-family="sans-serif" font-size="10" fill="#8b949e">UC-005: toggle switches direction</text>

  <!-- INPUT panel -->
  <rect x="30" y="136" width="360" height="200" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="45" y="158" font-family="sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" letter-spacing="1">INPUT — Cyrillic</text>
  <line x1="30" y1="166" x2="390" y2="166" stroke="#30363d" stroke-width="1"/>
  <text x="45" y="193" font-family="monospace, sans-serif" font-size="15" fill="#c9d1d9">Слава Україні</text>
  <text x="45" y="216" font-family="monospace, sans-serif" font-size="15" fill="#c9d1d9">Привіт світе</text>
  <text x="45" y="239" font-family="monospace, sans-serif" font-size="13" fill="#484f58" font-style="italic">Type or paste Cyrillic here…</text>
  <rect x="45" y="246" width="2" height="16" fill="#58a6ff" opacity="0.8"/>

  <!-- Arrow -->
  <text x="400" y="248" text-anchor="middle" font-family="monospace, sans-serif" font-size="22" fill="#388bfd">→</text>
  <text x="400" y="265" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6e7681">char-by-char</text>
  <text x="400" y="276" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6e7681">mapping</text>

  <!-- OUTPUT panel -->
  <rect x="410" y="136" width="360" height="200" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="425" y="158" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" letter-spacing="1">OUTPUT — Glagolitic</text>
  <line x1="410" y1="166" x2="770" y2="166" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="193" font-family="monospace, sans-serif" font-size="15" fill="#c9d1d9">&#x2C00;&#x2C01;&#x2C02;&#x2C03;&#x2C04; &#x2C05;&#x2C06;&#x2C07;&#x2C08;&#x2C09;&#x2C0A;</text>
  <text x="425" y="216" font-family="monospace, sans-serif" font-size="15" fill="#c9d1d9">&#x2C0B;&#x2C0C;&#x2C0D;&#x2C0E;&#x2C0F; &#x2C10;&#x2C11;&#x2C12;&#x2C13;&#x2C14;</text>
  <text x="425" y="239" font-family="monospace, sans-serif" font-size="11" fill="#484f58" font-style="italic">Glagolitic output…</text>
  <rect x="430" y="248" width="200" height="26" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="530" y="265" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b949e">unmapped chars pass through</text>

  <!-- Action buttons row -->
  <rect x="30" y="354" width="740" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="374" font-family="sans-serif" font-size="10" fill="#6e7681">ACTIONS</text>
  <rect x="50" y="380" width="120" height="26" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="110" y="397" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149">✕  Clear</text>
  <rect x="220" y="380" width="160" height="26" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="300" y="397" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#58a6ff">⎘  Copy Output</text>
  <rect x="430" y="380" width="190" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="525" y="397" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#484f58">Copy (disabled if empty)</text>
  <rect x="630" y="380" width="130" height="26" rx="4" fill="#161b22" stroke="#6e7681" stroke-width="1"/>
  <text x="695" y="397" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">☰  Mapping</text>

  <line x1="110" y1="414" x2="110" y2="436" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="60" y="448" font-family="sans-serif" font-size="10" fill="#8b949e">UC-003: clears both</text>
  <line x1="300" y1="414" x2="300" y2="436" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="230" y="448" font-family="sans-serif" font-size="10" fill="#8b949e">UC-004: copy + toast</text>
  <line x1="695" y1="414" x2="695" y2="436" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="640" y="448" font-family="sans-serif" font-size="10" fill="#8b949e">UC-002: ref table</text>

  <!-- Toast -->
  <rect x="560" y="462" width="200" height="34" rx="6" fill="#238636" stroke="#2ea043" stroke-width="1"/>
  <text x="660" y="484" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e6edf3">✓  Copied to clipboard</text>
  <text x="660" y="510" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b949e">UC-004 AC2 — feedback</text>

  <!-- Footer -->
  <line x1="0" y1="580" x2="800" y2="580" stroke="#21262d" stroke-width="1"/>
  <text x="400" y="598" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#484f58">CB-001 — Main Converter Screen (Cyrillic→Glagolitic mode) — traces to UC-001, UC-003, UC-004, UC-005</text>
  <text x="400" y="612" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#484f58">Stage 3 Concept — not a production asset</text>
</svg>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="50" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="32" text-anchor="middle" font-family="monospace, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Cyrillic → Glagolitic Converter</text>
  <text x="16" y="32" font-family="monospace, sans-serif" font-size="12" fill="#8b949e">CB-001</text>

  <!-- Screen label -->
  <text x="400" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6e7681">[ MAIN CONVERTER SCREEN ]</text>


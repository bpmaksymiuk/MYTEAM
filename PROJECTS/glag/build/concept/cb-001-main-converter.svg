  <text x="660" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e6edf3">✓  Copied to clipboard</text>
  <text x="660" y="508" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b949e">toast / feedback (UC-004 AC2)</text>

  <!-- Footer -->
  <line x1="0" y1="540" x2="800" y2="540" stroke="#21262d" stroke-width="1"/>
  <text x="400" y="558" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#484f58">CB-001 — Main Converter Screen — traces to UC-001, UC-003, UC-004</text>
  <text x="400" y="572" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#484f58">Stage 3 Concept — not a production asset</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="540" fill="url(#bg-grad)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="900" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="36" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Cyrillic ↔ Glagolitic Converter</text>

  <!-- Mode toggle -->
  <rect x="24" y="70" width="420" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="28" y="74" width="200" height="30" rx="5" fill="#1f6feb" stroke="#388bfd" stroke-width="1.5"/>
  <text x="128" y="93" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Cyrillic → Glagolitic</text>
  <rect x="232" y="74" width="200" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="332" y="93" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8b949e">Glagolitic → Cyrillic</text>

  <!-- Input panel -->
  <rect x="24" y="122" width="420" height="220" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#glow-blue)"/>
  <rect x="24" y="122" width="420" height="36" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <rect x="24" y="142" width="420" height="16" fill="#161b22" stroke="none"/>
  <text x="40" y="147" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#58a6ff" letter-spacing="0.06em">INPUT — CYRILLIC</text>
  <line x1="24" y1="158" x2="444" y2="158" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="188" font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#c9d1d9">Слава Україні</text>
  <text x="40" y="216" font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#c9d1d9">Привіт світе!</text>
  <text x="40" y="250" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#484f58" font-style="italic">Type or paste Cyrillic text here…</text>
  <rect x="40" y="257" width="2" height="18" fill="#58a6ff"/>

  <!-- Arrow -->
  <text x="456" y="238" text-anchor="middle" font-family="'Consolas', monospace" font-size="32" font-weight="bold" fill="#388bfd">→</text>

  <!-- Output panel -->
  <rect x="468" y="122" width="408" height="220" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2" filter="url(#glow-green)"/>
  <rect x="468" y="122" width="408" height="36" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <rect x="468" y="142" width="408" height="16" fill="#161b22" stroke="none"/>
  <text x="484" y="147" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#3fb950" letter-spacing="0.06em">OUTPUT — GLAGOLITIC</text>
  <line x1="468" y1="158" x2="876" y2="158" stroke="#30363d" stroke-width="1"/>
  <text x="484" y="188" font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#c9d1d9">ⱄⰾⰰⰲⰰ ⱆⰽⱃⰰⰹⰹⱀⰸ</text>
  <text x="484" y="216" font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#c9d1d9">ⱂⱃⰹⰲⱀⱅ ⱄⰲⱀⱅⰵ!</text>

  <!-- Action row -->
  <rect x="24" y="356" width="852" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- Clear -->
  <rect x="40" y="368" width="110" height="28" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="95" y="386" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f85149">✕ Clear</text>
  <!-- Copy -->
  <rect x="164" y="368" width="152" height="28" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="240" y="386" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#58a6ff">⎘ Copy Output</text>
  <!-- Mapping -->
  <rect x="330" y="368" width="124" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="392" y="386" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8b949e">☰ Mapping</text>

  <!-- Toast (shown state) -->
  <rect x="640" y="462" width="236" height="38" rx="6" fill="#238636" stroke="#2ea043" stroke-width="1"/>
  <text x="758" y="485" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#e6edf3">✓ Copied to clipboard</text>

  <!-- GA label -->
  <text x="24" y="524" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#484f58">GA-001 — Converter UI — Cyrillic→Glagolitic mode — production asset</text>
</svg>

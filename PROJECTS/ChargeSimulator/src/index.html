<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charge Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Charge Simulator</h1>
        <p id="message">Ready.</p>
      </header>

      <main>
        <section class="canvas-panel">
          <canvas id="sim-canvas" width="1100" height="620"></canvas>
          <div class="hud">
            <span>Mode: <strong id="mode-label">place-negative</strong></span>
            <span>State: <strong id="run-label">Paused</strong></span>
            <span>Active: <strong id="active-count">0</strong></span>
            <span>Annihilated: <strong id="annihilated-count">0</strong></span>
          </div>
        </section>

        <aside class="controls">
          <h2>Tools</h2>
          <div class="tool-grid">
            <button data-mode="place-negative">Place -</button>
            <button data-mode="place-positive">Place +</button>
            <button data-mode="draw-barrier">Draw Barrier</button>
            <button data-mode="erase">Erase</button>
          </div>

          <div class="row">
            <button id="run-toggle">Run</button>
            <button id="clear-particles">Clear Particles</button>
            <button id="reset-all">Reset All</button>
          </div>

          <h2>Runtime</h2>
          <label>Spawn rate <input id="spawn-rate" type="range" min="1" max="50" step="1" value="12" /><span id="spawn-rate-val">12</span></label>
          <label>Simulation speed <input id="sim-speed" type="range" min="0.2" max="2" step="0.1" value="1" /><span id="sim-speed-val">1.0</span></label>
          <label>Charge strength <input id="charge-strength" type="range" min="0.2" max="4" step="0.1" value="1.2" /><span id="charge-strength-val">1.2</span></label>

          <h2>Advanced</h2>
          <label>Damping <input id="damping" type="range" min="0.85" max="1" step="0.005" value="0.985" /><span id="damping-val">0.985</span></label>
          <label>Capture radius <input id="capture-radius" type="range" min="6" max="40" step="1" value="16" /><span id="capture-radius-val">16</span></label>
          <label>Image solid threshold <input id="image-threshold" type="range" min="1" max="254" step="1" value="120" /><span id="image-threshold-val">120</span></label>
          <label class="checkbox"><input id="trails" type="checkbox" checked /> Show trails</label>
          <button id="reset-defaults">Reset Defaults</button>

          <h2>Background Presets</h2>
          <label>Load image <input id="background-file" type="file" accept="image/*" /></label>
          <label>Preset name <input id="preset-name" type="text" placeholder="lab-obstacle-1" /></label>
          <div class="row">
            <button id="save-preset">Save Background</button>
            <button id="load-preset">Load Selected</button>
          </div>
          <label>Saved presets
            <select id="preset-select"></select>
          </label>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>

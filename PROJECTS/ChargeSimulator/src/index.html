<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coulomb Charge Simulator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="control-panel">
      <h1>Coulomb Charge Simulator</h1>
      <p class="subtitle">Interactive field sandbox with sources, sinks, and barriers</p>

      <div class="group">
        <h2>Tools</h2>
        <div class="tool-row">
          <button id="mode-place" class="btn active" type="button">Place Charge</button>
          <button id="mode-barrier" class="btn" type="button">Draw Barrier</button>
          <button id="mode-erase" class="btn" type="button">Erase Barrier</button>
        </div>
        <label class="field">
          Charge Type
          <select id="charge-type">
            <option value="-">Negative Source (-)</option>
            <option value="+">Positive Sink (+)</option>
          </select>
        </label>
      </div>

      <div class="group">
        <h2>Core Controls</h2>
        <label class="field">Spawn Rate: <span id="spawn-rate-value">4.0/s</span>
          <input id="spawn-rate" type="range" min="0.5" max="12" step="0.5" value="4" />
        </label>
        <label class="field">Simulation Speed: <span id="sim-speed-value">1.0x</span>
          <input id="sim-speed" type="range" min="0.2" max="3" step="0.1" value="1" />
        </label>
        <label class="field">Charge Strength: <span id="charge-strength-value">1.0x</span>
          <input id="charge-strength" type="range" min="0.2" max="3" step="0.1" value="1" />
        </label>
      </div>

      <div class="group">
        <h2>Advanced</h2>
        <label class="field">Particle Lifetime: <span id="lifetime-value">14.0s</span>
          <input id="particle-lifetime" type="range" min="2" max="30" step="1" value="14" />
        </label>
        <label class="field">Damping: <span id="damping-value">0.995</span>
          <input id="damping" type="range" min="0.94" max="1" step="0.001" value="0.995" />
        </label>
        <label class="field">Capture Radius: <span id="capture-radius-value">16px</span>
          <input id="capture-radius" type="range" min="8" max="40" step="1" value="16" />
        </label>
        <label class="checkbox">
          <input id="show-trails" type="checkbox" checked /> Show trails
        </label>
      </div>

      <div class="group actions">
        <button id="run-toggle" class="btn btn-primary" type="button">Pause</button>
        <button id="reset-defaults" class="btn" type="button">Reset Defaults</button>
        <button id="clear-scene" class="btn" type="button">Clear Scene</button>
      </div>

      <div class="group status">
        <h2>Status</h2>
        <p id="status-text">Running</p>
        <p>Sources: <span id="source-count">0</span> | Sinks: <span id="sink-count">0</span></p>
        <p>Particles: <span id="active-count">0</span> | Spawned: <span id="spawned-count">0</span> | Annihilated: <span id="annihilated-count">0</span></p>
      </div>
    </section>

    <section class="canvas-panel">
      <canvas id="sim-canvas" width="1100" height="760" aria-label="Simulation canvas"></canvas>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>

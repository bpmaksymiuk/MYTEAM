<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectroFlow — Charge Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <h2 class="panel-title">⚡ ElectroFlow</h2>

    <section class="panel-section">
      <h3>Tools</h3>
      <div class="tool-buttons">
        <button data-tool="emitter" class="active">− Emitter</button>
        <button data-tool="collector">+ Collector</button>
        <button data-tool="barrier">Barrier</button>
        <button data-tool="delete">Delete</button>
      </div>
    </section>

    <section class="panel-section">
      <h3>Physics</h3>
      <label>Spawn Rate <span id="spawn-rate-val">5</span>/s
        <input type="range" id="spawn-rate" min="1" max="20" value="5">
      </label>
      <label>Field Strength <span id="field-strength-val">5</span>
        <input type="range" id="field-strength" min="1" max="10" value="5">
      </label>
      <label>Friction <span id="friction-val">2</span>
        <input type="range" id="friction" min="0" max="10" value="2">
      </label>
      <label>Slow-Mo <span id="slow-mo-val">100</span>%
        <input type="range" id="slow-mo" min="0" max="100" value="100">
      </label>
    </section>

    <section class="panel-section">
      <h3>Overlays</h3>
      <div class="toggle-buttons">
        <button id="btn-field-vis" data-toggle="fieldVis">Field Vis</button>
        <button id="btn-trails" data-toggle="trails">Trails</button>
        <button id="btn-force-vectors" data-toggle="forceVectors">Forces</button>
        <button id="btn-stats" data-toggle="statsOpen">Stats</button>
        <button id="btn-dark-mode" data-toggle="darkMode">Dark Mode</button>
        <button id="btn-sound" data-toggle="sound">Sound</button>
      </div>
    </section>

    <section class="panel-section">
      <h3>Challenges</h3>
      <div class="challenge-buttons">
        <button data-challenge="sandbox">Sandbox</button>
        <button data-challenge="maze-escape">Maze Escape</button>
        <button data-challenge="balance">Balance</button>
        <button data-challenge="containment">Containment</button>
      </div>
    </section>

    <section class="panel-section">
      <h3>Save / Load</h3>
      <div class="save-slots">
        <div class="slot-row">
          <span>Slot 1</span>
          <button data-save="1">Save</button>
          <button data-load="1">Load</button>
        </div>
        <div class="slot-row">
          <span>Slot 2</span>
          <button data-save="2">Save</button>
          <button data-load="2">Load</button>
        </div>
        <div class="slot-row">
          <span>Slot 3</span>
          <button data-save="3">Save</button>
          <button data-load="3">Load</button>
        </div>
      </div>
    </section>
  </aside>

  <canvas id="sim-canvas"></canvas>

  <div id="stats-overlay" class="hidden">
    <div>Particles: <span id="stat-particles">0</span></div>
    <div>Elements: <span id="stat-elements">0</span></div>
    <div>Collisions/s: <span id="stat-collisions">0</span></div>
    <div>Energy: <span id="stat-energy">0</span></div>
  </div>

  <div id="challenge-overlay" class="hidden">
    <div id="challenge-message"></div>
    <div id="challenge-score"></div>
    <button id="btn-close-challenge">Continue</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>

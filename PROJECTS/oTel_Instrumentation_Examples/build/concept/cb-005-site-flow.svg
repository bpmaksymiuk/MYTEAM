<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, sans-serif">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; stroke: #2a334d; stroke-width: 1; }
      .ink { fill: #e6ecf5; }
      .muted { fill: #8a93ab; }
      .otel { fill: #f5a800; }
      .dt { fill: #1496ff; }
      .ok { fill: #37b26b; }
      .red { fill: #b6452c; }
      .arrow { stroke: #8a93ab; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .arrow-strong { stroke: #f5a800; stroke-width: 2; fill: none; marker-end: url(#arr-otel); }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 14px; font-weight: 600; }
      .body { font-size: 12px; }
      .small { font-size: 10px; }
      .stamp { font-size: 10px; letter-spacing: 1.5px; }
      .mono { font-family: 'Fira Code', monospace; font-size: 11px; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93ab"/>
    </marker>
    <marker id="arr-otel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5a800"/>
    </marker>
  </defs>

  <rect width="1280" height="800" class="bg"/>
  <text x="40" y="22" class="ink stamp">CB-005 · CONCEPT BOARD · SITE FLOW &amp; INFORMATION ARCHITECTURE · UC-001 · UC-009 · UC-010</text>
  <text x="1240" y="22" text-anchor="end" class="muted stamp">EVERY RECIPE REACHABLE IN ONE CLICK</text>
  <line x1="40" y1="30" x2="1240" y2="30" stroke="#2a334d"/>

  <!-- Layer headers -->
  <text x="50" y="80" class="muted h2">ENTRY</text>
  <text x="50" y="240" class="muted h2">HUBS</text>
  <text x="50" y="450" class="muted h2">RECIPES</text>
  <text x="50" y="660" class="muted h2">SUPPORT</text>

  <!-- HOME -->
  <rect x="540" y="60" width="200" height="80" rx="8" class="surface"/>
  <rect x="540" y="60" width="200" height="3" class="otel"/>
  <text x="640" y="92" text-anchor="middle" class="ink h1">Home</text>
  <text x="640" y="112" text-anchor="middle" class="muted small">UC-001 · 4 language tiles</text>
  <text x="640" y="128" text-anchor="middle" class="dt small">cfg ⚙ panel reachable here</text>

  <!-- LANGUAGE HUBS -->
  <rect x="120" y="220" width="180" height="60" rx="6" class="surface"/>
  <rect x="120" y="220" width="180" height="3" class="otel"/>
  <text x="210" y="248" text-anchor="middle" class="ink h2">JavaScript hub</text>
  <text x="210" y="266" text-anchor="middle" class="muted small">UC-007</text>

  <rect x="320" y="220" width="180" height="60" rx="6" class="surface"/>
  <rect x="320" y="220" width="180" height="3" class="otel"/>
  <text x="410" y="248" text-anchor="middle" class="ink h2">Python hub</text>
  <text x="410" y="266" text-anchor="middle" class="muted small">UC-007</text>

  <rect x="520" y="220" width="180" height="60" rx="6" class="surface"/>
  <rect x="520" y="220" width="180" height="3" class="otel"/>
  <text x="610" y="248" text-anchor="middle" class="ink h2">.NET hub</text>
  <text x="610" y="266" text-anchor="middle" class="muted small">UC-007</text>

  <rect x="720" y="220" width="180" height="60" rx="6" class="surface"/>
  <rect x="720" y="220" width="180" height="3" class="otel"/>
  <text x="810" y="248" text-anchor="middle" class="ink h2">Java hub</text>
  <text x="810" y="266" text-anchor="middle" class="muted small">UC-007</text>

  <!-- Cross-cutting hub -->
  <rect x="950" y="220" width="240" height="60" rx="6" class="surface" stroke="#1496ff"/>
  <rect x="950" y="220" width="240" height="3" class="dt"/>
  <text x="1070" y="248" text-anchor="middle" class="ink h2">Cross-cutting topics</text>
  <text x="1070" y="266" text-anchor="middle" class="muted small">UC-010 · resource · sampling · semconv</text>

  <!-- Arrows from Home to hubs -->
  <path d="M 600 140 Q 400 175 210 220" class="arrow"/>
  <path d="M 620 140 Q 510 175 410 220" class="arrow"/>
  <path d="M 660 140 Q 600 175 610 220" class="arrow"/>
  <path d="M 680 140 Q 750 175 810 220" class="arrow"/>
  <path d="M 720 130 Q 900 175 1070 220" class="arrow"/>

  <!-- RECIPE rows -->
  <g>
    <rect x="80" y="430" width="200" height="40" rx="4" class="surface"/>
    <text x="180" y="455" text-anchor="middle" class="ink body">Quickstart (UC-003)</text>
    <rect x="80" y="478" width="200" height="32" rx="4" class="surface"/>
    <text x="180" y="498" text-anchor="middle" class="muted small">Manual · Auto · Metrics · Logs</text>
  </g>
  <g>
    <rect x="290" y="430" width="200" height="40" rx="4" class="surface"/>
    <text x="390" y="455" text-anchor="middle" class="ink body">Quickstart (UC-004)</text>
    <rect x="290" y="478" width="200" height="32" rx="4" class="surface"/>
    <text x="390" y="498" text-anchor="middle" class="muted small">Manual · Auto · Metrics · Logs</text>
  </g>
  <g>
    <rect x="500" y="430" width="200" height="40" rx="4" class="surface"/>
    <text x="600" y="455" text-anchor="middle" class="ink body">Quickstart (UC-005)</text>
    <rect x="500" y="478" width="200" height="32" rx="4" class="surface"/>
    <text x="600" y="498" text-anchor="middle" class="muted small">Manual · Auto · Metrics · Logs</text>
  </g>
  <g>
    <rect x="710" y="430" width="200" height="40" rx="4" class="surface"/>
    <text x="810" y="455" text-anchor="middle" class="ink body">Quickstart (UC-006)</text>
    <rect x="710" y="478" width="200" height="32" rx="4" class="surface"/>
    <text x="810" y="498" text-anchor="middle" class="muted small">Manual · Java agent · Metrics · Logs</text>
  </g>

  <!-- Arrows hub -> recipe -->
  <path d="M 210 280 L 180 430" class="arrow"/>
  <path d="M 410 280 L 390 430" class="arrow"/>
  <path d="M 610 280 L 600 430" class="arrow"/>
  <path d="M 810 280 L 810 430" class="arrow"/>

  <!-- Cross-cutting sideways arrows -->
  <path d="M 950 250 L 910 250 L 910 450 L 280 450 L 280 450" class="arrow" stroke-dasharray="3 3" />
  <text x="935" y="370" class="dt small" transform="rotate(90 935 370)">cross-cutting → recipes</text>

  <!-- Verification + Troubleshooting + Sample apps -->
  <rect x="120" y="640" width="240" height="60" rx="6" class="surface" stroke="#37b26b"/>
  <text x="240" y="668" text-anchor="middle" class="ink h2">Verification badges</text>
  <text x="240" y="686" text-anchor="middle" class="ok small">UC-012 · every recipe</text>

  <rect x="400" y="640" width="240" height="60" rx="6" class="surface" stroke="#b6452c"/>
  <text x="520" y="668" text-anchor="middle" class="ink h2">Troubleshooting index</text>
  <text x="520" y="686" text-anchor="middle" class="red small">UC-011 · symptoms → fixes</text>

  <rect x="680" y="640" width="240" height="60" rx="6" class="surface"/>
  <text x="800" y="668" text-anchor="middle" class="ink h2">Sample apps</text>
  <text x="800" y="686" text-anchor="middle" class="muted small">UC-013 · /build/samples/&lt;lang&gt;/</text>

  <rect x="960" y="640" width="240" height="60" rx="6" class="surface" stroke="#1496ff"/>
  <text x="1080" y="668" text-anchor="middle" class="ink h2">Configuration panel</text>
  <text x="1080" y="686" text-anchor="middle" class="dt small">UC-002 · OTLP destination presets</text>

  <!-- All recipes back-link -->
  <path d="M 180 510 L 240 640" class="arrow" stroke-dasharray="2 3"/>
  <path d="M 390 510 L 480 640" class="arrow" stroke-dasharray="2 3"/>
  <path d="M 600 510 L 540 640" class="arrow" stroke-dasharray="2 3"/>
  <path d="M 810 510 L 800 640" class="arrow" stroke-dasharray="2 3"/>

  <!-- Cfg panel reaches every page -->
  <path d="M 740 100 Q 1100 100 1080 640" class="arrow-strong" stroke-dasharray="6 4"/>
  <text x="1100" y="400" class="otel small" transform="rotate(90 1100 400)">cfg reachable from every page (UC-002 AC1)</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Buddy</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel" data-theme="midnight-terminal">
    <header class="panel-header">
      <h1 class="brand-title">
        <img id="brand-icon" src="pnp.png" alt="Browser Buddy logo" width="18" height="18">
        <span>Browser Buddy</span>
        <span id="brand-version" class="brand-version">v?.?.?</span>
      </h1>
      <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </header>

    <nav class="tabs" aria-label="Main tabs">
      <button id="tab-notes" class="tab-btn active" aria-label="Notes tab">NOTES</button>
      <button id="tab-favorites" class="tab-btn" aria-label="Favorites tab">FAVORITES</button>
      <button id="tab-options" class="tab-btn" aria-label="Options tab">OPTIONS</button>
    </nav>

    <section id="view-notes" class="tab-view active">
      <div class="actions-layout">
        <div class="action-group action-group-primary" role="toolbar" aria-label="Primary note actions">
          <button id="add-btn" class="icon-btn" title="Add note" aria-label="Add note">＋</button>
          <button id="capture-btn" class="icon-btn" title="Capture page region" aria-label="Capture page region">⌗</button>
          <button id="cancel-btn" class="icon-btn" title="Cancel capture" aria-label="Cancel capture" disabled>✕</button>
        </div>

        <div class="actions-row-bottom">
          <div class="action-group action-group-secondary" role="toolbar" aria-label="Selected note actions">
            <button id="copy-btn" class="icon-btn" title="Copy selected note" aria-label="Copy selected note" disabled>⧉</button>
            <button id="edit-btn" class="icon-btn" title="Edit selected note" aria-label="Edit selected note" disabled>✎</button>
            <button id="delete-btn" class="icon-btn" title="Delete selected note" aria-label="Delete selected note" disabled>🗑</button>
          </div>

          <div class="action-group action-group-view" role="group" aria-label="View mode">
            <button id="list-view-btn" class="icon-btn active" title="List view" aria-label="List view">☰</button>
            <button id="grid-view-btn" class="icon-btn" title="Grid view" aria-label="Grid view">▦</button>
          </div>
        </div>
      </div>

      <p id="status-text" class="status-text"></p>
      <p class="notes-drop-hint" aria-label="Drop hint">Drop image or text here to create a note.</p>
      <ul id="notes-list" class="notes-list list"></ul>
    </section>

    <section id="view-favorites" class="tab-view">
      <div class="actions-layout">
        <div class="action-group action-group-primary" role="toolbar" aria-label="Favorites actions">
          <button id="fav-back-btn" class="icon-btn" title="Go to parent folder" aria-label="Go to parent folder">↩</button>
          <button id="fav-add-btn" class="icon-btn" title="Add favorite" aria-label="Add favorite">＋</button>
          <button id="fav-remove-btn" class="icon-btn" title="Remove selected favorites" aria-label="Remove selected favorites" disabled>🗑</button>
        </div>

        <div class="actions-row-bottom">
          <div class="action-group action-group-secondary" role="toolbar" aria-label="Favorites clipboard actions">
            <button id="fav-copy-btn" class="icon-btn" title="Copy selected links" aria-label="Copy selected links" disabled>⧉</button>
          </div>
        </div>
      </div>

      <p id="favorites-path" class="status-text"></p>
      <ul id="favorites-list" class="notes-list list"></ul>
    </section>

    <section id="view-options" class="tab-view">
      <div class="options-group">
        <h2>Theme</h2>
        <label for="theme-select">Theme Catalog</label>
        <select id="theme-select" aria-label="Theme catalog"></select>
      </div>

      <div class="options-group">
        <h2>Default Notes View</h2>
        <label><input type="radio" name="view" value="list"> List</label>
        <label><input type="radio" name="view" value="grid"> Grid</label>
      </div>

      <div class="options-group">
        <h2>Default Favorites Subdirectory</h2>
        <label for="favorites-default-select">Favorites folder</label>
        <select id="favorites-default-select" aria-label="Default favorites folder"></select>
        <button id="save-favorites-default-btn" class="icon-btn" title="Save default favorites folder" aria-label="Save default favorites folder">Save Favorites Default</button>
      </div>
    </section>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled - Notepad</title>
  <link rel="stylesheet" href="notepad.css">
</head>
<body>
  <!-- Menu Bar (BR-003) -->
  <nav id="menu-bar" role="menubar"></nav>

  <!-- Editor area (BR-004) -->
  <textarea id="editor" spellcheck="false" aria-label="Text editor"></textarea>

  <!-- Status Bar (BR-005, BR-010, BR-011, BR-012, BR-013) -->
  <footer id="status-bar">
    <span id="status-encoding">UTF-8</span>
    <span id="status-line">Ln 1</span>
    <span id="status-col">Col 1</span>
    <span id="status-chars">0 chars</span>
  </footer>

  <!-- Open File Dialog (BR-018) -->
  <dialog id="open-dialog" aria-label="Open file">
    <div class="dialog-title">Open</div>
    <div id="open-list" class="open-list"></div>
    <div class="dialog-buttons">
      <button id="open-cancel-btn">Cancel</button>
    </div>
  </dialog>

  <!-- Find Dialog (BR-030) -->
  <dialog id="find-dialog" aria-label="Find">
    <div class="dialog-title">Find</div>
    <div class="find-row">
      <label for="find-input">Find what:</label>
      <input type="text" id="find-input" autocomplete="off">
    </div>
    <div class="find-row">
      <label>
        <input type="checkbox" id="find-case"> Match case
      </label>
    </div>
    <div class="dialog-buttons">
      <button id="find-next-btn">Find Next</button>
      <button id="find-close-btn">Close</button>
    </div>
  </dialog>

  <!-- Help Dialog (BR-028, BR-029) -->
  <dialog id="help-dialog" aria-label="Keyboard shortcuts">
    <div class="dialog-title">Notepad — Keyboard Shortcuts</div>
    <div id="help-content"></div>
    <div class="dialog-buttons">
      <button id="help-close-btn">Close</button>
    </div>
  </dialog>

  <!-- About Dialog -->
  <dialog id="about-dialog" aria-label="About Notepad">
    <div class="dialog-title">About Notepad</div>
    <p>Notepad Chrome Extension v1.0.0</p>
    <p>A faithful Windows Notepad recreation as a Chrome extension.</p>
    <div class="dialog-buttons">
      <button id="about-close-btn">OK</button>
    </div>
  </dialog>

  <script src="notepad.js"></script>
</body>
</html>

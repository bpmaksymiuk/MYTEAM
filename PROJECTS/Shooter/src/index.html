<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser FPS Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game-root"></div>

  <div id="overlay-menu" class="overlay visible">
    <h1>Steel Corridor</h1>
    <p>Browser FPS Prototype</p>
    <button id="start-btn">Start Game</button>
  </div>

  <div id="overlay-pause" class="overlay">
    <h2>Paused</h2>
    <button id="resume-btn">Resume</button>
    <button id="mute-btn">Toggle Audio</button>
    <div class="keybinds">
      <h3>Keybinds</h3>
      <label>Forward <input id="bind-forward" maxlength="1" value="w" /></label>
      <label>Back <input id="bind-back" maxlength="1" value="s" /></label>
      <label>Left <input id="bind-left" maxlength="1" value="a" /></label>
      <label>Right <input id="bind-right" maxlength="1" value="d" /></label>
      <button id="apply-bindings">Apply Bindings</button>
    </div>
  </div>

  <div id="overlay-gameover" class="overlay">
    <h2>Game Over</h2>
    <p>Kills: <span id="final-kills">0</span></p>
    <p>Score: <span id="final-score">0</span></p>
    <button id="restart-btn">Restart</button>
  </div>

  <div id="hud">
    <div>Health: <span id="hud-health">100</span></div>
    <div>Weapon: <span id="hud-weapon">Rifle</span></div>
    <div>Ammo: <span id="hud-ammo">120</span></div>
    <div>Kills: <span id="hud-kills">0</span></div>
    <div>Score: <span id="hud-score">0</span></div>
    <div>FPS: <span id="hud-fps">0</span></div>
  </div>

  <div id="crosshair">+</div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>

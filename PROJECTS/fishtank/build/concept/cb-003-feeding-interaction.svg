<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580">
  <title>CB-003 — Feeding and Interaction Flow — Fish Tank Simulator Concept</title>
  <rect width="820" height="580" fill="#0d1117"/>

  <g id="title-bar">
    <rect x="0" y="0" width="820" height="36" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="16" y="23" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#e6edf3">CB-003 — FEEDING AND INTERACTION FLOW</text>
    <text x="804" y="23" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">UC-006 · UC-007 · UC-011</text>
  </g>

  <g id="sequence-label">
    <text x="410" y="60" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Three-frame interaction sequence: Input → Response → Feedback</text>
  </g>

  <g id="frame-1">
    <rect x="30" y="72" width="234" height="430" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <rect x="30" y="72" width="234" height="28" rx="8" fill="#1f6feb" opacity="0.2"/>
    <text x="147" y="91" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#79c0ff" text-anchor="middle">1 — INPUT</text>

    <rect x="46" y="110" width="202" height="300" rx="4" fill="#071830" stroke="#21262d" stroke-width="1"/>

    <ellipse cx="200" cy="235" rx="20" ry="8" fill="#3fb950" opacity="0.5"/>
    <ellipse cx="280" cy="260" rx="18" ry="7" fill="#d29922" opacity="0.5"/>
    <ellipse cx="140" cy="220" rx="22" ry="8" fill="#79c0ff" opacity="0.45"/>

    <circle cx="200" cy="140" r="10" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>
    <line x1="200" y1="130" x2="200" y2="120" stroke="#e6edf3" stroke-width="1" opacity="0.6"/>
    <text x="200" y="116" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">CLICK / TAP</text>

    <text x="147" y="432" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">User clicks near water surface</text>
    <text x="147" y="446" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">AC1: food spawns at input location</text>
    <text x="147" y="460" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Drag moves release point (touch)</text>

    <text x="147" y="490" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#3d444d" text-anchor="middle">Touch: tap = feed · drag = move point</text>
  </g>

  <g id="arrow-1">
    <line x1="268" y1="287" x2="296" y2="287" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>

  <g id="frame-2">
    <rect x="294" y="72" width="234" height="430" rx="8" fill="#161b22" stroke="#9e6a03" stroke-width="1.5"/>
    <rect x="294" y="72" width="234" height="28" rx="8" fill="#9e6a03" opacity="0.2"/>
    <text x="411" y="91" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d29922" text-anchor="middle">2 — RESPONSE</text>

    <rect x="310" y="110" width="202" height="300" rx="4" fill="#071830" stroke="#21262d" stroke-width="1"/>

    <circle cx="374" cy="140" r="5" fill="#d29922" opacity="0.7"/>
    <circle cx="370" cy="160" r="4" fill="#d29922" opacity="0.6"/>
    <circle cx="377" cy="180" r="4" fill="#d29922" opacity="0.55"/>
    <circle cx="372" cy="200" r="5" fill="#d29922" opacity="0.5"/>
    <circle cx="375" cy="220" r="3" fill="#d29922" opacity="0.4"/>
    <text x="395" y="185" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#d29922">FOOD</text>
    <text x="395" y="197" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#d29922">PARTICLES</text>

    <ellipse cx="460" cy="260" rx="20" ry="8" fill="#3fb950" opacity="0.6"/>
    <line x1="440" y1="255" x2="390" y2="220" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <text x="480" y="256" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#3fb950">→ food</text>

    <ellipse cx="340" cy="230" rx="18" ry="7" fill="#79c0ff" opacity="0.55"/>
    <line x1="354" y1="226" x2="378" y2="210" stroke="#79c0ff" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <text x="310" y="226" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#79c0ff" text-anchor="end">→ food</text>

    <text x="411" y="432" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Fish detect and move to food</text>
    <text x="411" y="446" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">AC2: fish respond to available food</text>
    <text x="411" y="460" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Uneaten food despawns after interval</text>
    <text x="411" y="490" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#3d444d" text-anchor="middle">Cooldown prevents feeding spam</text>
  </g>

  <g id="arrow-2">
    <line x1="532" y1="287" x2="560" y2="287" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>

  <g id="frame-3">
    <rect x="558" y="72" width="234" height="430" rx="8" fill="#161b22" stroke="#b91c1c" stroke-width="1.5"/>
    <rect x="558" y="72" width="234" height="28" rx="8" fill="#b91c1c" opacity="0.2"/>
    <text x="675" y="91" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#f78166" text-anchor="middle">3 — SELECTION FEEDBACK</text>

    <rect x="574" y="110" width="202" height="300" rx="4" fill="#071830" stroke="#21262d" stroke-width="1"/>

    <ellipse cx="720" cy="235" rx="26" ry="10" fill="#3fb950" opacity="0.55"/>
    <circle cx="720" cy="235" r="22" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
    <text x="720" y="253" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#e6edf3" text-anchor="middle">SELECTED</text>

    <rect x="638" y="162" width="120" height="52" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1" opacity="0.92"/>
    <text x="698" y="180" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Clownfish</text>
    <text x="698" y="194" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Tropical · Shoaling</text>
    <text x="698" y="207" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#3d444d" text-anchor="middle">TOOLTIP</text>

    <line x1="720" y1="213" x2="718" y2="214" stroke="#3d444d" stroke-width="1" stroke-dasharray="2,2"/>

    <ellipse cx="620" cy="310" rx="20" ry="8" fill="#21262d" opacity="0.6" stroke="#3d444d" stroke-width="1"/>
    <text x="620" y="313" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">DECORATION</text>
    <rect x="580" y="280" width="80" height="30" rx="4" fill="#161b22" stroke="#3d444d" stroke-width="1" opacity="0.85"/>
    <text x="620" y="299" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#c9d1d9" text-anchor="middle">Shipwreck Bow</text>

    <text x="675" y="432" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">AC1: fish shows clear selection state</text>
    <text x="675" y="446" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">AC2: decor shows contextual info</text>
    <text x="675" y="460" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">AC3: selection updates on new target</text>
    <text x="675" y="490" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#3d444d" text-anchor="middle">Feedback visible · scene not obscured</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>

  <g id="footer-note">
    <text x="410" y="565" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Feeding cooldown rate-limits interaction · Uneaten food despawns after bounded interval</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <title>CB-008: Photorealistic Crab — Bottom Zone View</title>
  <rect width="900" height="520" fill="#0d1117"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="36" fill="#161b22"/>
  <text x="450" y="23" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">CB-008 · PHOTOREALISTIC CRAB — BOTTOM ZONE VIEW · UC-015</text>

  <!-- Substrate layer -->
  <rect x="0" y="380" width="900" height="100" fill="#1c1408"/>
  <!-- Gravel texture dots -->
  <g fill="#2a1e0e" opacity="0.6">
    <circle cx="30" cy="395" r="4"/><circle cx="60" cy="400" r="3"/><circle cx="95" cy="393" r="5"/>
    <circle cx="130" cy="400" r="3.5"/><circle cx="165" cy="395" r="4.5"/><circle cx="200" cy="402" r="3"/>
    <circle cx="240" cy="394" r="5"/><circle cx="275" cy="401" r="3.5"/><circle cx="310" cy="396" r="4"/>
    <circle cx="345" cy="403" r="3"/><circle cx="385" cy="395" r="5"/><circle cx="420" cy="400" r="4"/>
    <circle cx="455" cy="394" r="3.5"/><circle cx="490" cy="403" r="4.5"/><circle cx="530" cy="396" r="3"/>
    <circle cx="565" cy="401" r="5"/><circle cx="600" cy="395" r="3.5"/><circle cx="635" cy="403" r="4"/>
    <circle cx="670" cy="396" r="3"/><circle cx="710" cy="400" r="5"/><circle cx="745" cy="394" r="3.5"/>
    <circle cx="780" cy="403" r="4.5"/><circle cx="815" cy="395" r="3"/><circle cx="850" cy="400" r="4"/>
    <circle cx="880" cy="394" r="3.5"/>
  </g>

  <!-- Plant bases (left) -->
  <path d="M60,380 Q55,340 48,300 Q52,295 58,340 Q65,375 70,380" fill="#1a4a1a" stroke="#2a6a2a" stroke-width="1"/>
  <path d="M75,380 Q72,345 65,308 Q70,302 75,350 Q82,370 85,380" fill="#1a4a1a" stroke="#2a6a2a" stroke-width="1"/>
  <path d="M85,380 Q90,350 88,315" stroke="#2a6a2a" stroke-width="2" fill="none"/>

  <!-- Plant bases (right) -->
  <path d="M820,380 Q815,340 808,300 Q812,295 818,340 Q825,375 830,380" fill="#1a4a1a" stroke="#2a6a2a" stroke-width="1"/>
  <path d="M840,380 Q837,345 830,308 Q835,302 840,350 Q847,370 850,380" fill="#1a4a1a" stroke="#2a6a2a" stroke-width="1"/>

  <!-- Bubbler column (right of crab) -->
  <g fill="none" stroke="#a0d4e0" stroke-opacity="0.4">
    <circle cx="720" cy="350" r="4"/>
    <circle cx="718" cy="320" r="5.5"/>
    <circle cx="722" cy="290" r="4"/>
    <circle cx="716" cy="260" r="6"/>
    <circle cx="720" cy="235" r="5"/>
    <circle cx="718" cy="210" r="4.5"/>
  </g>

  <!-- Water column above substrate -->
  <rect x="0" y="36" width="900" height="344" fill="#071830" opacity="0.85"/>

  <!-- Caustic light patterns on substrate -->
  <g fill="#c9a84c" opacity="0.12">
    <path d="M280,365 Q310,358 340,368 Q325,378 290,376 Z"/>
    <path d="M380,358 Q415,350 445,362 Q430,373 395,372 Z"/>
    <path d="M490,363 Q520,356 548,366 Q532,377 500,376 Z"/>
  </g>

  <!-- ===== MAIN CRAB ===== -->

  <!-- Carapace body -->
  <ellipse cx="450" cy="345" rx="72" ry="45" fill="#7c3f1e" stroke="#a85c2a" stroke-width="2"/>

  <!-- Carapace texture — highlight ridges -->
  <g stroke="#a85c2a" stroke-width="0.8" fill="none" opacity="0.6">
    <path d="M395,330 Q420,320 450,318 Q480,320 505,330"/>
    <path d="M385,342 Q415,330 450,328 Q485,330 515,342"/>
    <path d="M390,355 Q418,345 450,343 Q482,345 510,355"/>
    <path d="M400,365 Q422,358 450,356 Q478,358 500,365"/>
  </g>

  <!-- Carapace highlight -->
  <ellipse cx="440" cy="328" rx="35" ry="18" fill="#c47840" opacity="0.25"/>

  <!-- Carapace rostrum (front protrusion) -->
  <path d="M425,305 Q450,295 475,305 Q465,298 450,293 Q435,298 425,305 Z" fill="#7c3f1e" stroke="#a85c2a" stroke-width="1.5"/>

  <!-- Eyes on stalks -->
  <line x1="430" y1="300" x2="420" y2="288" stroke="#5a2d12" stroke-width="3"/>
  <circle cx="420" cy="285" r="7" fill="#1a0a00"/><circle cx="418" cy="283" r="3" fill="#c47840"/><circle cx="417" cy="282" r="1.5" fill="#ffffff"/>
  <line x1="470" y1="300" x2="480" y2="288" stroke="#5a2d12" stroke-width="3"/>
  <circle cx="480" cy="285" r="7" fill="#1a0a00"/><circle cx="482" cy="283" r="3" fill="#c47840"/><circle cx="483" cy="282" r="1.5" fill="#ffffff"/>

  <!-- === 8 LEGS: 4 left, 4 right — alternating gait === -->

  <!-- LEFT LEGS (4): alternating stepped positions -->
  <!-- Leg L1 (front-left, raised) -->
  <line x1="388" y1="330" x2="355" y2="310" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="355" y1="310" x2="325" y2="340" stroke="#5a2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="325" y1="340" x2="310" y2="370" stroke="#5a2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- Leg L2 (extended down) -->
  <line x1="382" y1="340" x2="348" y2="348" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="348" y1="348" x2="320" y2="368" stroke="#5a2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="320" y1="368" x2="308" y2="390" stroke="#5a2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- Leg L3 (raised, mid-step) -->
  <line x1="376" y1="352" x2="340" y2="344" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="344" x2="310" y2="358" stroke="#5a2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="310" y1="358" x2="300" y2="380" stroke="#5a2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- Leg L4 (back-left, extended) -->
  <line x1="370" y1="365" x2="333" y2="368" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="333" y1="368" x2="308" y2="380" stroke="#5a2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="308" y1="380" x2="295" y2="400" stroke="#5a2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- RIGHT LEGS (4): opposite phase -->
  <!-- Leg R1 (front-right, extended) -->
  <line x1="512" y1="330" x2="545" y2="310" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="545" y1="310" x2="575" y2="340" stroke="#5a2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="575" y1="340" x2="590" y2="370" stroke="#5a2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- Leg R2 (raised, mid-step) -->
  <line x1="518" y1="340" x2="552" y2="344" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="552" y1="344" x2="578" y2="358" stroke="#5a2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="578" y1="358" x2="590" y2="378" stroke="#5a2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- Leg R3 (extended down) -->
  <line x1="524" y1="352" x2="560" y2="348" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="560" y1="348" x2="590" y2="368" stroke="#5a2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="590" y1="368" x2="600" y2="390" stroke="#5a2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- Leg R4 (back-right, raised) -->
  <line x1="530" y1="365" x2="567" y2="363" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="567" y1="363" x2="594" y2="375" stroke="#5a2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="594" y1="375" x2="606" y2="396" stroke="#5a2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- LEFT CLAW (lowered — idle rest) -->
  <line x1="395" y1="315" x2="358" y2="287" stroke="#5a2d12" stroke-width="7" stroke-linecap="round"/>
  <path d="M358,287 Q342,272 332,282 Q340,295 352,292 Z" fill="#7c3f1e" stroke="#a85c2a" stroke-width="1.5"/>
  <path d="M358,287 Q345,275 340,285" stroke="#5a2d12" stroke-width="3" fill="none"/>

  <!-- RIGHT CLAW (slightly raised — idle cycle) -->
  <line x1="505" y1="315" x2="542" y2="287" stroke="#5a2d12" stroke-width="7" stroke-linecap="round"/>
  <path d="M542,287 Q558,272 568,282 Q560,295 548,292 Z" fill="#7c3f1e" stroke="#a85c2a" stroke-width="1.5"/>
  <path d="M542,287 Q555,275 558,285" stroke="#5a2d12" stroke-width="3" fill="none"/>

  <!-- Gait direction arrow -->
  <line x1="450" y1="410" x2="550" y2="410" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#3fb950"/>
    </marker>
  </defs>
  <text x="490" y="428" font-family="monospace" font-size="9" fill="#3fb950" text-anchor="middle">sideways gait direction</text>

  <!-- ===== ANNOTATIONS ===== -->
  <line x1="450" y1="298" x2="450" y2="260" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="254" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">carapace texture</text>
  <text x="450" y="244" font-family="monospace" font-size="9" fill="#c47840" text-anchor="middle">(ridge highlights #c47840)</text>

  <line x1="350" y1="290" x2="310" y2="265" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="265" y="262" font-family="monospace" font-size="10" fill="#8b949e">leg joint pivot</text>

  <line x1="340" y1="282" x2="290" y2="248" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="220" y="245" font-family="monospace" font-size="10" fill="#a85c2a">claw anatomy</text>

  <line x1="560" y1="280" x2="605" y2="250" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="612" y="248" font-family="monospace" font-size="10" fill="#d29922">idle claw cycle</text>

  <!-- ===== DEFENSIVE DISPLAY INSET ===== -->
  <rect x="680" y="60" width="200" height="175" fill="#0d1117" stroke="#d29922" stroke-width="2" rx="4"/>
  <text x="780" y="80" font-family="monospace" font-size="10" fill="#d29922" text-anchor="middle">DEFENSIVE DISPLAY</text>
  <text x="780" y="92" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">(on click / tap)</text>

  <!-- Mini crab carapace -->
  <ellipse cx="780" cy="155" rx="40" ry="28" fill="#7c3f1e" stroke="#a85c2a" stroke-width="1.5"/>
  <!-- Both claws raised high -->
  <line x1="755" y1="133" x2="728" y2="108" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <path d="M728,108 Q714,96 706,108 Q714,120 726,115 Z" fill="#7c3f1e" stroke="#a85c2a" stroke-width="1.5"/>

  <line x1="805" y1="133" x2="832" y2="108" stroke="#5a2d12" stroke-width="5" stroke-linecap="round"/>
  <path d="M832,108 Q846,96 854,108 Q846,120 834,115 Z" fill="#7c3f1e" stroke="#a85c2a" stroke-width="1.5"/>

  <!-- Eyes wide open -->
  <circle cx="762" cy="130" r="6" fill="#1a0a00"/><circle cx="761" cy="129" r="2.5" fill="#ff6b35"/><circle cx="760" cy="128" r="1.2" fill="#ffffff"/>
  <circle cx="798" cy="130" r="6" fill="#1a0a00"/><circle cx="799" cy="129" r="2.5" fill="#ff6b35"/><circle cx="800" cy="128" r="1.2" fill="#ffffff"/>

  <!-- Mini legs -->
  <line x1="748" y1="155" x2="720" y2="165" stroke="#5a2d12" stroke-width="3"/><line x1="720" y1="165" x2="705" y2="183" stroke="#5a2d12" stroke-width="2.5"/>
  <line x1="742" y1="163" x2="715" y2="175" stroke="#5a2d12" stroke-width="3"/><line x1="715" y1="175" x2="700" y2="195" stroke="#5a2d12" stroke-width="2.5"/>
  <line x1="812" y1="155" x2="840" y2="165" stroke="#5a2d12" stroke-width="3"/><line x1="840" y1="165" x2="855" y2="183" stroke="#5a2d12" stroke-width="2.5"/>
  <line x1="818" y1="163" x2="845" y2="175" stroke="#5a2d12" stroke-width="3"/><line x1="845" y1="175" x2="860" y2="195" stroke="#5a2d12" stroke-width="2.5"/>

  <text x="780" y="222" font-family="monospace" font-size="9" fill="#d29922" text-anchor="middle">claws raised · eye highlight</text>
  <text x="780" y="232" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">triggered by click/tap event</text>

  <!-- Footer -->
  <rect x="0" y="484" width="900" height="36" fill="#161b22"/>
  <text x="450" y="506" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">Crab: THREE.Object3D hierarchy · 8-leg IK system · sideways alternating gait · carapace PBR texture</text>
</svg>

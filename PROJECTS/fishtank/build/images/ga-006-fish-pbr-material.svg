<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; fill: #e6edf3; }
      .title { font-size: 18px; font-weight: 600; fill: #e6edf3; }
      .label { font-size: 13px; fill: #e6edf3; }
      .small { font-size: 11px; fill: #8b949e; }
      .code { font-size: 11px; font-family: 'Cascadia Code', monospace; fill: #f78166; }
      .prop { font-size: 11px; font-family: 'Cascadia Code', monospace; fill: #79c0ff; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3d444d"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f78166"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="#0d1117"/>
  <rect x="0" y="0" width="1100" height="44" fill="#161b22"/>
  <text x="24" y="28" class="title">GA-006 · Fish PBR Material System</text>
  <text x="900" y="28" class="small">TRACEABILITY: DI-019</text>

  <!-- === LEFT COLUMN: ScaleTextureShader pipeline === -->
  <text x="60" y="72" class="label" font-weight="600" fill="#f78166">ScaleTextureShader Pipeline</text>

  <!-- GLSL hex pattern block -->
  <rect x="44" y="84" width="220" height="64" rx="6" fill="#161b22" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="154" y="105" class="label" text-anchor="middle">GLSL Fragment Shader</text>
  <text x="154" y="121" class="small" text-anchor="middle">Hex scale pattern (uRows, uBase,</text>
  <text x="154" y="135" class="small" text-anchor="middle">uHighlight) → smoothstep edge</text>

  <!-- Arrow down -->
  <line x1="154" y1="148" x2="154" y2="172" stroke="#3d444d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- WebGLRenderTarget block -->
  <rect x="44" y="172" width="220" height="52" rx="6" fill="#161b22" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="154" y="194" class="label" text-anchor="middle">WebGLRenderTarget</text>
  <text x="154" y="210" class="small" text-anchor="middle">256 × 256 px · LinearMipmapLinear</text>

  <!-- Arrow down -->
  <line x1="154" y1="224" x2="154" y2="248" stroke="#3d444d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DataTexture output -->
  <rect x="44" y="248" width="220" height="44" rx="6" fill="#0d1117" stroke="#f78166" stroke-width="2"/>
  <text x="154" y="268" class="label" text-anchor="middle" fill="#f78166" font-weight="600">rt.texture → DataTexture</text>
  <text x="154" y="283" class="small" text-anchor="middle">output: assigned to .map</text>

  <!-- Arrow right to body -->
  <line x1="264" y1="270" x2="330" y2="270" stroke="#f78166" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="293" y="263" class="small" text-anchor="middle">.map</text>

  <!-- Per-species colour table -->
  <rect x="44" y="320" width="220" height="120" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="154" y="340" class="small" text-anchor="middle" fill="#d29922" font-weight="600">Per-Species Colour Params</text>
  <text x="56" y="358" class="small">Species</text>
  <text x="170" y="358" class="small">baseColour</text>
  <text x="56" y="374" class="code">Clownfish</text>
  <text x="170" y="374" class="code">#cc4400</text>
  <text x="56" y="390" class="code">Angelfish</text>
  <text x="170" y="390" class="code">#c0b0a0</text>
  <text x="56" y="406" class="code">Tetra</text>
  <text x="170" y="406" class="code">#2244aa</text>
  <text x="56" y="422" class="code">Gourami</text>
  <text x="170" y="422" class="code">#556644</text>

  <!-- === RIGHT COLUMN: FishMesh layers === -->
  <text x="360" y="72" class="label" font-weight="600" fill="#f78166">FishMesh — Exploded Layer View</text>

  <!-- LAYER 1: Body sphere -->
  <rect x="340" y="84" width="300" height="130" rx="8" fill="#161b22" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="490" y="106" class="label" text-anchor="middle" font-weight="600">Layer 1 — Body Mesh</text>
  <text x="490" y="124" class="small" text-anchor="middle">SphereGeometry scaled to fish proportions</text>
  <line x1="356" y1="136" x2="628" y2="136" stroke="#3d444d" stroke-width="1"/>
  <text x="356" y="151" class="prop">MeshStandardMaterial</text>
  <text x="356" y="165" class="small">  .map = ScaleTexture  .roughness = 0.7</text>
  <text x="356" y="179" class="small">  .metalness = 0.05    .side = FrontSide</text>
  <text x="356" y="193" class="small">  .transparent = false</text>

  <!-- Arrow down -->
  <line x1="490" y1="214" x2="490" y2="238" stroke="#3d444d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LAYER 2: Fin overlays -->
  <rect x="340" y="238" width="300" height="148" rx="8" fill="#161b22" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="490" y="260" class="label" text-anchor="middle" font-weight="600">Layer 2 — Fin Overlay Meshes</text>
  <text x="490" y="278" class="small" text-anchor="middle">PlaneGeometry (dorsal, 2× pectoral, caudal)</text>
  <line x1="356" y1="290" x2="628" y2="290" stroke="#3d444d" stroke-width="1"/>
  <text x="356" y="306" class="prop">MeshStandardMaterial (per fin)</text>
  <text x="356" y="322" class="small">  .transparent = true</text>
  <text x="356" y="338" class="small">  dorsal opacity = 0.35   pectoral = 0.45</text>
  <text x="356" y="354" class="small">  caudal opacity = 0.50   .side = DoubleSide</text>
  <text x="356" y="370" class="small">  pectLeft / pectRight: fan 35° idle → 0° burst</text>

  <!-- Arrow down -->
  <line x1="490" y1="386" x2="490" y2="410" stroke="#3d444d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LAYER 3: Eye sphere -->
  <rect x="340" y="410" width="300" height="140" rx="8" fill="#161b22" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="490" y="432" class="label" text-anchor="middle" font-weight="600">Layer 3 — Eye + Specular Disc</text>
  <text x="490" y="450" class="small" text-anchor="middle">2× SphereGeometry (iris + specular disc)</text>
  <line x1="356" y1="462" x2="628" y2="462" stroke="#3d444d" stroke-width="1"/>
  <text x="356" y="478" class="prop">Iris MeshStandardMaterial</text>
  <text x="356" y="494" class="small">  .color = #0a0a0a   .roughness = 0.9  .metalness = 0.0</text>
  <text x="356" y="510" class="prop">Specular disc MeshStandardMaterial</text>
  <text x="356" y="526" class="small">  .color = #ffffff   .roughness = 0.0  .opacity = 0.9</text>
  <text x="356" y="542" class="small">  position offset: +y +0.08h, +z +0.08h from iris centre</text>

  <!-- === LEGEND === -->
  <rect x="700" y="84" width="356" height="200" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="720" y="106" class="label" font-weight="600" fill="#d29922">Assembly Notes</text>
  <text x="720" y="126" class="small">• All layers are children of root Object3D</text>
  <text x="720" y="144" class="small">• ScaleTexture generated once per species</text>
  <text x="720" y="162" class="small">  instance at initialisation (not per frame)</text>
  <text x="720" y="180" class="small">• WebGLRenderTarget disposed after texture</text>
  <text x="720" y="198" class="small">  extraction; only rt.texture is retained</text>
  <text x="720" y="216" class="small">• Fin meshes named: 'pectLeft', 'pectRight',</text>
  <text x="720" y="234" class="small">  'caudal' for FishAnimator lookup</text>
  <text x="720" y="252" class="small">• renderer reference: passed from bootstrap</text>
  <text x="720" y="270" class="small">  (PT-002) in main.ts</text>

  <!-- BR ref box -->
  <rect x="700" y="304" width="356" height="80" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1"/>
  <text x="720" y="324" class="small" fill="#79c0ff" font-weight="600">Requirements Coverage</text>
  <text x="720" y="342" class="small">BR-038 Scale texture + fin translucency</text>
  <text x="720" y="358" class="small">BR-039 Specular eye highlight</text>
  <text x="720" y="374" class="small">AR-010 · PT-019 · PT-020 · PT-021</text>
</svg>

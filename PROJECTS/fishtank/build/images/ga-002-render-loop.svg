<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .title  { font-size: 16px; font-weight: 600; fill: #e6edf3; }
      .label  { font-size: 11px; fill: #c9d1d9; }
      .small  { font-size: 10px; fill: #8b949e; }
      .mono   { font-size: 9px;  fill: #79c0ff; font-family: 'Cascadia Code', 'Consolas', monospace; }
      .dim    { fill: #3d444d; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#8b949e"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f78166"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" class="title">Render Loop &amp; Tick Sequence — One rAF Frame</text>
  <text x="450" y="46" text-anchor="middle" class="small">DI-003 · DI-017 · delta-time cap = Math.min(rawDt, 0.1)</text>

  <!-- ─── FRAME BOUNDARY ─── -->
  <rect x="20" y="58" width="860" height="390" rx="8" fill="none" stroke="#3d444d" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="30" y="74" class="small" fill="#3d444d">requestAnimationFrame frame N</text>

  <!-- ─── COLUMN HEADERS ─── -->
  <!-- Column positions: Renderer=100, Input=220, FluidGrid=340, Particles=460, Bubbles=570, Plants=670, Fish=770, Render=870 -->
  <text x="100" y="92" text-anchor="middle" class="small" fill="#f78166">Renderer</text>
  <text x="230" y="92" text-anchor="middle" class="small" fill="#c9d1d9">Input</text>
  <text x="355" y="92" text-anchor="middle" class="small" fill="#79c0ff">FluidGrid</text>
  <text x="465" y="92" text-anchor="middle" class="small" fill="#79c0ff">Particles</text>
  <text x="570" y="92" text-anchor="middle" class="small" fill="#79c0ff">Bubbles</text>
  <text x="665" y="92" text-anchor="middle" class="small" fill="#3fb950">Plants</text>
  <text x="758" y="92" text-anchor="middle" class="small" fill="#3fb950">Fish</text>
  <text x="852" y="92" text-anchor="middle" class="small" fill="#f78166">THREE.render</text>

  <!-- ─── LIFELINES ─── -->
  <line x1="100" y1="98" x2="100" y2="430" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="230" y1="98" x2="230" y2="430" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="355" y1="98" x2="355" y2="430" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="465" y1="98" x2="465" y2="430" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="570" y1="98" x2="570" y2="430" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="665" y1="98" x2="665" y2="430" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="758" y1="98" x2="758" y2="430" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="852" y1="98" x2="852" y2="430" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ─── STEP 1: compute dt ─── -->
  <rect x="60" y="108" width="80" height="28" rx="4" fill="#161b22" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="100" y="127" text-anchor="middle" class="mono">compute dt</text>
  <text x="155" y="122" class="small">rawDt = (now − lastTime) / 1000</text>
  <text x="155" y="134" class="small">dt = Math.min(rawDt, 0.1) ◀ cap</text>

  <!-- ─── STEP 2: input.update ─── -->
  <line x1="100" y1="158" x2="230" y2="158" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190" y="162" width="80" height="24" rx="4" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="230" y="178" text-anchor="middle" class="mono">update(dt)</text>
  <text x="100" y="155" class="small" fill="#8b949e">①</text>

  <!-- ─── STEP 3: fluidGrid.step ─── -->
  <line x1="100" y1="206" x2="355" y2="206" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="315" y="210" width="80" height="24" rx="4" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="355" y="226" text-anchor="middle" class="mono">step(dt)</text>
  <text x="100" y="203" class="small" fill="#8b949e">②</text>

  <!-- ─── STEP 4: particles.update ─── -->
  <line x1="100" y1="252" x2="465" y2="252" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="425" y="256" width="80" height="24" rx="4" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="465" y="272" text-anchor="middle" class="mono">update(dt)</text>
  <text x="100" y="249" class="small" fill="#8b949e">③</text>

  <!-- ─── STEP 5: bubbles.update ─── -->
  <line x1="100" y1="298" x2="570" y2="298" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="530" y="302" width="80" height="24" rx="4" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="570" y="318" text-anchor="middle" class="mono">update(dt)</text>
  <text x="100" y="295" class="small" fill="#8b949e">④</text>

  <!-- ─── STEP 6: plants.update ─── -->
  <line x1="100" y1="344" x2="665" y2="344" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="625" y="348" width="80" height="24" rx="4" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="665" y="364" text-anchor="middle" class="mono">update(dt)</text>
  <text x="100" y="341" class="small" fill="#8b949e">⑤</text>

  <!-- ─── STEP 7: fish.update ─── -->
  <line x1="100" y1="390" x2="758" y2="390" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="718" y="394" width="80" height="24" rx="4" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="758" y="410" text-anchor="middle" class="mono">update(dt)</text>
  <text x="100" y="387" class="small" fill="#8b949e">⑥</text>

  <!-- ─── STEP 8: renderer.render (LAST) ─── -->
  <line x1="100" y1="428" x2="852" y2="428" stroke="#f78166" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="812" y="432" width="80" height="24" rx="4" fill="#161b22" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="852" y="448" text-anchor="middle" class="mono">render()</text>
  <text x="100" y="425" class="small" fill="#f78166">⑦ LAST</text>

  <!-- ─── NOTE: dt cap annotation ─── -->
  <rect x="60" y="136" width="80" height="18" rx="3" fill="#9e6a03" fill-opacity="0.25" stroke="#9e6a03" stroke-width="1"/>
  <text x="100" y="149" text-anchor="middle" class="small" fill="#d29922">dt ≤ 0.1 s</text>

  <!-- ─── rAF reschedule ─── -->
  <path d="M 100 456 Q 50 470 50 140 Q 50 108 68 108" fill="none" stroke="#3d444d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="28" y="280" class="small" fill="#3d444d" transform="rotate(-90,28,280)">requestAnimationFrame</text>
</svg>

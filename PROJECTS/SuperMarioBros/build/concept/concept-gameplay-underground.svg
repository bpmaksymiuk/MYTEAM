<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-005 Gameplay Underground | UC-004, UC-006, UC-007, UC-008 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-005 — Gameplay Underground Level</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-004 UC-006 UC-007 UC-008</desc>

  <!-- Background: dark underground -->
  <rect width="800" height="500" fill="#0a0a1a"/>

  <!-- HUD bar -->
  <rect x="0" y="0" width="800" height="42" fill="#1a0000"/>
  <text x="30" y="16" font-family="monospace" font-size="11" fill="#fff">MARIO</text>
  <text x="30" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">001200</text>
  <circle cx="310" cy="16" r="7" fill="#f1c40f"/>
  <text x="322" y="21" font-family="monospace" font-size="13" fill="#fff">×12</text>
  <text x="390" y="16" font-family="monospace" font-size="11" fill="#fff">WORLD</text>
  <text x="398" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">1-2</text>
  <text x="510" y="16" font-family="monospace" font-size="11" fill="#fff">TIME</text>
  <text x="512" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">280</text>

  <!-- Ceiling tiles (blue-grey stone brick) -->
  <rect x="0" y="44" width="800" height="40" fill="#2c3e8c"/>
  <g stroke="#1a2a6c" stroke-width="1">
    <line x1="40" y1="44" x2="40" y2="84"/>
    <line x1="80" y1="44" x2="80" y2="84"/>
    <line x1="120" y1="44" x2="120" y2="84"/>
    <line x1="160" y1="44" x2="160" y2="84"/>
    <line x1="200" y1="44" x2="200" y2="84"/>
    <line x1="240" y1="44" x2="240" y2="84"/>
    <line x1="280" y1="44" x2="280" y2="84"/>
    <line x1="320" y1="44" x2="320" y2="84"/>
    <line x1="360" y1="44" x2="360" y2="84"/>
    <line x1="400" y1="44" x2="400" y2="84"/>
    <line x1="440" y1="44" x2="440" y2="84"/>
    <line x1="480" y1="44" x2="480" y2="84"/>
    <line x1="520" y1="44" x2="520" y2="84"/>
    <line x1="560" y1="44" x2="560" y2="84"/>
    <line x1="600" y1="44" x2="600" y2="84"/>
    <line x1="640" y1="44" x2="640" y2="84"/>
    <line x1="680" y1="44" x2="680" y2="84"/>
    <line x1="720" y1="44" x2="720" y2="84"/>
    <line x1="760" y1="44" x2="760" y2="84"/>
    <line x1="0" y1="64" x2="800" y2="64"/>
  </g>
  <text x="20" y="100" font-family="monospace" font-size="10" fill="#6699ff">REGION: STONE CEILING — blue-grey brick tile row</text>

  <!-- Floor tiles -->
  <rect x="0" y="430" width="800" height="70" fill="#2c3e8c"/>
  <g stroke="#1a2a6c" stroke-width="1">
    <line x1="40" y1="430" x2="40" y2="500"/>
    <line x1="80" y1="430" x2="80" y2="500"/>
    <line x1="120" y1="430" x2="120" y2="500"/>
    <line x1="160" y1="430" x2="160" y2="500"/>
    <line x1="200" y1="430" x2="200" y2="500"/>
    <line x1="240" y1="430" x2="240" y2="500"/>
    <line x1="280" y1="430" x2="280" y2="500"/>
    <line x1="320" y1="430" x2="320" y2="500"/>
    <line x1="360" y1="430" x2="360" y2="500"/>
    <line x1="400" y1="430" x2="400" y2="500"/>
    <line x1="440" y1="430" x2="440" y2="500"/>
    <line x1="480" y1="430" x2="480" y2="500"/>
    <line x1="520" y1="430" x2="520" y2="500"/>
    <line x1="560" y1="430" x2="560" y2="500"/>
    <line x1="600" y1="430" x2="600" y2="500"/>
    <line x1="640" y1="430" x2="640" y2="500"/>
    <line x1="680" y1="430" x2="680" y2="500"/>
    <line x1="720" y1="430" x2="720" y2="500"/>
    <line x1="760" y1="430" x2="760" y2="500"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>
  <text x="20" y="428" font-family="monospace" font-size="10" fill="#6699ff">REGION: STONE FLOOR — blue-grey brick tile row</text>

  <!-- Left-side entrance pipe -->
  <rect x="0" y="350" width="50" height="80" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <rect x="0" y="340" width="64" height="18" rx="3" fill="#2ecc71" stroke="#1e8449" stroke-width="2"/>
  <text x="32" y="338" font-family="monospace" font-size="9" text-anchor="middle" fill="#1e8449">IN</text>

  <!-- Right-side exit pipe -->
  <rect x="740" y="350" width="60" height="80" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <rect x="728" y="340" width="72" height="18" rx="3" fill="#2ecc71" stroke="#1e8449" stroke-width="2"/>
  <text x="764" y="338" font-family="monospace" font-size="9" text-anchor="middle" fill="#1e8449">OUT→OW</text>
  <text x="764" y="358" font-family="monospace" font-size="9" text-anchor="middle" fill="#2ecc71">[warp]</text>

  <!-- Pillar (mid stone wall) -->
  <rect x="350" y="84" width="40" height="200" fill="#2c3e8c" stroke="#1a2a6c" stroke-width="1"/>
  <text x="370" y="200" font-family="monospace" font-size="10" text-anchor="middle" fill="#6699ff">PILLAR</text>

  <!-- Coin row -->
  <g fill="#f1c40f" stroke="#d4ac0d" stroke-width="1">
    <circle cx="120" cy="250" r="9"/>
    <circle cx="145" cy="250" r="9"/>
    <circle cx="170" cy="250" r="9"/>
    <circle cx="195" cy="250" r="9"/>
    <circle cx="220" cy="250" r="9"/>
    <circle cx="245" cy="250" r="9"/>
  </g>
  <text x="182" y="238" font-family="monospace" font-size="10" text-anchor="middle" fill="#f1c40f">REGION: COIN ROW (corridor centre)</text>

  <!-- Q-block with Mushroom -->
  <rect x="540" y="280" width="36" height="36" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="558" y="304" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">?</text>
  <text x="558" y="272" font-family="monospace" font-size="9" text-anchor="middle" fill="#e67e22">Mushroom inside</text>

  <!-- Mario sprite (small, underground) -->
  <rect x="130" y="398" width="24" height="30" rx="2" fill="#e74c3c"/>
  <circle cx="142" cy="393" r="12" fill="#e74c3c"/>
  <rect x="133" y="408" width="10" height="16" fill="#2980b9"/>
  <rect x="147" y="408" width="10" height="16" fill="#2980b9"/>
  <text x="142" y="460" font-family="monospace" font-size="9" text-anchor="middle" fill="#e74c3c">MARIO</text>

  <!-- Goombler enemy in narrow passage -->
  <rect x="450" y="402" width="30" height="26" rx="4" fill="#8B4513"/>
  <circle cx="457" cy="406" r="4" fill="#fff"/>
  <circle cx="471" cy="406" r="4" fill="#fff"/>
  <circle cx="457" cy="407" r="2" fill="#000"/>
  <circle cx="471" cy="407" r="2" fill="#000"/>
  <text x="465" y="450" font-family="monospace" font-size="9" text-anchor="middle" fill="#8B4513">GOOMBLER</text>

  <!-- Interaction note -->
  <rect x="10" y="462" width="780" height="34" rx="2" fill="#00000099"/>
  <text x="20" y="476" font-family="monospace" font-size="10" fill="#6699ff">REGION: UNDERGROUND — black bg, blue-grey stone bricks, no sky. Narrower passages = tighter jump timing.</text>
  <text x="20" y="490" font-family="monospace" font-size="10" fill="#2ecc71">Exit pipe (right edge) warps Mario back to overworld at a later position (warp zone mechanic).</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-002 Main Menu Screen | UC-002 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-002 — Main Menu Screen</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-002</desc>

  <!-- Sky background -->
  <rect width="800" height="500" fill="#5c94fc"/>

  <!-- Region annotation: background -->
  <text x="20" y="20" font-family="monospace" font-size="11" fill="#1a3a8c">REGION: SKY BACKGROUND — #5c94fc Mario-blue</text>

  <!-- Clouds (decorative) -->
  <ellipse cx="120" cy="80" rx="60" ry="30" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="160" cy="70" rx="40" ry="25" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="600" cy="100" rx="70" ry="32" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="640" cy="88" rx="45" ry="22" fill="#ffffff" opacity="0.9"/>
  <text x="20" y="50" font-family="monospace" font-size="11" fill="#1a3a8c">REGION: CLOUD SPRITES — white puffs, static</text>

  <!-- Title logo block -->
  <rect x="100" y="110" width="600" height="70" rx="0" fill="#c0392b"/>
  <text x="400" y="157" font-family="monospace" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="3">SUPER MARIO BROS</text>
  <text x="20" y="108" font-family="monospace" font-size="11" fill="#1a3a8c">REGION: TITLE LOGO — red block, white pixel font</text>

  <!-- Q-block row -->
  <g fill="#e67e22" stroke="#d35400" stroke-width="1">
    <rect x="80" y="210" width="36" height="36"/>
    <rect x="130" y="210" width="36" height="36"/>
    <rect x="180" y="210" width="36" height="36"/>
    <rect x="230" y="210" width="36" height="36"/>
    <rect x="280" y="210" width="36" height="36"/>
    <rect x="480" y="210" width="36" height="36"/>
    <rect x="530" y="210" width="36" height="36"/>
    <rect x="580" y="210" width="36" height="36"/>
    <rect x="630" y="210" width="36" height="36"/>
    <rect x="680" y="210" width="36" height="36"/>
  </g>
  <text x="400" y="207" font-family="monospace" font-size="11" text-anchor="middle" fill="#1a3a8c">REGION: Q-BLOCK ROW — mid-height decoration</text>

  <!-- Menu items -->
  <text x="400" y="295" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">1 PLAYER GAME</text>
  <text x="400" y="340" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle" fill="#888">2 PLAYER GAME</text>
  <!-- Blinking cursor arrow -->
  <polygon points="320,283 308,290 320,297" fill="#ffffff"/>
  <text x="20" y="275" font-family="monospace" font-size="11" fill="#1a3a8c">REGION: MENU ITEMS — cursor arrow blinks next to selection</text>

  <!-- Bottom strip -->
  <rect x="0" y="440" width="800" height="60" fill="#2c3e50"/>
  <text x="200" y="475" font-family="monospace" font-size="14" fill="#f1c40f">TOP - 000000</text>
  <text x="600" y="475" font-family="monospace" font-size="12" fill="#aaa" text-anchor="middle">© 1985 NINTENDO CO., LTD</text>
  <text x="20" y="438" font-family="monospace" font-size="11" fill="#1a3a8c">REGION: BOTTOM STRIP — high score + copyright</text>

  <!-- Interaction note -->
  <rect x="10" y="490" width="780" height="8" fill="none"/>
  <text x="400" y="498" font-family="monospace" font-size="10" text-anchor="middle" fill="#1a3a8c">INTERACTION: Arrow keys select item; Enter/Start confirms → CB-004 (Gameplay World 1-1)</text>
</svg>

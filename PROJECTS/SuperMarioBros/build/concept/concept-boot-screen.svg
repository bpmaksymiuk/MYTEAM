<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-001 Boot Screen | UC-001 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-001 — Boot / Loading Screen</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-001</desc>

  <!-- Background -->
  <rect width="800" height="500" fill="#1a0000"/>

  <!-- Region label: BACKGROUND -->
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="20" y="28" font-family="monospace" font-size="11" fill="#666">REGION: BACKGROUND (solid black/dark-red)</text>

  <!-- Title lockup -->
  <rect x="120" y="80" width="560" height="80" rx="4" fill="#c0392b"/>
  <text x="400" y="130" font-family="monospace" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="4">SUPER MARIO BROS</text>
  <text x="20" y="75" font-family="monospace" font-size="11" fill="#aaa">REGION: TITLE LOCKUP — pixel font, Nintendo red block</text>

  <!-- Coin sprite (4-frame spin placeholder) -->
  <g transform="translate(400,250)">
    <circle cx="0" cy="0" r="30" fill="#f1c40f" stroke="#d4ac0d" stroke-width="3"/>
    <text x="0" y="8" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">$</text>
    <!-- frame indicators -->
    <rect x="-60" y="40" width="16" height="16" rx="2" fill="#f1c40f" opacity="0.9"/>
    <rect x="-36" y="40" width="16" height="16" rx="2" fill="#d4ac0d" opacity="0.7"/>
    <rect x="-12" y="40" width="16" height="16" rx="2" fill="#b8860b" opacity="0.5"/>
    <rect x="12" y="40" width="16" height="16" rx="2" fill="#8B6914" opacity="0.3"/>
  </g>
  <text x="400" y="320" font-family="monospace" font-size="11" text-anchor="middle" fill="#aaa">[coin spin animation — 4 frames @ 8 fps]</text>
  <text x="20" y="235" font-family="monospace" font-size="11" fill="#aaa">REGION: COIN SPIN — animated gold coin, centred</text>

  <!-- Progress bar -->
  <rect x="150" y="410" width="500" height="20" rx="4" fill="#333"/>
  <rect x="150" y="410" width="180" height="20" rx="4" fill="#e74c3c"/>
  <text x="400" y="407" font-family="monospace" font-size="11" text-anchor="middle" fill="#aaa">REGION: LOADING PROGRESS BAR (0–100%)</text>
  <text x="400" y="450" font-family="monospace" font-size="12" text-anchor="middle" fill="#666">Loading assets... 36%</text>

  <!-- Interaction note -->
  <rect x="10" y="465" width="780" height="24" fill="#111"/>
  <text x="20" y="481" font-family="monospace" font-size="11" fill="#888">INTERACTION: No input. Auto-advances to CB-002 (Main Menu) when load completes.</text>
</svg>

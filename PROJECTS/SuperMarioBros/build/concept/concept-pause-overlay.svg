<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-012 Pause Overlay | UC-009 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-012 — Pause Overlay</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-009</desc>

  <!-- Frozen game background (muted) -->
  <rect width="800" height="500" fill="#3a5a8c" opacity="0.7"/>
  <text x="20" y="20" font-family="monospace" font-size="11" fill="#d0e8ff">REGION: GAME BACKGROUND (frozen, muted/darkened overlay)</text>

  <!-- Decorative frozen-state platform hint -->
  <rect x="0" y="420" width="800" height="80" fill="#2d5a27" opacity="0.5"/>
  <rect x="100" y="320" width="200" height="30" fill="#4a3000" opacity="0.5"/>
  <rect x="500" y="280" width="200" height="30" fill="#4a3000" opacity="0.5"/>
  <text x="20" y="415" font-family="monospace" font-size="10" fill="#d0e8ff">REGION: FROZEN LEVEL (physics/animations halted)</text>

  <!-- Semi-transparent pause panel -->
  <rect x="200" y="140" width="400" height="220" rx="8" fill="#000000" opacity="0.78"/>
  <rect x="200" y="140" width="400" height="220" rx="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <text x="20" y="138" font-family="monospace" font-size="11" fill="#d0e8ff">REGION: PAUSE PANEL — semi-transparent black modal</text>

  <!-- PAUSE title -->
  <text x="400" y="195" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="4">PAUSED</text>
  <text x="400" y="215" font-family="monospace" font-size="10" text-anchor="middle" fill="#aaaaaa">Press ESC or P to toggle</text>

  <!-- Divider -->
  <line x1="240" y1="228" x2="560" y2="228" stroke="#555555" stroke-width="1"/>

  <!-- Menu options -->
  <!-- Resume (selected) -->
  <text x="330" y="265" font-family="monospace" font-size="18" fill="#FFD700">▶</text>
  <text x="355" y="265" font-family="monospace" font-size="18" fill="#FFD700">RESUME</text>
  <text x="20" y="263" font-family="monospace" font-size="10" fill="#d0e8ff">REGION: RESUME OPTION (selected — gold highlight, arrow cursor)</text>

  <!-- Main Menu -->
  <text x="330" y="305" font-family="monospace" font-size="18" fill="#ffffff">  MAIN MENU</text>
  <text x="20" y="303" font-family="monospace" font-size="10" fill="#d0e8ff">REGION: MAIN MENU OPTION (unselected — white)</text>

  <!-- Interaction annotations -->
  <text x="20" y="460" font-family="monospace" font-size="11" fill="#FFD700">INTERACTION: Arrow keys navigate options. Enter/Space confirms selection.</text>
  <text x="20" y="480" font-family="monospace" font-size="11" fill="#FFD700">RESUME → game state restored (timer, score, position unchanged).</text>
  <text x="20" y="440" font-family="monospace" font-size="11" fill="#FFD700">MAIN MENU → clears game state, transitions to concept-main-menu.svg.</text>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="#aaaaaa" stroke-width="1"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-009 Collectible Items Reference | UC-007 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-009 — Collectible Items Reference Sheet</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-007</desc>

  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="32" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">COLLECTIBLE ITEMS REFERENCE SHEET</text>
  <line x1="40" y1="42" x2="760" y2="42" stroke="#444" stroke-width="1"/>

  <!-- COIN panel (top-left) -->
  <rect x="30" y="60" width="340" height="190" rx="4" fill="#2c2c1a" stroke="#f1c40f" stroke-width="2"/>
  <text x="200" y="84" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#f1c40f">COIN</text>
  <!-- Coin sprite -->
  <circle cx="200" cy="140" r="38" fill="#f1c40f" stroke="#d4ac0d" stroke-width="3"/>
  <circle cx="200" cy="140" r="26" fill="#e8a800" stroke="#c49200" stroke-width="2"/>
  <text x="200" y="148" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">¢</text>
  <!-- Pedestal -->
  <rect x="186" y="178" width="28" height="8" fill="#888"/>
  <rect x="176" y="186" width="48" height="6" fill="#666"/>
  <!-- Effect text -->
  <text x="200" y="218" font-family="monospace" font-size="11" text-anchor="middle" fill="#f1c40f">+200 pts per coin</text>
  <text x="200" y="234" font-family="monospace" font-size="11" text-anchor="middle" fill="#fff">100 coins = +1 LIFE</text>
  <text x="200" y="246" font-family="monospace" font-size="9" text-anchor="middle" fill="#888">Collect on contact | Pops from Q-block or brick</text>

  <!-- MUSHROOM panel (top-right) -->
  <rect x="430" y="60" width="340" height="190" rx="4" fill="#1a2c1a" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="84" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">MUSHROOM</text>
  <!-- Mushroom sprite -->
  <ellipse cx="600" cy="118" rx="40" ry="28" fill="#e74c3c"/>
  <!-- white spots -->
  <circle cx="582" cy="112" r="7" fill="#ffffff"/>
  <circle cx="600" cy="106" r="8" fill="#ffffff"/>
  <circle cx="618" cy="112" r="7" fill="#ffffff"/>
  <!-- stem -->
  <rect x="582" y="140" width="36" height="28" rx="4" fill="#f0d9a8"/>
  <!-- eyes -->
  <circle cx="592" cy="148" r="4" fill="#1a0000"/>
  <circle cx="608" cy="148" r="4" fill="#1a0000"/>
  <!-- Pedestal -->
  <rect x="586" y="168" width="28" height="8" fill="#888"/>
  <rect x="576" y="176" width="48" height="6" fill="#666"/>
  <!-- Effect text -->
  <text x="600" y="206" font-family="monospace" font-size="11" text-anchor="middle" fill="#27ae60">Small → Super Mario</text>
  <text x="600" y="222" font-family="monospace" font-size="11" text-anchor="middle" fill="#fff">Mario grows to 2-tile height</text>
  <text x="600" y="238" font-family="monospace" font-size="9" text-anchor="middle" fill="#888">Slides along floor after popping from block</text>

  <!-- FIRE FLOWER panel (bottom-left) -->
  <rect x="30" y="270" width="340" height="200" rx="4" fill="#2c1a1a" stroke="#e67e22" stroke-width="2"/>
  <text x="200" y="294" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#e67e22">FIRE FLOWER</text>
  <!-- Flower sprite -->
  <!-- petals -->
  <circle cx="200" cy="330" r="14" fill="#e74c3c"/>
  <circle cx="185" cy="345" r="12" fill="#e74c3c"/>
  <circle cx="215" cy="345" r="12" fill="#e74c3c"/>
  <circle cx="184" cy="322" r="12" fill="#e67e22"/>
  <circle cx="216" cy="322" r="12" fill="#e67e22"/>
  <!-- centre -->
  <circle cx="200" cy="338" r="10" fill="#f1c40f"/>
  <!-- stem -->
  <line x1="200" y1="348" x2="200" y2="372" stroke="#27ae60" stroke-width="4"/>
  <!-- leaf -->
  <ellipse cx="215" cy="362" rx="14" ry="6" fill="#27ae60" transform="rotate(-30 215 362)"/>
  <!-- Pedestal -->
  <rect x="186" y="372" width="28" height="8" fill="#888"/>
  <rect x="176" y="380" width="48" height="6" fill="#666"/>
  <!-- Effect text -->
  <text x="200" y="408" font-family="monospace" font-size="11" text-anchor="middle" fill="#e67e22">Super → Fire Mario</text>
  <text x="200" y="424" font-family="monospace" font-size="11" text-anchor="middle" fill="#fff">Throws bouncing fireballs</text>
  <text x="200" y="440" font-family="monospace" font-size="9" text-anchor="middle" fill="#888">Fireball defeats most enemies on contact (B to shoot)</text>
  <text x="200" y="456" font-family="monospace" font-size="9" text-anchor="middle" fill="#888">Only from Q-block (requires Super state to collect)</text>

  <!-- STAR panel (bottom-right) -->
  <rect x="430" y="270" width="340" height="200" rx="4" fill="#2c2c0a" stroke="#f1c40f" stroke-width="2" stroke-dasharray="6 2"/>
  <text x="600" y="294" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#f1c40f">STAR</text>
  <!-- Star sprite -->
  <polygon points="600,308 607,328 628,328 612,340 618,362 600,350 582,362 588,340 572,328 593,328" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
  <!-- face -->
  <circle cx="593" cy="332" r="3" fill="#1a1a00"/>
  <circle cx="607" cy="332" r="3" fill="#1a1a00"/>
  <path d="M 592 340 Q 600 346 608 340" stroke="#1a1a00" stroke-width="2" fill="none"/>
  <!-- Glow lines -->
  <line x1="600" y1="300" x2="600" y2="292" stroke="#f1c40f" stroke-width="2"/>
  <line x1="616" y1="304" x2="622" y2="298" stroke="#f1c40f" stroke-width="2"/>
  <line x1="584" y1="304" x2="578" y2="298" stroke="#f1c40f" stroke-width="2"/>
  <!-- Pedestal -->
  <rect x="586" y="368" width="28" height="8" fill="#888"/>
  <rect x="576" y="376" width="48" height="6" fill="#666"/>
  <!-- Effect text -->
  <text x="600" y="404" font-family="monospace" font-size="11" text-anchor="middle" fill="#f1c40f">Invincibility — 8 seconds</text>
  <text x="600" y="420" font-family="monospace" font-size="11" text-anchor="middle" fill="#fff">Defeat enemies on contact</text>
  <text x="600" y="436" font-family="monospace" font-size="9" text-anchor="middle" fill="#888">Sprite flashes colour cycle while active</text>
  <text x="600" y="452" font-family="monospace" font-size="9" text-anchor="middle" fill="#888">Does NOT protect against lava / pit falls</text>

  <!-- Footer -->
  <text x="400" y="490" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">All items collected on contact. All items obey gravity after popping from their block.</text>
</svg>

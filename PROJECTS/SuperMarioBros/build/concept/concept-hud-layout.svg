<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-003 HUD Layout | UC-003, UC-005 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-003 — In-Game HUD Layout</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-003 UC-005</desc>

  <!-- Gameplay background stand-in -->
  <rect width="800" height="500" fill="#5c94fc"/>
  <rect x="0" y="440" width="800" height="60" fill="#4a9e4a"/>
  <text x="400" y="480" font-family="monospace" font-size="14" text-anchor="middle" fill="#1a5c1a">[gameplay area — behind HUD]</text>

  <!-- HUD bar -->
  <rect x="0" y="0" width="800" height="50" fill="#1a0000" opacity="0.92"/>
  <rect x="0" y="0" width="800" height="50" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- MARIO / Score -->
  <text x="30" y="18" font-family="monospace" font-size="13" fill="#ffffff">MARIO</text>
  <text x="30" y="40" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">000000</text>
  <rect x="10" y="4" width="140" height="42" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="155" y="14" font-family="monospace" font-size="10" fill="#e74c3c">← SCORE</text>

  <!-- Coin counter -->
  <circle cx="300" cy="18" r="9" fill="#f1c40f"/>
  <text x="315" y="23" font-family="monospace" font-size="15" fill="#ffffff">×00</text>
  <rect x="285" y="4" width="90" height="26" fill="none" stroke="#f1c40f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="285" y="42" font-family="monospace" font-size="10" fill="#f1c40f">COINS</text>

  <!-- World label -->
  <text x="380" y="18" font-family="monospace" font-size="13" fill="#ffffff">WORLD</text>
  <text x="390" y="40" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">1-1</text>
  <rect x="368" y="4" width="90" height="42" fill="none" stroke="#2ecc71" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="370" y="58" font-family="monospace" font-size="10" fill="#2ecc71">WORLD/LEVEL</text>

  <!-- TIME -->
  <text x="500" y="18" font-family="monospace" font-size="13" fill="#ffffff">TIME</text>
  <text x="505" y="40" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">400</text>
  <rect x="488" y="4" width="80" height="42" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="490" y="58" font-family="monospace" font-size="10" fill="#3498db">COUNTDOWN</text>

  <!-- Power-up icon slot -->
  <rect x="640" y="6" width="38" height="38" rx="3" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="659" y="30" font-family="monospace" font-size="16" text-anchor="middle" fill="#fff">M</text>
  <rect x="634" y="4" width="50" height="42" fill="none" stroke="#e67e22" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="636" y="58" font-family="monospace" font-size="10" fill="#e67e22">POWER-UP ICON</text>

  <!-- Lives display (top-right corner) -->
  <text x="700" y="18" font-family="monospace" font-size="13" fill="#ffffff">LIVES</text>
  <text x="714" y="40" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">×3</text>
  <rect x="690" y="4" width="90" height="42" fill="none" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="692" y="58" font-family="monospace" font-size="10" fill="#9b59b6">LIVES</text>

  <!-- Annotation legend -->
  <rect x="10" y="70" width="780" height="160" rx="4" fill="#00000099"/>
  <text x="30" y="92" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">HUD FIELD ANNOTATIONS</text>
  <line x1="20" y1="100" x2="780" y2="100" stroke="#444" stroke-width="1"/>
  <text x="30" y="118" font-family="monospace" font-size="12" fill="#e74c3c">■ SCORE — 6-digit zero-padded, increments on enemy kill / coin / time bonus</text>
  <text x="30" y="136" font-family="monospace" font-size="12" fill="#f1c40f">■ COINS — resets at 100; extra life awarded at 100 coins</text>
  <text x="30" y="154" font-family="monospace" font-size="12" fill="#2ecc71">■ WORLD — shows current world-level (e.g. 1-1, 2-3, 8-4)</text>
  <text x="30" y="172" font-family="monospace" font-size="12" fill="#3498db">■ TIME — counts down from 400; reaching 0 kills Mario (time-up)</text>
  <text x="30" y="190" font-family="monospace" font-size="12" fill="#e67e22">■ POWER-UP — icon: blank=small, mushroom=super, flower=fire, star=invincible</text>
  <text x="30" y="208" font-family="monospace" font-size="12" fill="#9b59b6">■ LIVES — remaining lives; reaching 0 triggers Game Over (CB-011)</text>

  <!-- Interaction note -->
  <text x="400" y="490" font-family="monospace" font-size="11" text-anchor="middle" fill="#1a3a8c">INTERACTION: HUD is read-only overlay. All fields update reactively from game state.</text>
</svg>

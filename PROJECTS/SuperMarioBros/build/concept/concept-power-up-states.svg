<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-008 Power-Up State Diagram | UC-005 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-008 — Player Power-Up State Diagram</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-005</desc>

  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="30" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">PLAYER POWER-UP STATE DIAGRAM</text>
  <line x1="40" y1="40" x2="760" y2="40" stroke="#444" stroke-width="1"/>

  <!-- Panel 1: Small Mario -->
  <rect x="30" y="60" width="160" height="280" rx="4" fill="#2c2c4e" stroke="#e74c3c" stroke-width="2"/>
  <text x="110" y="82" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">SMALL</text>
  <!-- Small Mario sprite schematic -->
  <rect x="93" y="120" width="34" height="40" rx="2" fill="#e74c3c"/>
  <circle cx="110" cy="113" r="16" fill="#e74c3c"/>
  <rect x="96" y="140" width="13" height="20" fill="#2980b9"/>
  <rect x="111" y="140" width="13" height="20" fill="#2980b9"/>
  <text x="110" y="180" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">1-tile height</text>
  <text x="110" y="196" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">compact sprite</text>
  <text x="110" y="222" font-family="monospace" font-size="10" text-anchor="middle" fill="#888">START STATE</text>
  <text x="110" y="252" font-family="monospace" font-size="10" text-anchor="middle" fill="#e74c3c">Damage →</text>
  <text x="110" y="268" font-family="monospace" font-size="10" text-anchor="middle" fill="#e74c3c">DEATH</text>
  <text x="110" y="292" font-family="monospace" font-size="9" text-anchor="middle" fill="#888">(life lost)</text>

  <!-- Panel 2: Super Mario -->
  <rect x="210" y="60" width="160" height="280" rx="4" fill="#2c2c4e" stroke="#27ae60" stroke-width="2"/>
  <text x="290" y="82" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">SUPER</text>
  <!-- Super Mario sprite schematic -->
  <rect x="273" y="100" width="34" height="58" rx="2" fill="#e74c3c"/>
  <circle cx="290" cy="92" r="18" fill="#e74c3c"/>
  <rect x="276" y="130" width="13" height="28" fill="#2980b9"/>
  <rect x="301" y="130" width="13" height="28" fill="#2980b9"/>
  <text x="290" y="175" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">2-tile height</text>
  <text x="290" y="191" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">taller sprite</text>
  <!-- Mushroom icon -->
  <text x="290" y="218" font-family="monospace" font-size="9" text-anchor="middle" fill="#27ae60">← Mushroom</text>
  <text x="290" y="252" font-family="monospace" font-size="10" text-anchor="middle" fill="#e74c3c">Damage →</text>
  <text x="290" y="268" font-family="monospace" font-size="10" text-anchor="middle" fill="#e74c3c">SMALL</text>
  <text x="290" y="292" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">(shrink, brief invincibility)</text>

  <!-- Panel 3: Fire Mario -->
  <rect x="390" y="60" width="160" height="280" rx="4" fill="#2c2c4e" stroke="#e67e22" stroke-width="2"/>
  <text x="470" y="82" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#e67e22">FIRE</text>
  <!-- Fire Mario sprite schematic -->
  <rect x="453" y="100" width="34" height="58" rx="2" fill="#ffffff"/>
  <circle cx="470" cy="92" r="18" fill="#e74c3c"/>
  <rect x="456" y="130" width="13" height="28" fill="#e67e22"/>
  <rect x="481" y="130" width="13" height="28" fill="#e67e22"/>
  <!-- Fire projectile -->
  <circle cx="504" cy="145" r="6" fill="#f39c12"/>
  <text x="514" y="148" font-family="monospace" font-size="8" fill="#f39c12">●</text>
  <text x="470" y="175" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">white overalls</text>
  <text x="470" y="191" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">throws fireballs</text>
  <!-- FireFlower icon -->
  <text x="470" y="218" font-family="monospace" font-size="9" text-anchor="middle" fill="#e67e22">← FireFlower</text>
  <text x="470" y="252" font-family="monospace" font-size="10" text-anchor="middle" fill="#e74c3c">Damage →</text>
  <text x="470" y="268" font-family="monospace" font-size="10" text-anchor="middle" fill="#e74c3c">SMALL</text>

  <!-- Panel 4: Invincible Mario -->
  <rect x="570" y="60" width="160" height="280" rx="4" fill="#2c2c4e" stroke="#f1c40f" stroke-width="2" stroke-dasharray="6 2"/>
  <text x="650" y="82" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#f1c40f">INVINCIBLE</text>
  <!-- Invincible Mario sprite schematic with flashing overlay -->
  <rect x="633" y="100" width="34" height="58" rx="2" fill="#e74c3c" opacity="0.7"/>
  <rect x="633" y="100" width="34" height="58" rx="2" fill="#f1c40f" opacity="0.3"/>
  <circle cx="650" cy="92" r="18" fill="#e74c3c" opacity="0.7"/>
  <circle cx="650" cy="92" r="18" fill="#ffffff" opacity="0.2"/>
  <rect x="636" y="130" width="13" height="28" fill="#2980b9" opacity="0.7"/>
  <rect x="661" y="130" width="13" height="28" fill="#2980b9" opacity="0.7"/>
  <!-- Flash lines -->
  <line x1="620" y1="88" x2="610" y2="78" stroke="#f1c40f" stroke-width="2"/>
  <line x1="680" y1="88" x2="690" y2="78" stroke="#f1c40f" stroke-width="2"/>
  <line x1="680" y1="130" x2="692" y2="122" stroke="#f1c40f" stroke-width="2"/>
  <text x="650" y="175" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">flashing colour</text>
  <text x="650" y="191" font-family="monospace" font-size="9" text-anchor="middle" fill="#aaa">cycle overlay</text>
  <!-- Star icon -->
  <text x="650" y="218" font-family="monospace" font-size="9" text-anchor="middle" fill="#f1c40f">← Star (8 s)</text>
  <text x="650" y="252" font-family="monospace" font-size="10" text-anchor="middle" fill="#888">Enemies</text>
  <text x="650" y="268" font-family="monospace" font-size="10" text-anchor="middle" fill="#888">defeated on</text>
  <text x="650" y="284" font-family="monospace" font-size="10" text-anchor="middle" fill="#888">contact</text>

  <!-- Transition arrows -->
  <!-- Small → Super -->
  <line x1="192" y1="190" x2="208" y2="190" stroke="#27ae60" stroke-width="2"/>
  <polygon points="208,186 216,190 208,194" fill="#27ae60"/>
  <text x="200" y="184" font-family="monospace" font-size="8" text-anchor="middle" fill="#27ae60">Mush</text>
  <!-- Super → Fire -->
  <line x1="372" y1="190" x2="388" y2="190" stroke="#e67e22" stroke-width="2"/>
  <polygon points="388,186 396,190 388,194" fill="#e67e22"/>
  <text x="380" y="184" font-family="monospace" font-size="8" text-anchor="middle" fill="#e67e22">Flower</text>
  <!-- Any state → Invincible -->
  <line x1="552" y1="190" x2="568" y2="190" stroke="#f1c40f" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="568,186 576,190 568,194" fill="#f1c40f"/>
  <text x="560" y="184" font-family="monospace" font-size="8" text-anchor="middle" fill="#f1c40f">Star</text>

  <!-- Legend -->
  <rect x="30" y="360" width="740" height="120" rx="4" fill="#11112a" stroke="#333" stroke-width="1"/>
  <text x="50" y="382" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">STATE TRANSITION RULES</text>
  <text x="50" y="402" font-family="monospace" font-size="11" fill="#27ae60">Small + Mushroom → Super    |  Super + FireFlower → Fire    |  Any + Star → Invincible (8 s)</text>
  <text x="50" y="420" font-family="monospace" font-size="11" fill="#e74c3c">Fire + damage → Small    |  Super + damage → Small (brief blink)    |  Small + damage → DEATH (life –1)</text>
  <text x="50" y="438" font-family="monospace" font-size="11" fill="#f1c40f">Invincible timer expires → returns to previous state (Fire or Super or Small)</text>
  <text x="50" y="456" font-family="monospace" font-size="11" fill="#888">Invincible Mario defeats all enemies on contact. No damage taken during invincible window.</text>
</svg>

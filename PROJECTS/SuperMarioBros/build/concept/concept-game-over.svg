<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-011 Game Over Screen | UC-011 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-011 — Game Over Screen</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-011</desc>

  <!-- Solid black background -->
  <rect width="800" height="500" fill="#000000"/>

  <!-- Region annotation -->
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="20" y="28" font-family="monospace" font-size="11" fill="#444">REGION: BACKGROUND — solid black, no animated content</text>

  <!-- GAME OVER text -->
  <text x="400" y="200" font-family="monospace" font-size="52" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="6">GAME OVER</text>
  <text x="400" y="226" font-family="monospace" font-size="11" text-anchor="middle" fill="#555">[large white pixel font, centred vertically]</text>

  <!-- Score display -->
  <text x="400" y="280" font-family="monospace" font-size="18" text-anchor="middle" fill="#aaaaaa">SCORE</text>
  <text x="400" y="316" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle" fill="#f1c40f">024800</text>
  <text x="400" y="338" font-family="monospace" font-size="11" text-anchor="middle" fill="#555">[player's final score — static display]</text>

  <!-- PRESS START blink prompt -->
  <text x="400" y="400" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff" opacity="0.9">PRESS START</text>
  <text x="400" y="422" font-family="monospace" font-size="11" text-anchor="middle" fill="#555">[text blinks at ~1 Hz — blinkInterval in game state]</text>

  <!-- Audio note -->
  <rect x="220" y="438" width="360" height="30" rx="4" fill="#111"/>
  <text x="400" y="458" font-family="monospace" font-size="11" text-anchor="middle" fill="#888">♪ Short descending sting plays on screen entry</text>

  <!-- Timer note -->
  <text x="400" y="488" font-family="monospace" font-size="10" text-anchor="middle" fill="#555">Auto-transitions to Main Menu (CB-002) after 5 s, or immediately on Start press. Score resets to 000000.</text>

  <!-- Interaction annotation box -->
  <rect x="30" y="60" width="740" height="60" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="50" y="82" font-family="monospace" font-size="12" fill="#e74c3c">TRIGGER: Player loses final life (lives = 0 after death)</text>
  <text x="50" y="100" font-family="monospace" font-size="12" fill="#888">INTERACTION: Press Start → CB-002 Main Menu  |  Wait 5 s → CB-002 Main Menu  |  No save state</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-007 Gameplay Castle Level | UC-004, UC-006, UC-008, UC-009 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-007 — Gameplay Castle Level</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-004 UC-006 UC-008 UC-009</desc>

  <!-- Dark castle background -->
  <rect width="800" height="500" fill="#1c1c2e"/>

  <!-- HUD -->
  <rect x="0" y="0" width="800" height="42" fill="#1a0000"/>
  <text x="30" y="16" font-family="monospace" font-size="11" fill="#fff">MARIO</text>
  <text x="30" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">008600</text>
  <circle cx="310" cy="16" r="7" fill="#f1c40f"/>
  <text x="322" y="21" font-family="monospace" font-size="13" fill="#fff">×24</text>
  <text x="390" y="16" font-family="monospace" font-size="11" fill="#fff">WORLD</text>
  <text x="398" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">1-4</text>
  <text x="510" y="16" font-family="monospace" font-size="11" fill="#fff">TIME</text>
  <text x="512" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">198</text>

  <!-- Castle brick walls -->
  <!-- Floor -->
  <rect x="0" y="420" width="800" height="80" fill="#3c3c5e"/>
  <g stroke="#2a2a4a" stroke-width="1">
    <line x1="40" y1="420" x2="40" y2="500"/>
    <line x1="80" y1="420" x2="80" y2="500"/>
    <line x1="120" y1="420" x2="120" y2="500"/>
    <line x1="160" y1="420" x2="160" y2="500"/>
    <line x1="200" y1="420" x2="200" y2="500"/>
    <line x1="240" y1="420" x2="240" y2="500"/>
    <line x1="280" y1="420" x2="280" y2="500"/>
    <line x1="320" y1="420" x2="320" y2="500"/>
    <line x1="360" y1="420" x2="360" y2="500"/>
    <line x1="400" y1="420" x2="400" y2="500"/>
    <line x1="440" y1="420" x2="440" y2="500"/>
    <line x1="480" y1="420" x2="480" y2="500"/>
    <line x1="520" y1="420" x2="520" y2="500"/>
    <line x1="560" y1="420" x2="560" y2="500"/>
    <line x1="600" y1="420" x2="600" y2="500"/>
    <line x1="640" y1="420" x2="640" y2="500"/>
    <line x1="680" y1="420" x2="680" y2="500"/>
    <line x1="720" y1="420" x2="720" y2="500"/>
    <line x1="760" y1="420" x2="760" y2="500"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="460" x2="800" y2="460"/>
  </g>
  <text x="400" y="418" font-family="monospace" font-size="9" text-anchor="middle" fill="#6688aa">REGION: CASTLE FLOOR — dark brick tiles</text>

  <!-- Lava pit -->
  <rect x="200" y="420" width="160" height="80" fill="#c0392b"/>
  <rect x="200" y="420" width="160" height="12" fill="#e74c3c" opacity="0.7"/>
  <!-- Flame sprites (animated in-game) -->
  <polygon points="240,420 248,395 256,420" fill="#f39c12" opacity="0.9"/>
  <polygon points="260,420 270,388 280,420" fill="#e67e22" opacity="0.9"/>
  <polygon points="300,420 312,392 324,420" fill="#f39c12" opacity="0.9"/>
  <text x="280" y="384" font-family="monospace" font-size="9" text-anchor="middle" fill="#e74c3c">LAVA PIT</text>
  <text x="280" y="374" font-family="monospace" font-size="8" text-anchor="middle" fill="#e67e22">[instant death on contact]</text>

  <!-- Moving platform (log bridge over lava) -->
  <rect x="195" y="360" width="80" height="18" rx="3" fill="#8B4513" stroke="#5c2e0a" stroke-width="2"/>
  <line x1="215" y1="360" x2="215" y2="378" stroke="#5c2e0a" stroke-width="1"/>
  <line x1="235" y1="360" x2="235" y2="378" stroke="#5c2e0a" stroke-width="1"/>
  <line x1="255" y1="360" x2="255" y2="378" stroke="#5c2e0a" stroke-width="1"/>
  <!-- Movement indicator -->
  <text x="235" y="354" font-family="monospace" font-size="9" text-anchor="middle" fill="#8B4513">← MOVING PLATFORM →</text>

  <!-- Fire-bar obstacle -->
  <circle cx="490" cy="330" r="8" fill="#3c3c5e" stroke="#6688aa" stroke-width="2"/>
  <circle cx="510" cy="310" r="7" fill="#e74c3c"/>
  <circle cx="530" cy="292" r="6" fill="#e67e22"/>
  <circle cx="548" cy="276" r="5" fill="#f39c12"/>
  <circle cx="564" cy="262" r="4" fill="#f1c40f"/>
  <text x="490" y="350" font-family="monospace" font-size="9" text-anchor="middle" fill="#e74c3c">FIRE-BAR</text>
  <text x="490" y="362" font-family="monospace" font-size="8" text-anchor="middle" fill="#e67e22">[rotates around pivot]</text>

  <!-- Shelltron enemy -->
  <rect x="600" y="392" width="34" height="26" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <circle cx="607" cy="398" r="5" fill="#fff"/>
  <circle cx="621" cy="398" r="5" fill="#fff"/>
  <circle cx="607" cy="399" r="3" fill="#000"/>
  <circle cx="621" cy="399" r="3" fill="#000"/>
  <rect x="602" y="406" width="10" height="10" rx="2" fill="#2ecc71"/>
  <rect x="622" y="406" width="10" height="10" rx="2" fill="#2ecc71"/>
  <text x="617" y="436" font-family="monospace" font-size="9" text-anchor="middle" fill="#2ecc71">SHELLTRON</text>
  <text x="617" y="448" font-family="monospace" font-size="8" text-anchor="middle" fill="#888">[stomp→shell slide mode]</text>

  <!-- Bowser placeholder at end -->
  <rect x="710" y="340" width="60" height="78" rx="4" fill="#8B4513" stroke="#5c2e0a" stroke-width="2"/>
  <circle cx="740" cy="332" r="18" fill="#c0392b"/>
  <text x="740" y="382" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#f1c40f">BOWSER</text>
  <text x="740" y="394" font-family="monospace" font-size="8" text-anchor="middle" fill="#e74c3c">[placeholder sprite]</text>

  <!-- Axe trigger -->
  <rect x="774" y="310" width="14" height="30" rx="2" fill="#888" stroke="#666" stroke-width="1"/>
  <polygon points="774,310 788,310 788,316 781,330 774,316" fill="#c0c0c0" stroke="#888"/>
  <text x="781" y="304" font-family="monospace" font-size="9" text-anchor="middle" fill="#fff">AXE</text>
  <text x="781" y="294" font-family="monospace" font-size="8" text-anchor="middle" fill="#f1c40f">[touch → bridge falls]</text>

  <!-- Mario sprite -->
  <rect x="100" y="388" width="24" height="30" rx="2" fill="#e74c3c"/>
  <circle cx="112" cy="383" r="12" fill="#e74c3c"/>
  <rect x="103" y="398" width="10" height="16" fill="#2980b9"/>
  <rect x="117" y="398" width="10" height="16" fill="#2980b9"/>
  <text x="112" y="436" font-family="monospace" font-size="9" text-anchor="middle" fill="#e74c3c">MARIO</text>

  <!-- Interaction note -->
  <rect x="10" y="460" width="780" height="36" rx="2" fill="#00000099"/>
  <text x="20" y="473" font-family="monospace" font-size="10" fill="#ffffff">Lava = instant death | Shelltron stomp → shell-slide mode (dangerous if touched from side)</text>
  <text x="20" y="487" font-family="monospace" font-size="10" fill="#f1c40f">Touch AXE → Bowser defeated → bridge falls → Level Complete flow (CB-010)</text>
</svg>

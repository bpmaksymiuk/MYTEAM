<?xml version="1.0" encoding="UTF-8"?>
<!-- CB-006 Gameplay Sky Level | UC-004, UC-007, UC-008 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>CB-006 — Gameplay Sky / Cloud Level</title>
  <desc>Stage 3 Concept Storyboard | Super Mario Bros | UC-004 UC-007 UC-008</desc>

  <!-- Sky background -->
  <rect width="800" height="500" fill="#87ceeb"/>

  <!-- HUD -->
  <rect x="0" y="0" width="800" height="42" fill="#1a0000"/>
  <text x="30" y="16" font-family="monospace" font-size="11" fill="#fff">MARIO</text>
  <text x="30" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">003200</text>
  <circle cx="310" cy="16" r="7" fill="#f1c40f"/>
  <text x="322" y="21" font-family="monospace" font-size="13" fill="#fff">×18</text>
  <text x="390" y="16" font-family="monospace" font-size="11" fill="#fff">WORLD</text>
  <text x="398" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">3-3</text>
  <text x="510" y="16" font-family="monospace" font-size="11" fill="#fff">TIME</text>
  <text x="512" y="34" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">312</text>

  <!-- Distant background clouds -->
  <ellipse cx="100" cy="160" rx="80" ry="30" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="700" cy="200" rx="90" ry="35" fill="#ffffff" opacity="0.5"/>
  <text x="20" y="155" font-family="monospace" font-size="10" fill="#1a3a8c">REGION: DISTANT BG CLOUDS — lower opacity</text>

  <!-- Cloud platform 1 (leftmost) -->
  <ellipse cx="100" cy="340" rx="90" ry="35" fill="#ffffff"/>
  <ellipse cx="70" cy="326" rx="50" ry="28" fill="#ffffff"/>
  <ellipse cx="130" cy="322" rx="55" ry="30" fill="#ffffff"/>
  <!-- flat walkable top line -->
  <rect x="20" y="318" width="160" height="4" fill="#e8e8e8"/>
  <text x="100" y="310" font-family="monospace" font-size="10" text-anchor="middle" fill="#aaa">CLOUD PLATFORM 1</text>

  <!-- Cloud platform 2 (centre) -->
  <ellipse cx="380" cy="290" rx="100" ry="38" fill="#ffffff"/>
  <ellipse cx="340" cy="274" rx="60" ry="32" fill="#ffffff"/>
  <ellipse cx="420" cy="270" rx="65" ry="34" fill="#ffffff"/>
  <rect x="290" y="265" width="180" height="4" fill="#e8e8e8"/>
  <text x="380" y="256" font-family="monospace" font-size="10" text-anchor="middle" fill="#aaa">CLOUD PLATFORM 2</text>

  <!-- Cloud platform 3 (right) -->
  <ellipse cx="660" cy="320" rx="95" ry="36" fill="#ffffff"/>
  <ellipse cx="625" cy="305" rx="55" ry="28" fill="#ffffff"/>
  <ellipse cx="695" cy="302" rx="60" ry="30" fill="#ffffff"/>
  <rect x="575" y="298" width="170" height="4" fill="#e8e8e8"/>
  <text x="660" y="290" font-family="monospace" font-size="10" text-anchor="middle" fill="#aaa">CLOUD PLATFORM 3</text>

  <!-- Coin rows on platforms -->
  <g fill="#f1c40f" stroke="#d4ac0d" stroke-width="1">
    <!-- Platform 1 coins -->
    <circle cx="50" cy="305" r="8"/>
    <circle cx="72" cy="305" r="8"/>
    <circle cx="94" cy="305" r="8"/>
    <circle cx="116" cy="305" r="8"/>
    <circle cx="138" cy="305" r="8"/>
    <!-- Platform 2 coins -->
    <circle cx="310" cy="252" r="8"/>
    <circle cx="335" cy="252" r="8"/>
    <circle cx="360" cy="252" r="8"/>
    <circle cx="385" cy="252" r="8"/>
    <circle cx="410" cy="252" r="8"/>
    <circle cx="435" cy="252" r="8"/>
    <!-- Platform 3 coins -->
    <circle cx="596" cy="285" r="8"/>
    <circle cx="620" cy="285" r="8"/>
    <circle cx="644" cy="285" r="8"/>
    <circle cx="668" cy="285" r="8"/>
  </g>
  <text x="400" y="230" font-family="monospace" font-size="10" text-anchor="middle" fill="#f1c40f">REGION: COIN ROWS — dense packing atop cloud platforms</text>

  <!-- Mario (super/large) on platform 2 -->
  <rect x="300" y="220" width="24" height="42" rx="2" fill="#e74c3c"/>
  <circle cx="312" cy="212" r="14" fill="#e74c3c"/>
  <rect x="302" y="238" width="10" height="22" fill="#2980b9"/>
  <rect x="316" y="238" width="10" height="22" fill="#2980b9"/>
  <text x="312" y="272" font-family="monospace" font-size="9" text-anchor="middle" fill="#e74c3c">MARIO (super)</text>

  <!-- Fall-off death indicator -->
  <line x1="180" y1="320" x2="230" y2="420" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="210" y="395" font-family="monospace" font-size="10" fill="#e74c3c">GAP → death</text>
  <text x="20" y="450" font-family="monospace" font-size="10" fill="#1a3a8c">NOTE: No ground level. Falling off platform edge = instant death. No enemies in sky bonus rooms.</text>

  <!-- End pipe -->
  <rect x="758" y="260" width="42" height="60" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <rect x="750" y="252" width="58" height="16" rx="3" fill="#2ecc71" stroke="#1e8449" stroke-width="2"/>
  <text x="779" y="250" font-family="monospace" font-size="9" text-anchor="middle" fill="#1e8449">EXIT</text>

  <!-- Interaction note -->
  <rect x="10" y="465" width="780" height="32" rx="2" fill="#00000077"/>
  <text x="20" y="478" font-family="monospace" font-size="10" fill="#ffffff">INTERACTION: Same controls as CB-004. Falling off platform edge → instant death. Touch exit pipe → advance level.</text>
  <text x="20" y="492" font-family="monospace" font-size="10" fill="#f1c40f">Coins collected automatically on contact. Dense coin layout rewards exploration and jump skill.</text>
</svg>

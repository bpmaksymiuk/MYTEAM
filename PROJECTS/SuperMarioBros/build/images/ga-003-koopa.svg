<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 32" width="128" height="32">
  <!-- Koopa spritesheet: 4 frames × 32×32 — walk1, walk2, shell-idle, shell-sliding -->
  <!-- Frame 0: walk1 -->
  <g transform="translate(0,0)">
    <!-- shell (green body) -->
    <rect x="6" y="10" width="20" height="14" fill="#228b22"/>
    <rect x="8" y="8" width="16" height="4" fill="#228b22"/>
    <!-- shell pattern -->
    <rect x="8" y="12" width="16" height="2" fill="#1a6b1a"/>
    <rect x="12" y="14" width="8" height="8" fill="#1a6b1a"/>
    <!-- neck -->
    <rect x="10" y="6" width="12" height="4" fill="#adff2f"/>
    <!-- head -->
    <rect x="8" y="2" width="16" height="8" fill="#adff2f"/>
    <!-- eyes -->
    <rect x="10" y="4" width="4" height="4" fill="#ffffff"/>
    <rect x="18" y="4" width="4" height="4" fill="#ffffff"/>
    <rect x="11" y="5" width="2" height="2" fill="#000"/>
    <rect x="19" y="5" width="2" height="2" fill="#000"/>
    <!-- feet (left forward) -->
    <rect x="4" y="24" width="8" height="8" fill="#adff2f"/>
    <rect x="20" y="22" width="8" height="10" fill="#adff2f"/>
    <!-- shell highlight -->
    <rect x="8" y="10" width="14" height="2" fill="#44cc44"/>
  </g>
  <!-- Frame 1: walk2 (right foot forward) -->
  <g transform="translate(32,0)">
    <rect x="6" y="10" width="20" height="14" fill="#228b22"/>
    <rect x="8" y="8" width="16" height="4" fill="#228b22"/>
    <rect x="8" y="12" width="16" height="2" fill="#1a6b1a"/>
    <rect x="12" y="14" width="8" height="8" fill="#1a6b1a"/>
    <rect x="10" y="6" width="12" height="4" fill="#adff2f"/>
    <rect x="8" y="2" width="16" height="8" fill="#adff2f"/>
    <rect x="10" y="4" width="4" height="4" fill="#ffffff"/>
    <rect x="18" y="4" width="4" height="4" fill="#ffffff"/>
    <rect x="11" y="5" width="2" height="2" fill="#000"/>
    <rect x="19" y="5" width="2" height="2" fill="#000"/>
    <!-- feet swapped -->
    <rect x="20" y="24" width="8" height="8" fill="#adff2f"/>
    <rect x="4" y="22" width="8" height="10" fill="#adff2f"/>
    <rect x="8" y="10" width="14" height="2" fill="#44cc44"/>
  </g>
  <!-- Frame 2: shell-idle (tucked inside shell) -->
  <g transform="translate(64,0)">
    <!-- rounded green shell -->
    <rect x="4" y="10" width="24" height="18" fill="#228b22"/>
    <rect x="6" y="8" width="20" height="4" fill="#228b22"/>
    <rect x="6" y="26" width="20" height="4" fill="#228b22"/>
    <!-- shell ridge lines -->
    <rect x="6" y="14" width="20" height="2" fill="#1a6b1a"/>
    <rect x="6" y="20" width="20" height="2" fill="#1a6b1a"/>
    <rect x="14" y="8" width="2" height="20" fill="#1a6b1a"/>
    <!-- highlight -->
    <rect x="6" y="10" width="18" height="2" fill="#44cc44"/>
  </g>
  <!-- Frame 3: shell-sliding (spinning - slightly rotated look) -->
  <g transform="translate(96,0)">
    <rect x="4" y="10" width="24" height="18" fill="#228b22"/>
    <rect x="6" y="8" width="20" height="4" fill="#228b22"/>
    <rect x="6" y="26" width="20" height="4" fill="#228b22"/>
    <!-- spinning ridge lines (diagonal) -->
    <rect x="6" y="12" width="20" height="2" fill="#1a6b1a"/>
    <rect x="6" y="18" width="20" height="2" fill="#1a6b1a"/>
    <rect x="6" y="24" width="20" height="2" fill="#1a6b1a"/>
    <rect x="10" y="8" width="2" height="20" fill="#1a6b1a"/>
    <rect x="18" y="8" width="2" height="20" fill="#1a6b1a"/>
    <rect x="6" y="10" width="18" height="2" fill="#44cc44"/>
    <!-- motion blur lines -->
    <rect x="0" y="18" width="4" height="2" fill="#44cc44" opacity="0.5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" width="160" height="32">
  <!-- Player spritesheet: 5 frames × 32×32 — idle, run1, run2, jump, dead -->
  <!-- Frame 0: idle (facing right) -->
  <g transform="translate(0,0)">
    <!-- hat -->
    <rect x="8" y="2" width="16" height="6" fill="#cc2200"/>
    <rect x="6" y="6" width="20" height="4" fill="#cc2200"/>
    <!-- face -->
    <rect x="8" y="10" width="16" height="10" fill="#f4a460"/>
    <!-- eyes -->
    <rect x="10" y="12" width="3" height="3" fill="#000"/>
    <rect x="18" y="12" width="3" height="3" fill="#000"/>
    <!-- nose -->
    <rect x="14" y="15" width="5" height="3" fill="#c86422"/>
    <!-- moustache -->
    <rect x="9" y="18" width="13" height="2" fill="#4a2000"/>
    <!-- body (overalls blue) -->
    <rect x="8" y="20" width="16" height="8" fill="#2244cc"/>
    <!-- legs -->
    <rect x="8" y="26" width="6" height="6" fill="#cc2200"/>
    <rect x="18" y="26" width="6" height="6" fill="#cc2200"/>
    <!-- shoes -->
    <rect x="6" y="29" width="8" height="3" fill="#4a2000"/>
    <rect x="18" y="29" width="8" height="3" fill="#4a2000"/>
    <!-- arms -->
    <rect x="2" y="20" width="6" height="4" fill="#f4a460"/>
    <rect x="24" y="20" width="6" height="4" fill="#f4a460"/>
    <!-- hands -->
    <rect x="0" y="22" width="4" height="4" fill="#f4a460"/>
    <rect x="28" y="22" width="4" height="4" fill="#f4a460"/>
  </g>
  <!-- Frame 1: run1 (left leg forward) -->
  <g transform="translate(32,0)">
    <rect x="8" y="2" width="16" height="6" fill="#cc2200"/>
    <rect x="6" y="6" width="20" height="4" fill="#cc2200"/>
    <rect x="8" y="10" width="16" height="10" fill="#f4a460"/>
    <rect x="10" y="12" width="3" height="3" fill="#000"/>
    <rect x="18" y="12" width="3" height="3" fill="#000"/>
    <rect x="14" y="15" width="5" height="3" fill="#c86422"/>
    <rect x="9" y="18" width="13" height="2" fill="#4a2000"/>
    <rect x="8" y="20" width="16" height="8" fill="#2244cc"/>
    <!-- legs spread -->
    <rect x="6" y="26" width="6" height="6" fill="#cc2200"/>
    <rect x="20" y="24" width="6" height="8" fill="#cc2200"/>
    <rect x="4" y="29" width="8" height="3" fill="#4a2000"/>
    <rect x="20" y="29" width="8" height="3" fill="#4a2000"/>
    <!-- arms swinging -->
    <rect x="0" y="18" width="6" height="4" fill="#f4a460"/>
    <rect x="26" y="22" width="6" height="4" fill="#f4a460"/>
  </g>
  <!-- Frame 2: run2 (right leg forward) -->
  <g transform="translate(64,0)">
    <rect x="8" y="2" width="16" height="6" fill="#cc2200"/>
    <rect x="6" y="6" width="20" height="4" fill="#cc2200"/>
    <rect x="8" y="10" width="16" height="10" fill="#f4a460"/>
    <rect x="10" y="12" width="3" height="3" fill="#000"/>
    <rect x="18" y="12" width="3" height="3" fill="#000"/>
    <rect x="14" y="15" width="5" height="3" fill="#c86422"/>
    <rect x="9" y="18" width="13" height="2" fill="#4a2000"/>
    <rect x="8" y="20" width="16" height="8" fill="#2244cc"/>
    <rect x="6" y="24" width="6" height="8" fill="#cc2200"/>
    <rect x="20" y="26" width="6" height="6" fill="#cc2200"/>
    <rect x="4" y="29" width="8" height="3" fill="#4a2000"/>
    <rect x="20" y="29" width="8" height="3" fill="#4a2000"/>
    <rect x="26" y="18" width="6" height="4" fill="#f4a460"/>
    <rect x="0" y="22" width="6" height="4" fill="#f4a460"/>
  </g>
  <!-- Frame 3: jump (arms up, legs tucked) -->
  <g transform="translate(96,0)">
    <rect x="8" y="2" width="16" height="6" fill="#cc2200"/>
    <rect x="6" y="6" width="20" height="4" fill="#cc2200"/>
    <rect x="8" y="10" width="16" height="10" fill="#f4a460"/>
    <rect x="10" y="12" width="3" height="3" fill="#000"/>
    <rect x="18" y="12" width="3" height="3" fill="#000"/>
    <rect x="14" y="15" width="5" height="3" fill="#c86422"/>
    <rect x="9" y="18" width="13" height="2" fill="#4a2000"/>
    <rect x="8" y="20" width="16" height="8" fill="#2244cc"/>
    <!-- legs tucked up -->
    <rect x="8" y="25" width="6" height="5" fill="#cc2200"/>
    <rect x="18" y="25" width="6" height="5" fill="#cc2200"/>
    <rect x="6" y="28" width="8" height="3" fill="#4a2000"/>
    <rect x="18" y="28" width="8" height="3" fill="#4a2000"/>
    <!-- arms up -->
    <rect x="0" y="14" width="6" height="4" fill="#f4a460"/>
    <rect x="26" y="14" width="6" height="4" fill="#f4a460"/>
  </g>
  <!-- Frame 4: dead (flat, X eyes) -->
  <g transform="translate(128,0)">
    <rect x="8" y="2" width="16" height="6" fill="#cc2200"/>
    <rect x="6" y="6" width="20" height="4" fill="#cc2200"/>
    <rect x="8" y="10" width="16" height="10" fill="#f4a460"/>
    <!-- X eyes -->
    <rect x="10" y="12" width="2" height="2" fill="#000"/><rect x="13" y="12" width="2" height="2" fill="#000"/>
    <rect x="11" y="13" width="2" height="2" fill="#000"/><rect x="12" y="11" width="2" height="2" fill="#000"/>
    <rect x="18" y="12" width="2" height="2" fill="#000"/><rect x="21" y="12" width="2" height="2" fill="#000"/>
    <rect x="19" y="13" width="2" height="2" fill="#000"/><rect x="20" y="11" width="2" height="2" fill="#000"/>
    <rect x="9" y="18" width="13" height="2" fill="#4a2000"/>
    <rect x="8" y="20" width="16" height="8" fill="#2244cc"/>
    <rect x="8" y="26" width="6" height="6" fill="#cc2200"/>
    <rect x="18" y="26" width="6" height="6" fill="#cc2200"/>
    <rect x="6" y="29" width="8" height="3" fill="#4a2000"/>
    <rect x="18" y="29" width="8" height="3" fill="#4a2000"/>
    <!-- arms hanging -->
    <rect x="2" y="22" width="6" height="3" fill="#f4a460"/>
    <rect x="24" y="22" width="6" height="3" fill="#f4a460"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32" width="96" height="32">
  <!-- Goomba spritesheet: 3 frames × 32×32 — walk1, walk2, defeated -->
  <!-- Frame 0: walk1 -->
  <g transform="translate(0,0)">
    <!-- head/body (round brown mushroom shape) -->
    <rect x="6" y="8" width="20" height="16" fill="#8b4513"/>
    <rect x="4" y="12" width="24" height="10" fill="#8b4513"/>
    <rect x="8" y="6" width="16" height="4" fill="#8b4513"/>
    <!-- eyebrows (angry) -->
    <rect x="6" y="10" width="8" height="3" fill="#4a1f00"/>
    <rect x="18" y="10" width="8" height="3" fill="#4a1f00"/>
    <!-- eyes white -->
    <rect x="7" y="13" width="7" height="6" fill="#ffffff"/>
    <rect x="18" y="13" width="7" height="6" fill="#ffffff"/>
    <!-- pupils (looking left/angry) -->
    <rect x="8" y="14" width="4" height="4" fill="#000"/>
    <rect x="19" y="14" width="4" height="4" fill="#000"/>
    <!-- tooth -->
    <rect x="12" y="22" width="4" height="3" fill="#ffffff"/>
    <rect x="16" y="22" width="4" height="3" fill="#ffffff"/>
    <!-- feet (left forward) -->
    <rect x="4" y="26" width="10" height="6" fill="#4a1f00"/>
    <rect x="20" y="24" width="10" height="8" fill="#4a1f00"/>
  </g>
  <!-- Frame 1: walk2 (right foot forward) -->
  <g transform="translate(32,0)">
    <rect x="6" y="8" width="20" height="16" fill="#8b4513"/>
    <rect x="4" y="12" width="24" height="10" fill="#8b4513"/>
    <rect x="8" y="6" width="16" height="4" fill="#8b4513"/>
    <rect x="6" y="10" width="8" height="3" fill="#4a1f00"/>
    <rect x="18" y="10" width="8" height="3" fill="#4a1f00"/>
    <rect x="7" y="13" width="7" height="6" fill="#ffffff"/>
    <rect x="18" y="13" width="7" height="6" fill="#ffffff"/>
    <rect x="8" y="14" width="4" height="4" fill="#000"/>
    <rect x="19" y="14" width="4" height="4" fill="#000"/>
    <rect x="12" y="22" width="4" height="3" fill="#ffffff"/>
    <rect x="16" y="22" width="4" height="3" fill="#ffffff"/>
    <!-- feet (right forward) -->
    <rect x="18" y="26" width="10" height="6" fill="#4a1f00"/>
    <rect x="4" y="24" width="10" height="8" fill="#4a1f00"/>
  </g>
  <!-- Frame 2: defeated (flat squished) -->
  <g transform="translate(64,0)">
    <!-- squished flat body -->
    <rect x="2" y="22" width="28" height="8" fill="#8b4513"/>
    <!-- eyes as X marks -->
    <rect x="5" y="22" width="2" height="2" fill="#fff"/><rect x="8" y="22" width="2" height="2" fill="#fff"/>
    <rect x="6" y="23" width="2" height="2" fill="#fff"/><rect x="7" y="21" width="2" height="2" fill="#fff"/>
    <rect x="21" y="22" width="2" height="2" fill="#fff"/><rect x="24" y="22" width="2" height="2" fill="#fff"/>
    <rect x="22" y="23" width="2" height="2" fill="#fff"/><rect x="23" y="21" width="2" height="2" fill="#fff"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 32" width="288" height="32">
  <!-- Items spritesheet: 9 items × 32×32 -->
  <!-- Item 0: coin (yellow circle) -->
  <g transform="translate(0,0)">
    <rect x="8" y="4" width="16" height="24" fill="#f0c000" rx="8" ry="12"/>
    <rect x="10" y="6" width="12" height="20" fill="#ffd800" rx="6"/>
    <rect x="6" y="10" width="20" height="12" fill="#f0c000"/>
    <rect x="12" y="4" width="8" height="4" fill="#ffd800"/>
    <rect x="12" y="24" width="8" height="4" fill="#ffd800"/>
    <!-- coin shine -->
    <rect x="11" y="8" width="4" height="8" fill="#ffe866"/>
  </g>
  <!-- Item 1: mushroom (red with white dots) -->
  <g transform="translate(32,0)">
    <!-- cap -->
    <rect x="4" y="2" width="24" height="18" fill="#cc2200" rx="4"/>
    <rect x="2" y="10" width="28" height="10" fill="#cc2200"/>
    <!-- white dots -->
    <rect x="6" y="6" width="6" height="6" fill="#ffffff" rx="2"/>
    <rect x="20" y="6" width="6" height="6" fill="#ffffff" rx="2"/>
    <rect x="13" y="12" width="6" height="6" fill="#ffffff" rx="2"/>
    <!-- stem -->
    <rect x="8" y="20" width="16" height="10" fill="#f4e8c8"/>
    <!-- face -->
    <rect x="10" y="22" width="4" height="4" fill="#000"/>
    <rect x="18" y="22" width="4" height="4" fill="#000"/>
  </g>
  <!-- Item 2: fire-flower (orange/red petals) -->
  <g transform="translate(64,0)">
    <!-- stem -->
    <rect x="15" y="20" width="3" height="12" fill="#2a7a00"/>
    <rect x="10" y="24" width="12" height="3" fill="#2a7a00"/>
    <!-- petals -->
    <rect x="11" y="4" width="10" height="10" fill="#ff6600"/>
    <rect x="5" y="10" width="10" height="10" fill="#ff6600"/>
    <rect x="17" y="10" width="10" height="10" fill="#ff6600"/>
    <rect x="11" y="16" width="10" height="8" fill="#ff6600"/>
    <!-- center -->
    <rect x="12" y="8" width="8" height="8" fill="#ffcc00"/>
    <!-- face -->
    <rect x="13" y="10" width="3" height="3" fill="#000"/>
    <rect x="17" y="10" width="3" height="3" fill="#000"/>
    <rect x="14" y="14" width="4" height="2" fill="#000"/>
  </g>
  <!-- Item 3: star (yellow 5-pointed) -->
  <g transform="translate(96,0)">
    <!-- approximate star with rectangles -->
    <rect x="13" y="2" width="6" height="28" fill="#ffdd00"/>
    <rect x="2" y="10" width="28" height="8" fill="#ffdd00"/>
    <rect x="6" y="4" width="20" height="24" fill="#ffdd00" transform="rotate(36 16 16)"/>
    <!-- center brighter -->
    <rect x="10" y="10" width="12" height="12" fill="#ffee44"/>
    <!-- sparkle points -->
    <rect x="14" y="2" width="4" height="6" fill="#ffee44"/>
    <rect x="14" y="24" width="4" height="6" fill="#ffee44"/>
    <rect x="2" y="13" width="6" height="6" fill="#ffee44"/>
    <rect x="24" y="13" width="6" height="6" fill="#ffee44"/>
  </g>
  <!-- Item 4: 1-up mushroom (green) -->
  <g transform="translate(128,0)">
    <rect x="4" y="2" width="24" height="18" fill="#22aa22" rx="4"/>
    <rect x="2" y="10" width="28" height="10" fill="#22aa22"/>
    <rect x="6" y="6" width="6" height="6" fill="#ffffff" rx="2"/>
    <rect x="20" y="6" width="6" height="6" fill="#ffffff" rx="2"/>
    <rect x="13" y="12" width="6" height="6" fill="#ffffff" rx="2"/>
    <rect x="8" y="20" width="16" height="10" fill="#f4e8c8"/>
    <rect x="10" y="22" width="4" height="4" fill="#000"/>
    <rect x="18" y="22" width="4" height="4" fill="#000"/>
    <!-- "1" text hint -->
    <rect x="14" y="22" width="4" height="8" fill="#228800"/>
    <rect x="12" y="22" width="6" height="2" fill="#228800"/>
  </g>
  <!-- Item 5: koopa shell (green, detached) -->
  <g transform="translate(160,0)">
    <rect x="4" y="8" width="24" height="20" fill="#228b22"/>
    <rect x="6" y="6" width="20" height="4" fill="#228b22"/>
    <rect x="6" y="26" width="20" height="4" fill="#228b22"/>
    <rect x="6" y="12" width="20" height="2" fill="#1a6b1a"/>
    <rect x="6" y="18" width="20" height="2" fill="#1a6b1a"/>
    <rect x="14" y="6" width="2" height="22" fill="#1a6b1a"/>
    <rect x="6" y="8" width="16" height="2" fill="#44cc44"/>
  </g>
  <!-- Item 6: hazard spike (grey metal spike) -->
  <g transform="translate(192,0)">
    <!-- spike base -->
    <rect x="0" y="22" width="32" height="10" fill="#888"/>
    <!-- spikes -->
    <rect x="4" y="8" width="6" height="16" fill="#aaa"/>
    <polygon points="7,4 4,22 10,22" fill="#aaa"/>
    <rect x="13" y="6" width="6" height="18" fill="#aaa"/>
    <polygon points="16,2 13,22 19,22" fill="#aaa"/>
    <rect x="22" y="8" width="6" height="16" fill="#aaa"/>
    <polygon points="25,4 22,22 28,22" fill="#aaa"/>
    <!-- shine on spike tips -->
    <rect x="6" y="4" width="2" height="2" fill="#ddd"/>
    <rect x="15" y="2" width="2" height="2" fill="#ddd"/>
    <rect x="24" y="4" width="2" height="2" fill="#ddd"/>
  </g>
  <!-- Item 7: breakable brick (cracked) -->
  <g transform="translate(224,0)">
    <rect width="32" height="32" fill="#cc6622"/>
    <rect x="0" y="0" width="32" height="1" fill="#aa4400"/>
    <rect x="0" y="8" width="32" height="1" fill="#aa4400"/>
    <rect x="0" y="16" width="32" height="1" fill="#aa4400"/>
    <rect x="0" y="24" width="32" height="1" fill="#aa4400"/>
    <rect x="16" y="0" width="1" height="8" fill="#aa4400"/>
    <rect x="0" y="8" width="1" height="8" fill="#aa4400"/>
    <rect x="16" y="16" width="1" height="8" fill="#aa4400"/>
    <!-- crack lines -->
    <rect x="8" y="2" width="1" height="6" fill="#7a3300" transform="rotate(10 8 5)"/>
    <rect x="20" y="10" width="1" height="8" fill="#7a3300" transform="rotate(-8 20 14)"/>
  </g>
  <!-- Item 8: coin block (orange with coin symbol) -->
  <g transform="translate(256,0)">
    <rect width="32" height="32" fill="#f0a000"/>
    <rect x="1" y="1" width="30" height="2" fill="#ffc000"/>
    <rect x="1" y="1" width="2" height="30" fill="#ffc000"/>
    <rect x="1" y="29" width="30" height="2" fill="#8a5800"/>
    <rect x="29" y="1" width="2" height="30" fill="#8a5800"/>
    <!-- coin symbol -->
    <rect x="12" y="6" width="8" height="20" fill="#ffd800" rx="4"/>
    <rect x="10" y="10" width="12" height="12" fill="#ffd800"/>
    <rect x="13" y="8" width="6" height="4" fill="#ffd800"/>
    <rect x="13" y="20" width="6" height="4" fill="#ffd800"/>
    <rect x="13" y="10" width="3" height="8" fill="#fff8a0"/>
  </g>
</svg>

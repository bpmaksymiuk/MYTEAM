<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 32" width="256" height="32">
  <!-- Tileset strip: 8 tiles × 32×32 -->
  <!-- Tile 0: solid ground (brown dirt top with green grass) -->
  <g transform="translate(0,0)">
    <rect width="32" height="32" fill="#8b6914"/>
    <rect width="32" height="8" fill="#4a7c20"/>
    <!-- grass blades -->
    <rect x="4" y="0" width="2" height="4" fill="#66aa33"/>
    <rect x="10" y="0" width="2" height="5" fill="#66aa33"/>
    <rect x="18" y="0" width="2" height="3" fill="#66aa33"/>
    <rect x="25" y="0" width="2" height="4" fill="#66aa33"/>
    <!-- dirt texture -->
    <rect x="4" y="14" width="6" height="4" fill="#7a5c0a" opacity="0.5"/>
    <rect x="18" y="20" width="5" height="4" fill="#7a5c0a" opacity="0.5"/>
  </g>
  <!-- Tile 1: solid platform (brick) -->
  <g transform="translate(32,0)">
    <rect width="32" height="32" fill="#cc6622"/>
    <!-- brick pattern -->
    <rect x="0" y="0" width="32" height="1" fill="#aa4400"/>
    <rect x="0" y="8" width="32" height="1" fill="#aa4400"/>
    <rect x="0" y="16" width="32" height="1" fill="#aa4400"/>
    <rect x="0" y="24" width="32" height="1" fill="#aa4400"/>
    <rect x="0" y="31" width="32" height="1" fill="#aa4400"/>
    <rect x="16" y="0" width="1" height="8" fill="#aa4400"/>
    <rect x="0" y="8" width="1" height="8" fill="#aa4400"/>
    <rect x="16" y="16" width="1" height="8" fill="#aa4400"/>
    <rect x="0" y="24" width="1" height="8" fill="#aa4400"/>
  </g>
  <!-- Tile 2: one-way platform (thin wooden) -->
  <g transform="translate(64,0)">
    <rect width="32" height="12" fill="#c8a060"/>
    <!-- wood grain -->
    <rect x="0" y="4" width="32" height="1" fill="#a07838"/>
    <rect x="0" y="8" width="32" height="1" fill="#a07838"/>
    <rect x="8" y="0" width="1" height="12" fill="#a07838" opacity="0.5"/>
    <rect x="16" y="0" width="1" height="12" fill="#a07838" opacity="0.5"/>
    <rect x="24" y="0" width="1" height="12" fill="#a07838" opacity="0.5"/>
  </g>
  <!-- Tile 3: question block (yellow with ?) -->
  <g transform="translate(96,0)">
    <rect width="32" height="32" fill="#f0c000"/>
    <rect x="1" y="1" width="30" height="2" fill="#ffd800"/>
    <rect x="1" y="1" width="2" height="30" fill="#ffd800"/>
    <rect x="1" y="29" width="30" height="2" fill="#a08000"/>
    <rect x="29" y="1" width="2" height="30" fill="#a08000"/>
    <!-- ? mark -->
    <rect x="11" y="6" width="10" height="4" fill="#6b4800"/>
    <rect x="11" y="6" width="3" height="12" fill="#6b4800"/>
    <rect x="15" y="10" width="6" height="4" fill="#6b4800"/>
    <rect x="15" y="14" width="3" height="4" fill="#6b4800"/>
    <rect x="14" y="20" width="4" height="4" fill="#6b4800"/>
  </g>
  <!-- Tile 4: used/empty block (grey) -->
  <g transform="translate(128,0)">
    <rect width="32" height="32" fill="#888"/>
    <rect x="1" y="1" width="30" height="2" fill="#aaa"/>
    <rect x="1" y="1" width="2" height="30" fill="#aaa"/>
    <rect x="1" y="29" width="30" height="2" fill="#555"/>
    <rect x="29" y="1" width="2" height="30" fill="#555"/>
    <rect x="8" y="14" width="16" height="4" fill="#666"/>
  </g>
  <!-- Tile 5: decorative background tile (sky blue) -->
  <g transform="translate(160,0)">
    <rect width="32" height="32" fill="#5c94fc"/>
    <!-- small cloud hint -->
    <rect x="4" y="6" width="12" height="4" fill="#ffffff" opacity="0.6"/>
    <rect x="6" y="4" width="8" height="3" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Tile 6: pipe top (green) -->
  <g transform="translate(192,0)">
    <rect width="32" height="32" fill="#2a8a2a"/>
    <!-- pipe top lip -->
    <rect x="0" y="0" width="32" height="8" fill="#33aa33"/>
    <rect x="2" y="0" width="28" height="2" fill="#55cc55"/>
    <!-- pipe body lines -->
    <rect x="6" y="8" width="3" height="24" fill="#33aa33"/>
    <rect x="6" y="8" width="1" height="24" fill="#55cc55"/>
  </g>
  <!-- Tile 7: hidden block (plain solid, looks same as background) -->
  <g transform="translate(224,0)">
    <rect width="32" height="32" fill="#5c94fc"/>
    <!-- subtle shimmer when active (orange highlight) stored separately — invisible at runtime -->
    <rect x="0" y="0" width="32" height="32" fill="transparent" stroke="#f0c000" stroke-width="0" id="hidden-active"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book1 - Excel</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- DI-002: Menu bar with 8 tabs (BR-003) -->
  <div id="menu-bar">
    <button class="menu-tab active" data-tab="Home">File</button>
    <button class="menu-tab" data-tab="Home">Home</button>
    <button class="menu-tab" data-tab="Insert">Insert</button>
    <button class="menu-tab" data-tab="PageLayout">Page Layout</button>
    <button class="menu-tab" data-tab="Formulas">Formulas</button>
    <button class="menu-tab" data-tab="Data">Data</button>
    <button class="menu-tab" data-tab="Review">Review</button>
    <button class="menu-tab" data-tab="View">View</button>
  </div>

  <!-- DI-003: Ribbon toolbar (BR-004) -->
  <div id="ribbon">
    <!-- Ribbon groups rendered by RibbonComponent in app.js -->
  </div>

  <!-- DI-004: Formula area with Name Box and formula bar (BR-005, BR-006) -->
  <div id="formula-area">
    <input id="name-box" type="text" value="A1" aria-label="Name Box">
    <span id="fx-label">fx</span>
    <input id="formula-bar" type="text" aria-label="Formula Bar">
  </div>

  <!-- DI-005: Spreadsheet grid (BR-007, BR-008) -->
  <div id="grid-container">
    <table id="grid">
      <!-- Rendered by GridRenderer in app.js -->
    </table>
  </div>

  <!-- DI-010: Sheet tab bar (BR-009, BR-010, BR-011) -->
  <div id="sheet-tab-bar">
    <div id="sheet-tabs">
      <!-- Tabs rendered by SheetManager in app.js -->
    </div>
    <button id="add-sheet-btn" title="Add sheet">+</button>
  </div>

  <!-- DI-013: Help dialog (BR-058) -->
  <dialog id="help-dialog">
    <h3 style="margin-top:0">Keyboard Shortcuts</h3>
    <table id="help-table">
      <!-- Rows rendered by HelpDialog in app.js -->
    </table>
    <div style="text-align:right;margin-top:12px">
      <button id="help-close-btn">Close</button>
    </div>
  </dialog>

  <!-- DI-011: Context menu (BR-040–BR-047) -->
  <div id="context-menu" role="menu" aria-label="Cell context menu">
    <!-- Items rendered by ContextMenu in app.js -->
  </div>

  <script src="app.js"></script>
</body>
</html>

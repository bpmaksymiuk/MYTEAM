<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="garr3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#2ea043"/>
    </marker>
    <marker id="rarr3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#da3633"/>
    </marker>
    <marker id="yarr3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#9e6a03"/>
    </marker>
  </defs>

  <rect width="800" height="340" fill="url(#bg3)" rx="12"/>
  <rect width="800" height="340" fill="none" stroke="#21262d" stroke-width="1.5" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3" letter-spacing="0.3">MT2 Gate Failure &amp; Recovery</text>
  <line x1="40" y1="42" x2="760" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- HAPPY PATH LABEL -->
  <text x="50" y="72" font-size="10" font-weight="600" fill="#3fb950">HAPPY PATH</text>

  <!-- Stage N -->
  <rect x="50" y="82" width="120" height="52" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="110" y="103" text-anchor="middle" font-size="11" fill="#8b949e">Stage N</text>
  <text x="110" y="120" text-anchor="middle" font-size="9" fill="#c9d1d9">Agent produces artifact</text>
  <line x1="170" y1="108" x2="206" y2="108" stroke="#3d444d" stroke-width="1.5" marker-end="url(#garr3)"/>

  <!-- Exit gate PASS -->
  <rect x="206" y="82" width="120" height="52" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="266" y="103" text-anchor="middle" font-size="11" fill="#3fb950">Exit Gate</text>
  <text x="266" y="120" text-anchor="middle" font-size="9" fill="#3fb950">PASS</text>
  <line x1="326" y1="108" x2="362" y2="108" stroke="#2ea043" stroke-width="1.5" marker-end="url(#garr3)"/>
  <text x="344" y="102" text-anchor="middle" font-size="9" fill="#3fb950">PASS</text>

  <!-- Stage N+1 -->
  <rect x="362" y="82" width="120" height="52" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="422" y="103" text-anchor="middle" font-size="11" fill="#8b949e">Stage N+1</text>
  <text x="422" y="120" text-anchor="middle" font-size="9" fill="#c9d1d9">Next agent starts</text>
  <line x1="482" y1="108" x2="530" y2="108" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="506" y="102" text-anchor="middle" font-size="9" fill="#3fb950">→ continues</text>

  <!-- FAILURE PATH LABEL -->
  <text x="50" y="172" font-size="10" font-weight="600" fill="#da3633">FAILURE PATH</text>

  <!-- Stage N fail -->
  <rect x="50" y="182" width="120" height="52" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="110" y="203" text-anchor="middle" font-size="11" fill="#8b949e">Stage N</text>
  <text x="110" y="220" text-anchor="middle" font-size="9" fill="#c9d1d9">Agent produces artifact</text>
  <line x1="170" y1="208" x2="206" y2="208" stroke="#da3633" stroke-width="1.5" marker-end="url(#rarr3)"/>

  <!-- Exit gate FAIL -->
  <rect x="206" y="182" width="120" height="52" rx="8" fill="#1c1012" stroke="#da3633" stroke-width="2"/>
  <text x="266" y="203" text-anchor="middle" font-size="11" fill="#da3633">Exit Gate</text>
  <text x="266" y="220" text-anchor="middle" font-size="9" fill="#da3633">FAIL</text>

  <!-- Down to Auditor -->
  <line x1="266" y1="234" x2="266" y2="262" stroke="#da3633" stroke-width="1.5" marker-end="url(#rarr3)"/>

  <!-- Auditor -->
  <rect x="180" y="262" width="170" height="46" rx="8" fill="#1c1012" stroke="#da3633" stroke-width="1.5"/>
  <text x="265" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#da3633">Auditor</text>
  <text x="265" y="298" text-anchor="middle" font-size="9" fill="#8b949e">Appends to X-AUDIT-REPORT.md</text>

  <!-- Auditor → Manager -->
  <line x1="350" y1="285" x2="388" y2="285" stroke="#d29922" stroke-width="1.5" marker-end="url(#yarr3)"/>
  <text x="369" y="279" text-anchor="middle" font-size="9" fill="#d29922">informs</text>

  <!-- Manager -->
  <rect x="388" y="262" width="170" height="46" rx="8" fill="#1c1a10" stroke="#9e6a03" stroke-width="2"/>
  <text x="473" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#d29922">Manager</text>
  <text x="473" y="298" text-anchor="middle" font-size="9" fill="#8b949e">Routes back to owning stage</text>

  <!-- Manager arc back to Stage N -->
  <path d="M473 262 Q473 230 110 230 Q110 236 110 234" fill="none" stroke="#9e6a03" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#yarr3)"/>
  <text x="290" y="244" text-anchor="middle" font-size="8" fill="#d29922">re-run owning stage</text>

  <!-- After recovery -->
  <rect x="590" y="262" width="140" height="46" rx="8" fill="#1c2128" stroke="#2ea043" stroke-width="2"/>
  <text x="660" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">Gate Re-check</text>
  <text x="660" y="298" text-anchor="middle" font-size="9" fill="#3fb950">PASS → continue</text>
  <line x1="558" y1="285" x2="590" y2="285" stroke="#2ea043" stroke-width="1.5" marker-end="url(#garr3)"/>
  <text x="574" y="279" font-size="8" fill="#3fb950">PASS</text>

  <!-- Rules -->
  <rect x="50" y="320" width="700" height="0" rx="4"/>
</svg>

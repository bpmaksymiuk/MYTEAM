<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="barr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#3d444d"/>
    </marker>
    <marker id="garr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#2ea043"/>
    </marker>
  </defs>

  <rect width="1000" height="220" fill="url(#bg2)" rx="12"/>
  <rect width="1000" height="220" fill="none" stroke="#21262d" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3" letter-spacing="0.3">MT2 Traceability Chain — Intent to Evidence</text>
  <line x1="40" y1="42" x2="960" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- Node: UC -->
  <rect x="40" y="60" width="110" height="60" rx="8" fill="#1c2128" stroke="#1f6feb" stroke-width="2"/>
  <text x="95" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#79c0ff">UC</text>
  <text x="95" y="99" text-anchor="middle" font-size="9" fill="#8b949e">Use Case</text>
  <text x="95" y="112" text-anchor="middle" font-size="8" fill="#6e7681">1-USE-CASES.md</text>

  <line x1="150" y1="90" x2="178" y2="90" stroke="#3d444d" stroke-width="2" marker-end="url(#barr)"/>

  <!-- Node: BR -->
  <rect x="178" y="60" width="110" height="60" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="233" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#79c0ff">BR</text>
  <text x="233" y="99" text-anchor="middle" font-size="9" fill="#8b949e">Business Req.</text>
  <text x="233" y="112" text-anchor="middle" font-size="8" fill="#6e7681">4-REQUIREMENTS.md</text>

  <line x1="288" y1="90" x2="316" y2="90" stroke="#3d444d" stroke-width="2" marker-end="url(#barr)"/>

  <!-- Node: AR + PT (stacked) -->
  <rect x="316" y="60" width="110" height="28" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <text x="371" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#f78166">AR</text>
  <rect x="316" y="92" width="110" height="28" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <text x="371" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#f78166">PT</text>
  <text x="316" y="138" text-anchor="middle" font-size="8" fill="#6e7681">5-ARCHITECTURE /</text>
  <text x="316" y="148" text-anchor="middle" font-size="8" fill="#6e7681">5-PARTS LIST</text>

  <line x1="426" y1="90" x2="454" y2="90" stroke="#3d444d" stroke-width="2" marker-end="url(#barr)"/>

  <!-- Node: DI -->
  <rect x="454" y="60" width="110" height="60" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="509" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#79c0ff">DI</text>
  <text x="509" y="99" text-anchor="middle" font-size="9" fill="#8b949e">Design Instruction</text>
  <text x="509" y="112" text-anchor="middle" font-size="8" fill="#6e7681">6-DESIGN-INSTRUCTIONS</text>

  <!-- DI fans out to Code, TC, GA -->
  <line x1="564" y1="80" x2="590" y2="68" stroke="#3d444d" stroke-width="1.5" marker-end="url(#barr)"/>
  <line x1="564" y1="90" x2="590" y2="90" stroke="#3d444d" stroke-width="1.5" marker-end="url(#barr)"/>
  <line x1="564" y1="100" x2="590" y2="112" stroke="#3d444d" stroke-width="1.5" marker-end="url(#barr)"/>

  <!-- Node: Code -->
  <rect x="590" y="54" width="100" height="28" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="640" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#3fb950">./build/**</text>

  <!-- Node: TC -->
  <rect x="590" y="76" width="100" height="28" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="640" y="94" text-anchor="middle" font-size="10" font-weight="600" fill="#3fb950">TC  (Text)</text>

  <!-- Node: GA -->
  <rect x="590" y="98" width="100" height="28" rx="6" fill="#161b22" stroke="#9e6a03" stroke-width="1.5"/>
  <text x="640" y="116" text-anchor="middle" font-size="10" font-weight="600" fill="#d29922">GA  (Image)</text>

  <!-- Converge to T -->
  <line x1="690" y1="68" x2="716" y2="96" stroke="#3d444d" stroke-width="1.5" marker-end="url(#garr)"/>
  <line x1="690" y1="90" x2="716" y2="96" stroke="#3d444d" stroke-width="1.5" marker-end="url(#garr)"/>
  <line x1="690" y1="112" x2="716" y2="100" stroke="#3d444d" stroke-width="1.5" marker-end="url(#garr)"/>

  <!-- Node: T -->
  <rect x="716" y="60" width="110" height="60" rx="8" fill="#1c2128" stroke="#2ea043" stroke-width="2"/>
  <text x="771" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#3fb950">T</text>
  <text x="771" y="99" text-anchor="middle" font-size="9" fill="#8b949e">Test Case / Report</text>
  <text x="771" y="112" text-anchor="middle" font-size="8" fill="#6e7681">10-TEST-CASES/REPORT</text>

  <line x1="826" y1="90" x2="854" y2="90" stroke="#2ea043" stroke-width="2" marker-end="url(#garr)"/>

  <!-- Node: RELEASE -->
  <rect x="854" y="60" width="110" height="60" rx="8" fill="#1c2128" stroke="#2ea043" stroke-width="2.5"/>
  <text x="909" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#3fb950">RELEASE</text>
  <text x="909" y="99" text-anchor="middle" font-size="9" fill="#8b949e">Recommendation</text>
  <text x="909" y="112" text-anchor="middle" font-size="8" fill="#3fb950">PASS / FAIL / COND.</text>

  <!-- Bottom legend -->
  <rect x="40" y="158" width="920" height="44" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="56" y="175" font-size="9" fill="#6e7681">Every record in every artifact carries a RELATED field linking it to its upstream IDs.</text>
  <text x="56" y="191" font-size="9" fill="#6e7681">Full chain: UC → BR → AR/PT → DI → ./build + TC + GA → T (test case) → Release Recommendation</text>
</svg>

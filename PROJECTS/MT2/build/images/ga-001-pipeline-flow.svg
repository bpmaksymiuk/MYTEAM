  <rect x="82" y="280" width="10" height="10" rx="2" fill="#1f6feb"/>
  <text x="98" y="290" font-size="9" fill="#8b949e">User / Analyst / Tech Lead</text>
  <rect x="232" y="280" width="10" height="10" rx="2" fill="#2ea043"/>
  <text x="248" y="290" font-size="9" fill="#8b949e">Writer / Tester</text>

      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#3d444d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)" rx="12"/>
  <rect width="1200" height="340" fill="none" stroke="#21262d" stroke-width="1.5" rx="12"/>


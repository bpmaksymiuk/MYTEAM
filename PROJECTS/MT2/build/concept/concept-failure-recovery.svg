<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="monospace, sans-serif">
  <rect width="860" height="500" fill="#0d1117"/>
  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">MT2 — Gate Failure &amp; Recovery Flow</text>
  <text x="430" y="52" text-anchor="middle" font-size="11" fill="#8b949e">How the Manager and Auditor keep the pipeline moving when a gate fails</text>

  <!-- Happy path label -->
  <text x="40" y="100" font-size="11" fill="#3fb950">HAPPY PATH</text>
  <!-- Boxes: Stage N -->
  <rect x="40" y="110" width="110" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="95" y="130" text-anchor="middle" font-size="11" fill="#c9d1d9">Stage N</text>
  <text x="95" y="146" text-anchor="middle" font-size="9" fill="#8b949e">Agent produces artifact</text>

  <line x1="150" y1="132" x2="200" y2="132" stroke="#3fb950" stroke-width="1.5" marker-end="url(#garr)"/>

  <!-- Exit gate -->
  <rect x="200" y="110" width="110" height="44" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="255" y="130" text-anchor="middle" font-size="11" fill="#3fb950">Exit Gate</text>
  <text x="255" y="146" text-anchor="middle" font-size="9" fill="#8b949e">Agent self-checks</text>

  <!-- PASS arrow -->
  <line x1="310" y1="132" x2="360" y2="132" stroke="#3fb950" stroke-width="1.5" marker-end="url(#garr)"/>
  <text x="335" y="126" text-anchor="middle" font-size="9" fill="#3fb950">PASS</text>

  <!-- Stage N+1 -->
  <rect x="360" y="110" width="110" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="415" y="130" text-anchor="middle" font-size="11" fill="#c9d1d9">Stage N+1</text>
  <text x="415" y="146" text-anchor="middle" font-size="9" fill="#8b949e">Next agent starts</text>

  <line x1="470" y1="132" x2="530" y2="132" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="500" y="126" text-anchor="middle" font-size="9" fill="#3fb950">→ continues</text>

  <!-- Failure path label -->
  <text x="40" y="230" font-size="11" fill="#f78166">FAILURE PATH</text>

  <!-- Stage N box -->
  <rect x="40" y="240" width="110" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="95" y="260" text-anchor="middle" font-size="11" fill="#c9d1d9">Stage N</text>
  <text x="95" y="276" text-anchor="middle" font-size="9" fill="#8b949e">Agent produces artifact</text>

  <line x1="150" y1="262" x2="200" y2="262" stroke="#f78166" stroke-width="1.5" marker-end="url(#rarr)"/>

  <!-- Exit gate FAIL -->
  <rect x="200" y="240" width="110" height="44" rx="6" fill="#21262d" stroke="#f78166" stroke-width="1.5"/>
  <text x="255" y="260" text-anchor="middle" font-size="11" fill="#f78166">Exit Gate</text>
  <text x="255" y="276" text-anchor="middle" font-size="9" fill="#f78166">FAIL</text>

  <!-- FAIL down to Auditor -->
  <line x1="255" y1="284" x2="255" y2="340" stroke="#f78166" stroke-width="1.5" marker-end="url(#rarr)"/>
  <text x="265" y="318" font-size="9" fill="#f78166">flags violation</text>

  <!-- Auditor -->
  <rect x="170" y="340" width="170" height="44" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <text x="255" y="360" text-anchor="middle" font-size="11" fill="#f78166">Auditor</text>
  <text x="255" y="376" text-anchor="middle" font-size="9" fill="#8b949e">Documents in X-AUDIT-REPORT.md</text>

  <!-- Auditor to Manager -->
  <line x1="340" y1="362" x2="420" y2="362" stroke="#d29922" stroke-width="1.5" marker-end="url(#yarr)"/>
  <text x="380" y="356" text-anchor="middle" font-size="9" fill="#d29922">informs</text>

  <!-- Manager -->
  <rect x="420" y="340" width="170" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="505" y="360" text-anchor="middle" font-size="11" fill="#d29922">Manager</text>
  <text x="505" y="376" text-anchor="middle" font-size="9" fill="#8b949e">Routes back to owning stage</text>

  <!-- Manager back to Stage N -->
  <path d="M505 340 Q505 290 95 290 Q95 285 95 284" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#yarr)"/>
  <text x="300" y="308" text-anchor="middle" font-size="9" fill="#d29922">re-run owning stage</text>

  <!-- After rerun -->
  <rect x="620" y="340" width="130" height="44" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="685" y="360" text-anchor="middle" font-size="11" fill="#3fb950">Gate Re-check</text>
  <text x="685" y="376" text-anchor="middle" font-size="9" fill="#3fb950">PASS → continue</text>

  <line x1="590" y1="362" x2="620" y2="362" stroke="#3fb950" stroke-width="1.5" marker-end="url(#garr)"/>
  <text x="606" y="356" font-size="8" fill="#3fb950">PASS</text>

  <!-- Rules box -->
  <rect x="40" y="428" width="780" height="58" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="446" font-size="11" font-weight="bold" fill="#e6edf3">Recovery Rules</text>
  <text x="56" y="462" font-size="10" fill="#8b949e">Manager never edits an artifact directly · Failure routes BACK to the stage that owns the broken artifact</text>
  <text x="56" y="477" font-size="10" fill="#8b949e">All downstream stages re-run in order after recovery · All failure events are recorded (append-only)</text>

  <defs>
    <marker id="garr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="rarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f78166"/>
    </marker>
    <marker id="yarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d29922"/>
    </marker>
  </defs>
</svg>

  <text x="50" y="274" font-size="10" fill="#58a6ff" font-weight="bold">UC</text>
  <text x="80" y="274" font-size="10" fill="#c9d1d9">Use Case — approved intent (1-USE-CASES.md)</text>

  <text x="50" y="294" font-size="10" fill="#58a6ff" font-weight="bold">BR</text>
  <text x="80" y="294" font-size="10" fill="#c9d1d9">Business Requirement — atomic, testable shall statement (4-REQUIREMENTS.md)</text>

  <text x="50" y="314" font-size="10" fill="#f78166" font-weight="bold">AR</text>
  <text x="80" y="314" font-size="10" fill="#c9d1d9">Architecture Recommendation (5-ARCHITECTURE-RECOMMENDATIONS.md)</text>

  <text x="50" y="334" font-size="10" fill="#f78166" font-weight="bold">PT</text>
  <text x="80" y="334" font-size="10" fill="#c9d1d9">Part — concrete technology component (5-PARTS LIST.md)</text>

  <text x="430" y="274" font-size="10" fill="#58a6ff" font-weight="bold">DI</text>
  <text x="460" y="274" font-size="10" fill="#c9d1d9">Design Instruction — implementation-ready spec (6-DESIGN-INSTRUCTIONS.md)</text>

  <text x="430" y="294" font-size="10" fill="#3fb950" font-weight="bold">TC</text>
  <text x="460" y="294" font-size="10" fill="#c9d1d9">Text Content record (7-TEXT-CONTENT.md + ./build/text/)</text>

  <text x="430" y="314" font-size="10" fill="#d29922" font-weight="bold">GL</text>
  <text x="460" y="314" font-size="10" fill="#c9d1d9">Glossary entry (7-TEXT-CONTENT.md)</text>

  <text x="430" y="334" font-size="10" fill="#3fb950" font-weight="bold">T</text>
  <text x="460" y="334" font-size="10" fill="#c9d1d9">Test Case — maps to UC + BR, verified in 10-TEST-REPORT.md</text>

  <defs>
    <marker id="barr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="rarr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f78166"/>
    </marker>

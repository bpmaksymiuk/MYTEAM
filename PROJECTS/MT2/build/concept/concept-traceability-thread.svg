  <text x="80" y="142" text-anchor="middle" font-size="9" fill="#c9d1d9">Approved intent</text>

  <line x1="130" y1="118" x2="165" y2="118" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#barr)"/>

  <!-- BR -->
  <rect x="165" y="90" width="100" height="56" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>

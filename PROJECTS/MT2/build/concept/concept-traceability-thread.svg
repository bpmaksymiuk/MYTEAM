  <text x="355" y="129" text-anchor="middle" font-size="9" fill="#8b949e">5-ARCHITECTURE.md</text>
  <text x="355" y="142" text-anchor="middle" font-size="9" fill="#c9d1d9">Tech decision + Part</text>

  <line x1="410" y1="118" x2="445" y2="118" stroke="#f78166" stroke-width="1.5" marker-end="url(#rarr2)"/>

  <!-- DI -->
  <rect x="445" y="90" width="100" height="56" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>

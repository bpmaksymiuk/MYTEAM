  <line x1="545" y1="118" x2="580" y2="118" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#barr)"/>

  <!-- Code + TC + GL -->
  <rect x="580" y="78" width="110" height="30" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="635" y="97" text-anchor="middle" font-size="10" fill="#3fb950">./build/** (Code)</text>

  <rect x="580" y="115" width="110" height="30" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="635" y="134" text-anchor="middle" font-size="10" fill="#3fb950">TC-XXX (Text)</text>

  <rect x="580" y="152" width="110" height="30" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="635" y="171" text-anchor="middle" font-size="10" fill="#d29922">GL-XXX (Glossary)</text>

  <line x1="690" y1="93" x2="725" y2="175" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="690" y1="130" x2="725" y2="175" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="690" y1="167" x2="725" y2="175" stroke="#d29922" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Test -->
  <rect x="725" y="157" width="110" height="56" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="780" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#3fb950">T-XXX</text>
  <text x="780" y="196" text-anchor="middle" font-size="9" fill="#8b949e">10-TEST-CASES.md</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="monospace, sans-serif">
  <rect width="860" height="480" fill="#0d1117"/>
  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">MT2 — Skill File Structure</text>
  <text x="430" y="52" text-anchor="middle" font-size="11" fill="#8b949e">One SKILL.md per stage · Procedure + Schema + Exit Gate</text>

  <!-- Directory tree -->
  <!-- Root -->
  <text x="40" y="90" font-size="13" fill="#58a6ff" font-weight="bold">./build/.github/</text>

  <text x="60" y="115" font-size="12" fill="#c9d1d9">├── instructions/</text>
  <text x="80" y="135" font-size="11" fill="#8b949e">│   └── pipeline.instructions.md</text>
  <rect x="340" y="122" width="480" height="22" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="350" y="137" font-size="10" fill="#58a6ff">Stage table · Governance rules · Working directory · Execution model</text>

  <text x="60" y="162" font-size="12" fill="#c9d1d9">├── agents/</text>
  <text x="80" y="182" font-size="11" fill="#8b949e">│   ├── writer.agent.md</text>
  <text x="80" y="198" font-size="11" fill="#8b949e">│   ├── graphic-artist.agent.md</text>
  <text x="80" y="214" font-size="11" fill="#8b949e">│   ├── business-analyst.agent.md</text>
  <text x="80" y="230" font-size="11" fill="#8b949e">│   ├── architect.agent.md</text>
  <text x="80" y="246" font-size="11" fill="#8b949e">│   ├── technical-lead.agent.md</text>
  <text x="80" y="262" font-size="11" fill="#8b949e">│   ├── developer.agent.md</text>
  <text x="80" y="278" font-size="11" fill="#8b949e">│   ├── tester.agent.md</text>
  <text x="80" y="294" font-size="11" fill="#8b949e">│   ├── manager.agent.md</text>
  <text x="80" y="310" font-size="11" fill="#8b949e">│   └── auditor.agent.md</text>
  <rect x="340" y="170" width="480" height="152" rx="4" fill="#161b22" stroke="#d29922" stroke-width="1"/>
  <text x="350" y="188" font-size="10" fill="#d29922" font-weight="bold">Each .agent.md contains:</text>
  <text x="350" y="206" font-size="10" fill="#8b949e">  role:         Specialist description</text>
  <text x="350" y="222" font-size="10" fill="#8b949e">  tools:        Allowed tool list</text>
  <text x="350" y="238" font-size="10" fill="#8b949e">  stage:        Assigned stage number</text>
  <text x="350" y="254" font-size="10" fill="#8b949e">  owns:         Artifact(s) this agent produces</text>
  <text x="350" y="270" font-size="10" fill="#8b949e">  skill:        Path to SKILL.md</text>
  <text x="350" y="286" font-size="10" fill="#8b949e">  must-not:     Cross-edit prohibition list</text>
  <text x="350" y="302" font-size="10" fill="#8b949e">  exit-gate:    Exit criteria reference</text>
  <text x="350" y="318" font-size="10" fill="#3fb950">  → Read by VS Code Copilot agent mode</text>

  <text x="60" y="338" font-size="12" fill="#c9d1d9">├── skills/</text>
  <text x="80" y="358" font-size="11" fill="#8b949e">│   ├── use-case-authoring/SKILL.md</text>
  <text x="80" y="374" font-size="11" fill="#8b949e">│   ├── content-writing-authoring/SKILL.md</text>
  <text x="80" y="390" font-size="11" fill="#8b949e">│   ├── ... (one per stage) ...</text>
  <rect x="340" y="346" width="480" height="62" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="350" y="364" font-size="10" fill="#3fb950" font-weight="bold">Each SKILL.md contains:</text>
  <text x="350" y="380" font-size="10" fill="#8b949e">  When to Use · Target Files · Procedure · Schema · Exit Gate</text>
  <text x="350" y="396" font-size="10" fill="#8b949e">  → Loaded by agent before producing stage artifact</text>

  <text x="60" y="424" font-size="12" fill="#c9d1d9">└── copilot-instructions.md</text>
  <rect x="340" y="412" width="480" height="22" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="350" y="427" font-size="10" fill="#58a6ff">Workspace entry point · Lists all agents · References pipeline instruction file</text>
</svg>

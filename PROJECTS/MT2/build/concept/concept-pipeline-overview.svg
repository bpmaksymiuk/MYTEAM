<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="1100" height="520" fill="#0d1117"/>
  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#e6edf3">MT2 Pipeline — Stage Flow Overview</text>

  <!-- Stage boxes -->
  <!-- Stage 0 -->
  <rect x="20" y="80" width="90" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="65" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 0</text>
  <text x="65" y="118" text-anchor="middle" font-size="10" fill="#58a6ff">User / BA</text>
  <text x="65" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Proposed UCs</text>

  <!-- Arrow -->
  <line x1="110" y1="107" x2="130" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 1 -->
  <rect x="130" y="80" width="90" height="54" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="175" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 1</text>
  <text x="175" y="118" text-anchor="middle" font-size="10" fill="#58a6ff">User</text>
  <text x="175" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Approved UCs</text>

  <!-- Arrow -->
  <line x1="220" y1="107" x2="240" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="240" y="80" width="90" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="285" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 2</text>
  <text x="285" y="118" text-anchor="middle" font-size="10" fill="#3fb950">Writer</text>
  <text x="285" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Narrative Vision</text>

  <!-- Arrow -->
  <line x1="330" y1="107" x2="350" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <rect x="350" y="80" width="90" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="395" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 3</text>
  <text x="395" y="118" text-anchor="middle" font-size="10" fill="#d29922">Graphic Artist</text>
  <text x="395" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Concept Storyboard</text>

  <!-- Arrow -->
  <line x1="440" y1="107" x2="460" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 4 -->
  <rect x="460" y="80" width="90" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="505" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 4</text>
  <text x="505" y="118" text-anchor="middle" font-size="10" fill="#58a6ff">Business Analyst</text>
  <text x="505" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Requirements</text>

  <!-- Arrow -->
  <line x1="550" y1="107" x2="570" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 5 -->
  <rect x="570" y="80" width="90" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="615" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 5</text>
  <text x="615" y="118" text-anchor="middle" font-size="10" fill="#f78166">Architect</text>
  <text x="615" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Architecture</text>

  <!-- Arrow -->
  <line x1="660" y1="107" x2="680" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 6 -->
  <rect x="680" y="80" width="90" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="725" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 6</text>
  <text x="725" y="118" text-anchor="middle" font-size="10" fill="#58a6ff">Tech Lead</text>
  <text x="725" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Design Instructions</text>

  <!-- Arrow -->
  <line x1="770" y1="107" x2="790" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 7 -->
  <rect x="790" y="80" width="80" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="830" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 7</text>
  <text x="830" y="118" text-anchor="middle" font-size="10" fill="#3fb950">Writer</text>
  <text x="830" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Text Content</text>

  <!-- Arrow -->
  <line x1="870" y1="107" x2="890" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 8 -->
  <rect x="890" y="80" width="80" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="930" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 8</text>
  <text x="930" y="118" text-anchor="middle" font-size="10" fill="#d29922">Graphic Artist</text>
  <text x="930" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Final Assets</text>

  <!-- Arrow -->
  <line x1="970" y1="107" x2="990" y2="107" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 9 -->
  <rect x="990" y="80" width="90" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="1035" y="102" text-anchor="middle" font-size="11" fill="#8b949e">Stage 9</text>
  <text x="1035" y="118" text-anchor="middle" font-size="10" fill="#f78166">Developer</text>
  <text x="1035" y="130" text-anchor="middle" font-size="9" fill="#c9d1d9">Implementation</text>

  <!-- Stage 10 — below stage 9 -->
  <line x1="1035" y1="134" x2="1035" y2="170" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="990" y="170" width="90" height="54" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="1035" y="192" text-anchor="middle" font-size="11" fill="#8b949e">Stage 10</text>
  <text x="1035" y="208" text-anchor="middle" font-size="10" fill="#3fb950">Tester</text>
  <text x="1035" y="220" text-anchor="middle" font-size="9" fill="#c9d1d9">Verify &amp; Release</text>

  <!-- Manager bar -->
  <rect x="20" y="270" width="1060" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="550" y="285" text-anchor="middle" font-size="12" fill="#d29922" font-weight="bold">Manager</text>
  <text x="550" y="300" text-anchor="middle" font-size="10" fill="#8b949e">Detects gate failures · Routes work back to owning stage · Triggers downstream reruns · Never edits artifacts directly</text>

  <!-- Auditor bar -->
  <rect x="20" y="325" width="1060" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="550" y="340" text-anchor="middle" font-size="12" fill="#f78166" font-weight="bold">Auditor</text>
  <text x="550" y="355" text-anchor="middle" font-size="10" fill="#8b949e">Observes every stage · Documents violations in X-AUDIT-REPORT.md · Reports to Manager · Never fixes violations directly</text>

  <!-- Legend -->
  <rect x="20" y="390" width="1060" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="412" font-size="12" font-weight="bold" fill="#e6edf3">KEY PRINCIPLES</text>
  <text x="36" y="432" font-size="10" fill="#8b949e">1 agent per stage · Each stage owns exactly one set of artifacts · Exit gate must PASS before next stage begins</text>
  <text x="36" y="450" font-size="10" fill="#8b949e">No cross-editing of artifacts · Failures route BACK to owning stage · All history is append-only</text>
  <text x="36" y="468" font-size="10" fill="#58a6ff">Stage 1 (1-USE-CASES.md) is the single source of approved intent — all downstream artifacts trace back to it</text>
  <text x="36" y="486" font-size="10" fill="#3fb950">Output: ./build/.github/ — installable, self-contained pipeline framework for any future project</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#30363d"/>
    </marker>
  </defs>
</svg>
